<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Mapa interativo de pessoas, instituições, fatos e acusações da eleição presidencial de 2026 no Brasil, com fontes.">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Mapa da Eleição 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&family=Geist+Mono:wght@400;500&family=Geist:wght@300;400;500;600&display=swap">
<style>
/* Layout: o mapa ocupa a tela inteira sobre um fundo preto com grade de pontos e auras de cor;
   painéis de vidro escuro flutuam por cima, e a ficha do verbete é um cartão com aura da cor do tipo. */
:root {
  color-scheme: dark;
  --void: #050608;
  --glass: rgba(22, 24, 32, 0.62);
  --glass-strong: rgba(16, 18, 25, 0.86);
  --edge: rgba(255, 255, 255, 0.09);
  --edge-strong: rgba(255, 255, 255, 0.18);
  --fg: #f1f0f4;
  --fg-dim: #8f93a3;
  --fg-faint: #5d6170;
  --brass: #ffc684;          /* destaque luminoso (nome mantido por compatibilidade) */
  --glow-warm: #ff7a2f;
  --glow-cool: #2f8bff;
  /* tipos de verbete */
  --t-pessoa: #f4f1ea;
  --t-instituicao: #3d9bff;
  --t-evento: #ff9440;
  --t-tema: #9a6bff;
  --t-alegacao: #ff5fb0;
  /* status */
  --s-comprovado: #4fe0a6;
  --s-documentado: #6cb6ff;
  --s-alegacao: #ffb347;
  --s-boato: #a7a9b6;
  --s-desmentido: #ff6b6b;
  /* tipografia */
  --f-ui: "Geist", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --f-dot: "Doto", "Geist Mono", ui-monospace, monospace;
  --r-card: 28px;
  --r-pill: 999px;
}
html, body { height: 100%; }
body {
  color: var(--fg); font-family: var(--f-ui); font-weight: 400; overflow: hidden;
  background-color: var(--void);
  background-image:
    radial-gradient(30vmax 30vmax at -6% 80%, rgba(255,110,30,0.30), transparent 65%),
    radial-gradient(28vmax 26vmax at -4% 4%, rgba(255,120,50,0.16), transparent 65%),
    radial-gradient(30vmax 30vmax at 106% 18%, rgba(40,130,255,0.22), transparent 65%),
    radial-gradient(30vmax 30vmax at 106% 70%, rgba(40,130,255,0.14), transparent 65%),
    linear-gradient(180deg, #070a10, #05070b);
}
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 1.5px solid rgba(255,255,255,0.55); outline-offset: 2px; }

#mapa { position: fixed; inset: 0; }
#mapa canvas { display: block; }

.vidro {
  background: var(--glass);
  border: 1px solid var(--edge);
  -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 20px 50px rgba(0,0,0,0.45);
}

/* topo */
.topo {
  position: fixed; top: 0; left: 0; right: 0; z-index: 5;
  padding-top: calc(env(safe-area-inset-top, 0px) + 24px);
  padding-left: max(40px, env(safe-area-inset-left, 0px));
  padding-right: max(32px, env(safe-area-inset-right, 0px));
  padding-bottom: 10px;
  display: grid; grid-template-columns: 270px minmax(0, 530px) 1fr; gap: 40px; align-items: start;
  pointer-events: none;
}
.topo > * { pointer-events: auto; }
.marca { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.marca h1 { margin: 0; font-weight: 300; font-size: 1.45rem; letter-spacing: -0.01em; line-height: 1.15; }
.marca span { font-family: var(--f-mono); font-size: 0.62rem; color: var(--fg-dim); letter-spacing: 0.22em; text-transform: uppercase; }
.contagem { display: flex; gap: 14px; align-items: baseline; margin-top: 4px; }
.contagem b { font-family: var(--f-dot); font-weight: 800; font-size: 1.05rem; letter-spacing: 0.04em; color: var(--fg); }
.contagem small { font-family: var(--f-mono); font-size: 0.62rem; color: var(--fg-dim); text-transform: uppercase; letter-spacing: .12em; margin-left: 4px; }
.acoes { display: flex; justify-content: flex-end; gap: 8px; }
.marca .btn { align-self: flex-start; margin-top: 10px; padding: 7px 16px; font-size: 0.74rem; }

/* placar: análise à parte, com rótulo próprio e cor de destaque (não usa as cores dos tipos de verbete) */
.placar {
  width: 290px; max-width: 100%; border-radius: 18px; padding: 13px 16px 14px; cursor: pointer; text-align: left;
  display: flex; flex-direction: column; gap: 9px;
}
.placar:hover { border-color: rgba(255,198,132,0.45); }
.placar .rot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 0.58rem; letter-spacing: .2em; text-transform: uppercase; color: var(--fg-dim); }
.placar .rot em { font-style: normal; color: var(--brass); border: 1px solid rgba(255,198,132,0.4); border-radius: var(--r-pill); padding: 2px 8px; letter-spacing: .14em; }
.pl-linha { display: grid; grid-template-columns: 52px 1fr 42px; gap: 10px; align-items: center; }
.pl-linha span { font-size: 0.8rem; color: var(--fg); }
.pl-linha b { font-family: var(--f-dot); font-weight: 800; font-size: 1.05rem; text-align: right; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.pl-barra { height: 5px; border-radius: 5px; background: rgba(255,255,255,0.06); display: flex; overflow: hidden; }
.pl-barra i { display: block; height: 100%; }
.pl-barra .c { background: var(--brass); box-shadow: 0 0 8px rgba(255,198,132,0.6); }
.pl-barra .e { background: rgba(255,198,132,0.32); }

/* janela do placar */
.modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 24px 16px; }
.modal[hidden] { display: none; }
.modal-fundo { position: absolute; inset: 0; background: rgba(3,4,7,0.6); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.modal-caixa {
  position: relative; width: min(880px, 100%); max-height: min(86vh, 900px); display: flex; flex-direction: column;
  border-radius: var(--r-card); overflow: hidden; background: var(--glass-strong); border: 1px solid var(--edge);
  -webkit-backdrop-filter: blur(24px) saturate(150%); backdrop-filter: blur(24px) saturate(150%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 30px 80px rgba(0,0,0,0.6);
}
.modal-caixa::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 260px; pointer-events: none;
  background: radial-gradient(110% 90% at 50% -25%, rgba(255,170,90,0.32), transparent 70%);
}
.modal-topo { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 18px 18px 6px 28px; font-family: var(--f-mono); font-size: 0.66rem; text-transform: uppercase; letter-spacing: .14em; color: rgba(255,255,255,0.75); }
.modal-topo .bts { display: flex; gap: 8px; }
.modal-topo .fechar { white-space: nowrap; }
.modal-corpo { position: relative; overflow-y: auto; padding: 22px 28px 40px; font-size: 0.95rem; line-height: 1.6; color: #d9d9e1; }
.modal-corpo h2 { font-weight: 400; font-size: 1.9rem; line-height: 1.08; letter-spacing: -0.025em; margin: 0 0 12px; color: #fff; }
.modal-corpo .lead { font-size: 1rem; font-weight: 300; line-height: 1.5; color: #fff; margin: 0 0 22px; max-width: 70ch; }
.modal-corpo h3 { font-family: var(--f-mono); font-weight: 500; font-size: 0.64rem; letter-spacing: .16em; text-transform: uppercase; color: var(--fg-dim); margin: 30px 0 10px; }
.modal-corpo p { margin: 0 0 12px; max-width: 70ch; }
.modal-corpo a.ref { text-decoration: none; color: #fff; border-bottom: 1px solid rgba(255,198,132,0.7); cursor: pointer; }
.modal-corpo a.ref:hover { color: var(--brass); }
.resumo-pl { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.resumo-pl > div { border: 1px solid var(--edge); border-radius: 18px; padding: 16px 18px; background: rgba(255,255,255,0.025); display: flex; flex-direction: column; gap: 10px; }
.resumo-pl .nm { font-size: 0.95rem; color: #fff; }
.resumo-pl .tot { font-family: var(--f-dot); font-weight: 800; font-size: 2.3rem; line-height: 1; color: var(--brass); letter-spacing: .02em; }
.resumo-pl .sub { font-family: var(--f-mono); font-size: 0.64rem; color: var(--fg-dim); letter-spacing: .08em; text-transform: uppercase; display: flex; gap: 14px; flex-wrap: wrap; }
.resumo-pl .sub i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
.tbl-pl { overflow-x: auto; }
.tbl-pl table { border-collapse: collapse; width: 100%; font-size: 0.86rem; font-variant-numeric: tabular-nums; }
.tbl-pl th, .tbl-pl td { text-align: left; padding: 10px 10px 10px 0; border-bottom: 1px solid var(--edge); vertical-align: top; }
.tbl-pl th { font-family: var(--f-mono); font-weight: 500; font-size: 0.6rem; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-dim); white-space: nowrap; }
.tbl-pl .n { text-align: right; width: 4.2em; font-family: var(--f-mono); font-size: 0.78rem; color: var(--fg-dim); }
.tbl-pl .pz { text-align: right; width: 4.4em; font-family: var(--f-mono); font-size: 0.86rem; color: #fff; }
.tbl-pl th.n, .tbl-pl th.pz { font-family: var(--f-mono); font-size: 0.6rem; color: var(--fg-dim); }
.tbl-pl small { display: block; margin-top: 3px; color: var(--fg-dim); font-size: 0.78rem; line-height: 1.45; }
.tbl-pl tr.grp td { padding-top: 18px; font-family: var(--f-mono); font-size: 0.62rem; letter-spacing: .14em; text-transform: uppercase; color: var(--brass); border-bottom-color: rgba(255,198,132,0.25); }
.tbl-pl tr.grp td.pz { color: var(--brass); font-size: 0.78rem; }
.modal-corpo dl { margin: 0; display: grid; grid-template-columns: 7.5em 1fr; gap: 10px 16px; font-size: 0.9rem; }
.modal-corpo dt { font-family: var(--f-mono); font-size: 0.78rem; color: #fff; padding-top: 2px; }
.modal-corpo dd { margin: 0; }
.formula { font-family: var(--f-mono); font-size: 0.9rem; color: var(--brass); border: 1px solid rgba(255,198,132,0.3); border-radius: 14px; padding: 12px 16px; margin: 4px 0 16px; display: inline-block; }

.btn {
  border-radius: var(--r-pill); padding: 10px 20px; font-size: 0.8rem; cursor: pointer;
  background: var(--glass); border: 1px solid var(--edge);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.btn:hover { border-color: var(--edge-strong); background: rgba(40,44,58,0.7); }

/* busca */
.busca { position: relative; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.campo { display: flex; align-items: center; gap: 14px; border-radius: var(--r-pill); padding: 0 20px; }
.campo:focus-within { border-color: rgba(255,198,132,0.55); box-shadow: 0 0 0 4px rgba(255,198,132,0.08), 0 20px 50px rgba(0,0,0,0.45); }
.campo svg { flex: none; color: var(--fg-dim); }
#q { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: var(--fg); font-family: var(--f-ui); font-size: 0.86rem; padding: 11px 0; }
#q::placeholder { color: var(--fg-dim); }
#resultados {
  position: absolute; top: 48px; left: 0; right: 0; margin: 0; padding: 8px; list-style: none;
  border-radius: 22px; background: var(--glass-strong); max-height: 60vh; overflow-y: auto;
}
#resultados li { padding: 10px 12px; border-radius: 14px; cursor: pointer; display: grid; grid-template-columns: 10px 1fr; gap: 4px 12px; align-items: baseline; }
#resultados li[aria-selected="true"], #resultados li:hover { background: rgba(255,255,255,0.06); }
#resultados .pt { width: 8px; height: 8px; border-radius: 50%; align-self: center; }
#resultados b { font-weight: 500; }
#resultados small { grid-column: 2; color: var(--fg-dim); font-size: 0.8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.temas { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.temas::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border-radius: var(--r-pill); padding: 6px 18px; font-size: 0.74rem; color: var(--fg); cursor: pointer;
  background: rgba(20,22,30,0.55); border: 1px solid var(--edge);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.chip:hover { border-color: var(--edge-strong); }
.chip[aria-pressed="true"] {
  background: rgba(40,30,22,0.75); border: 1px solid rgba(255,190,120,0.75);
  box-shadow: 0 0 14px rgba(255,150,60,0.25), inset 0 0 10px rgba(255,150,60,0.12);
}

/* rodapé: painel de vidro com legenda, filtros e régua do tempo */
.base {
  position: fixed; z-index: 4;
  left: max(26px, env(safe-area-inset-left, 0px)); right: max(26px, env(safe-area-inset-right, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 34px);
  border-radius: 18px; padding: 18px 22px 16px;
  display: flex; flex-direction: column; gap: 14px;
}
.legenda { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 0.72rem; color: var(--fg-dim); padding-left: 2px; }
.legenda span { display: inline-flex; align-items: center; gap: 7px; }
.legenda i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.legenda .anel { width: 12px; height: 12px; border-radius: 50%; background: transparent; border: 1.3px dashed var(--fg-dim); }
.legenda .anel.pt { border-style: dotted; border-width: 1.6px; }
.legenda .ln { width: 22px; height: 0; border-top: 1.5px solid var(--fg-dim); border-radius: 0; box-shadow: none !important; }
.legenda .ln.tr { border-top-style: dashed; }
.legenda .ln.pt { border-top-style: dotted; border-top-width: 2px; }
.filtros-st { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-left: 2px; }
.filtros-st::before { content: "Ligações"; font-family: var(--f-mono); font-size: 0.62rem; text-transform: uppercase; letter-spacing: .22em; color: var(--fg-dim); margin-right: 4px; }
.filtros-st .chip[aria-pressed="true"] { background: rgba(255,255,255,0.06); border: 1px solid var(--edge-strong); box-shadow: none; }
.filtros-st .chip[aria-pressed="false"] { text-decoration: line-through; opacity: .45; }
.regua { display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: center; }
#play { width: 40px; height: 40px; padding: 0; display: grid; place-items: center; }
.trilho { position: relative; height: 34px; min-width: 0; }
.marcas { position: absolute; left: 9px; right: 9px; top: 2px; height: 9px; }
.marcas b { position: absolute; width: 2px; height: 9px; border-radius: 1px; transform: translateX(-1px); box-shadow: 0 0 6px currentColor; }
#tempo { position: absolute; left: 0; right: 0; bottom: 2px; width: 100%; margin: 0; height: 18px; background: transparent; -webkit-appearance: none; appearance: none; }
#tempo::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, #ffc684, #c9b8a0 50%, #3d9bff); }
#tempo::-moz-range-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, #ffc684, #c9b8a0 50%, #3d9bff); }
#tempo::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: #ffd9a8; box-shadow: 0 0 10px rgba(255,198,132,0.8); cursor: pointer; }
#tempo::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: #ffd9a8; box-shadow: 0 0 10px rgba(255,198,132,0.8); cursor: pointer; }
#dataAtual { font-family: var(--f-mono); font-weight: 400; font-size: 0.78rem; letter-spacing: .08em; color: var(--fg); min-width: 10ch; text-align: right; font-variant-numeric: tabular-nums; }

/* dica flutuante: cartão com borda luminosa na cor do tipo, centro escuro */
#dica {
  --aura: var(--t-pessoa);
  position: fixed; z-index: 6; pointer-events: none; width: max-content; max-width: 300px;
  border-radius: 26px; padding: 18px 20px 18px; font-size: 0.82rem; line-height: 1.45; color: rgba(255,255,255,0.78);
  background:
    radial-gradient(130% 80% at 50% 115%, color-mix(in srgb, var(--aura) 34%, transparent), transparent 60%),
    radial-gradient(120% 70% at 50% -15%, color-mix(in srgb, var(--aura) 48%, transparent), transparent 62%),
    rgba(14, 10, 18, 0.9);
  box-shadow:
    inset 0 0 0 1px color-mix(in srgb, var(--aura) 45%, transparent),
    inset 0 0 26px color-mix(in srgb, var(--aura) 55%, transparent),
    0 18px 50px rgba(0,0,0,0.55);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
}
#dica b { display: block; font-weight: 500; font-size: 1rem; line-height: 1.25; letter-spacing: -0.01em; color: #fff; margin: 6px 0 6px; }
#dica .m { font-family: var(--f-mono); font-size: 0.6rem; color: rgba(255,255,255,0.7); text-transform: uppercase; letter-spacing: .16em; }

/* ficha: cartão de vidro escuro com aura da cor do tipo */
.ficha {
  --aura: var(--t-pessoa);
  position: fixed; z-index: 10;
  top: calc(env(safe-area-inset-top, 0px) + 14px); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  right: max(14px, env(safe-area-inset-right, 0px)); width: min(580px, calc(100% - 28px));
  border-radius: var(--r-card); overflow: hidden;
  background: var(--glass-strong); border: 1px solid var(--edge);
  -webkit-backdrop-filter: blur(24px) saturate(150%); backdrop-filter: blur(24px) saturate(150%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 30px 80px rgba(0,0,0,0.6);
  display: flex; flex-direction: column;
  transform: translateX(0); opacity: 1;
  transition: transform .45s cubic-bezier(.2,.7,.2,1), opacity .35s ease;
}
.ficha::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 300px; pointer-events: none;
  background:
    radial-gradient(120% 90% at 50% -20%, color-mix(in srgb, var(--aura) 55%, transparent), transparent 70%),
    radial-gradient(60% 60% at 90% 0%, color-mix(in srgb, var(--aura) 30%, transparent), transparent 70%);
  opacity: .9;
}
.ficha[hidden] { display: flex !important; transform: translateX(40px); opacity: 0; visibility: hidden; transition: transform .3s ease-in, opacity .25s ease-in, visibility 0s .3s; }
.ficha-topo {
  position: relative; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 18px 18px 6px 26px;
  font-family: var(--f-mono); font-size: 0.66rem; text-transform: uppercase; letter-spacing: .14em; color: rgba(255,255,255,0.75);
}
.ficha-topo .tipo { display: inline-flex; align-items: center; gap: 9px; }
.ficha-topo .tipo i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; box-shadow: 0 0 10px currentColor; }
.fechar {
  border-radius: var(--r-pill); padding: 8px 14px; cursor: pointer; font-family: var(--f-mono); font-size: 0.66rem; color: var(--fg);
  text-transform: uppercase; letter-spacing: .12em; background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.14);
}
.fechar:hover { background: rgba(0,0,0,0.45); }
.ficha-corpo {
  position: relative; overflow-y: auto; flex: 1;
  padding: 26px 26px 44px;
  font-size: 0.98rem; line-height: 1.62; color: #d9d9e1;
}
.ficha h2 { font-weight: 400; font-size: 1.9rem; line-height: 1.08; letter-spacing: -0.025em; margin: 0 0 14px; color: #fff; text-wrap: balance; }
.ficha .meta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-family: var(--f-mono); font-size: 0.66rem; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-dim); margin-bottom: 18px; }
.ficha .lead { font-size: 1.08rem; font-weight: 300; line-height: 1.5; color: #fff; margin: 0 0 22px; padding-bottom: 22px; border-bottom: 1px solid var(--edge); }
.ficha h3 { font-family: var(--f-mono); font-weight: 500; font-size: 0.64rem; letter-spacing: .16em; text-transform: uppercase; color: var(--fg-dim); margin: 28px 0 10px; }
.ficha p { margin: 0 0 12px; max-width: 64ch; }
.ficha ul, .ficha ol { margin: 0 0 12px; padding-left: 1.2em; }
.ficha li { margin-bottom: 6px; }
.ficha strong { color: #fff; font-weight: 500; }
.ficha a { color: var(--fg); text-decoration-color: rgba(255,255,255,0.3); text-underline-offset: 3px; }
.ficha a.ref { text-decoration: none; color: #fff; border-bottom: 1px solid rgba(255,198,132,0.7); cursor: pointer; }
.ficha a.ref:hover { color: var(--brass); }
.ficha sup.fn a { font-family: var(--f-mono); font-size: 0.66rem; text-decoration: none; color: var(--brass); padding: 0 1px; }
.ficha .tbl { overflow-x: auto; margin: 4px 0 14px; }
.ficha table { border-collapse: collapse; font-size: 0.88rem; font-variant-numeric: tabular-nums; width: 100%; }
.ficha th, .ficha td { text-align: left; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--edge); vertical-align: top; }

<template id="tplComo">
  <article class="como">
    <h2 id="fichaTitulo">Como ler este mapa</h2>
    <p class="lead">Um mapa das pessoas, instituições, fatos e acusações em torno da eleição presidencial de 2026. Cada bolinha é um verbete; cada linha, uma relação com data, status e fonte.</p>
    <h3>Navegar</h3>
    <p>Passe o mouse sobre uma bolinha para acender as ligações dela. Clique para abrir o verbete. Use a busca para achar um nome, apelido ou assunto: os resultados acendem no mapa. Os temas no topo isolam uma região. A régua embaixo mostra a rede como estava em cada data.</p>
    <h3>Status</h3>
    <dl>
      <dt><span class="st st-comprovado">Comprovado</span></dt><dd>Decisão judicial, documento oficial, dado público ou admissão da própria parte.</dd>
      <dt><span class="st st-documentado">Documentado</span></dt><dd>Reportado de forma consistente por veículos independentes, sem conclusão oficial.</dd>
      <dt><span class="st st-alegacao">Alegação</span></dt><dd>Afirmado por uma das partes ou por uma única fonte, sem confirmação.</dd>
      <dt><span class="st st-boato">Boato</span></dt><dd>Circula sem fonte sólida. A origem é citada.</dd>
      <dt><span class="st st-desmentido">Desmentido</span></dt><dd>Contrariado por evidência ou checagem.</dd>
    </dl>
    <h3>Bolinhas</h3>
    <p>As maiores são pessoas e instituições; as menores, fatos, alegações e temas. O tamanho só indica o tipo, não a importância. Contorno tracejado marca uma acusação ainda não comprovada; pontilhado, um boato.</p>
    <h3>Linhas</h3>
    <p>Linha cheia: relação comprovada ou documentada. Tracejada: alegação. Pontilhada: boato. Linhas bem apagadas são menções no texto, sem relação declarada. As partículas que correm na linha acesa indicam o sentido da relação.</p>
    <h3>Critérios</h3>
    <p>O texto descreve; quem opina são as fontes, citadas e atribuídas. Toda acusação traz a resposta do acusado, ou o registro de que não houve resposta. Fatos que pesam contra qualquer lado recebem o mesmo tratamento.</p>
    <p>O placar de polêmicas, no canto superior, é uma análise à parte: atribui pesos a fatos que estão nos verbetes. Ele tem método explícito, mas é opinião, e não segue o critério descritivo do resto do mapa.</p>
    <p>Este mapa é mantido por uma pessoa com a ajuda de uma IA (Claude) e pode conter erros. Confira sempre as fontes de cada verbete.</p>
  </article>
</template>

<script>
(function () {
  const DADOS = {"gerado": "2026-10-17", "nos": [{"id": "kassio-vorcaro", "titulo": "Menções a \"Kassio\" nas mensagens de Vorcaro", "tipo": "alegacao", "temas": ["master", "tse"], "apelidos": ["garota de programa", "festa do triplex", "cinco meninas", "Kevin Marques", "filho de Nunes Marques"], "data": "2026-09-18", "status": "alegacao", "resumo": "Mensagens do celular de Vorcaro citam pagamentos ligados ao filho de Nunes Marques e uma festa no triplex do banqueiro com garotas de programa para um \"ministro\". Em 15/10, a piauí reconstituiu a noite com 125 mensagens e liga o episódio a Kassio por interpretação de siglas e nomes. As mensagens não o identificam diretamente. O ministro nega relação com Vorcaro.", "revisado": "2026-10-17", "html": "<section><h3>O que se alega<\/h3><p><span class=\"st st-documentado\">Documentado<\/span> Mensagens do celular de <a class=\"ref\" href=\"#vorcaro\" data-id=\"vorcaro\">Daniel Vorcaro<\/a>, analisadas pela PF, mencionam pagamentos ligados a Kevin Marques, filho de <a class=\"ref\" href=\"#nunes-marques\" data-id=\"nunes-marques\">Kassio Nunes Marques<\/a>. Uma delas cita R$ 500 mil.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><span class=\"st st-alegacao\">Alegação<\/span> Segundo reportagem do UOL, mensagens de funcionários de Vorcaro sobre uma festa em 28/02/2025 no triplex do banqueiro, em São Paulo, mencionam um \"ministro\". Em 07/03, uma intermediária cobrou R$ 10 mil pelo cachê de uma garota de programa, numa mensagem que cita \"Kassio\". O texto das mensagens não identifica de quem se trata.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><p><span class=\"st st-alegacao\">Alegação<\/span> Reportagens posteriores afirmam que o apartamento do suposto encontro pertenceu a uma empresa de Fabiano Zettel, cunhado de Vorcaro.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><\/p><p><span class=\"st st-alegacao\">Alegação<\/span> A representação de deputados do PT ao STF cita ainda contratos de até R$ 427 milhões com pessoas próximas ao ministro, hospedagem estimada em R$ 1,45 milhão e uma viagem em avião particular pago por uma advogada ligada ao banco.<sup class=\"fn\"><a href=\"#\" data-fonte=\"4\">4<\/a><\/sup><\/p><\/section><section><h3>A reportagem da piauí (15/10/2026)<\/h3><p><span class=\"st st-documentado\">Documentado<\/span> A revista piauí publicou 125 mensagens do celular de Vorcaro, obtidas pela PF, trocadas com sete pessoas (motoristas, chef, mordomo, uma agenciadora, uma funcionária e um amigo) sobre a festa de 28/02/2025 no triplex do Itaim Bibi. Segundo a revista:<sup class=\"fn\"><a href=\"#\" data-fonte=\"5\">5<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"6\">6<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"7\">7<\/a><\/sup><\/p><ul><li><span class=\"st st-documentado\">Documentado<\/span> Às 20h56, o mordomo escreveu a Vorcaro que tinha emprestado o \"quarto do lado\" para o \"ministro com 5 menina\". Em outra conversa, Vorcaro disse estar \"fazendo graça para ministro em SP\".<\/li><li><span class=\"st st-documentado\">Documentado<\/span> Os gastos com comida e equipe foram de cerca de R$ 27 mil para 15 convidados. Vorcaro orientou que os celulares não fossem usados no local.<\/li><li><span class=\"st st-documentado\">Documentado<\/span> Segundo o relato do mordomo nas mensagens, o ministro saiu por volta das 23h15.<\/li><li><span class=\"st st-alegacao\">Alegação<\/span> Em 26/02, o desembargador Newton Ramos pediu um quarto no Hotel Fasano \"de sexta a sábado pro KN\". A piauí interpreta a sigla como referência a Kassio Nunes Marques. É uma interpretação da revista.<\/li><li><span class=\"st st-documentado\">Documentado<\/span> Em 07/03, a agenciadora disse que uma participante cobrava pelo encontro e tinha estado com \"Kassio\". Vorcaro pediu os dados para pagamento, e foi indicado o valor de R$ 10 mil. As mensagens não mostram se o pagamento foi feito.<\/li><li><span class=\"st st-documentado\">Documentado<\/span> A defesa do Master pediu três vezes que o processo do banco fosse relatado por Nunes Marques, e não por André Mendonça. Cinco meses antes da festa, o ministro desempatou o chamado \"caso Alcídia\" na Segunda Turma, e há mensagens comemorando o resultado.<\/li><\/ul><p><span class=\"st st-comprovado\">Comprovado<\/span> As mensagens não citam o ministro pelo nome completo. A ligação com Nunes Marques se apoia no nome \"Kassio\", na sigla \"KN\" e na leitura dos investigadores e da revista. A própria piauí trata os pontos como indícios, não como fatos estabelecidos.<sup class=\"fn\"><a href=\"#\" data-fonte=\"6\">6<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"7\">7<\/a><\/sup><\/p><p><span class=\"st st-alegacao\">Alegação<\/span> Em 13/10, o UOL relatou que Vorcaro financiava desde 2023 uma rede de prostituição, com ao menos R$ 4,3 milhões. Vorcaro nega ter explorado ou desrespeitado mulheres.<sup class=\"fn\"><a href=\"#\" data-fonte=\"7\">7<\/a><\/sup><\/p><\/section><section><h3>Quem diz o quê<\/h3><p><strong>Nunes Marques<\/strong>: nega proximidade ou favorecimento a Vorcaro, diz que não trocou mensagens com ele, que nunca autorizou ninguém a falar em seu nome, que não responde por conversas de terceiros e que votou pela manutenção da prisão do banqueiro. A nota divulgada após a reportagem da piauí não trata da presença na festa, dos pagamentos nem de eventual impedimento nos processos do Master.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"6\">6<\/a><\/sup><\/p><p><strong>STF e TSE<\/strong>: não haviam se manifestado institucionalmente até 15/10/2026.<sup class=\"fn\"><a href=\"#\" data-fonte=\"6\">6<\/a><\/sup> Depois da reportagem, o presidente do STF, Edson Fachin, pediu à PF que reúna e envie à corte todas as menções a ministros encontradas no caso, sem prazo definido.<sup class=\"fn\"><a href=\"#\" data-fonte=\"8\">8<\/a><\/sup><\/p><p><strong>Nunes Marques, depois da piauí<\/strong>: em nota, diz que nunca trocou mensagens com Vorcaro, nunca pediu nada a ele e acusa a revista de fazer ilações para ligar as conversas à presidência do TSE. Segundo a Folhapress, estuda estender o impedimento no caso Master.<sup class=\"fn\"><a href=\"#\" data-fonte=\"8\">8<\/a><\/sup><\/p><p><strong>Kevin Marques<\/strong>: diz que recebeu R$ 281,6 mil de uma consultoria tributária, não do Master nem de Vorcaro, e que não atuou em processos do banco.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><\/section><section><h3>O que está comprovado<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> A consultoria para a qual Kevin trabalhou recebeu R$ 6,6 milhões do Master, e o Coaf apontou operações incompatíveis com a capacidade financeira dela.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><span class=\"st st-alegacao\">Alegação<\/span> Que o \"Kassio\" das mensagens seja o ministro, e que tenha havido favorecimento. A PF ainda apura.<\/p><\/section><section class=\"fontes\"><h3>Fontes<\/h3><ol><li id=\"f-kassio-vorcaro-1\" value=\"1\">SP Diário, \"Nunes Marques avalia voltar a julgar processos ligados ao Banco Master após eleições\". <a href=\"https://spdiario.com.br/noticias/politica/nunes-marques-avalia-voltar-a-julgar-processos-ligados-ao-banco-master-apos-eleicoes.html\" target=\"_blank\" rel=\"noopener\">https://spdiario.com.br/noticias/politica/nunes-marques-avalia-voltar-a-julgar-processos-ligados-ao-banco-master-apos-eleicoes.html<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-kassio-vorcaro-2\" value=\"2\">Portal 27, \"Festas de luxo e garotas de programa: entenda a menção a Kassio Nunes Marques no caso Vorcaro\". <a href=\"https://www.portal27.com.br/festas-de-luxo-e-garotas-de-programa-entenda-a-mencao-a-kassio-nunes-marques-no-caso-vorcaro/\" target=\"_blank\" rel=\"noopener\">https://www.portal27.com.br/festas-de-luxo-e-garotas-de-programa-entenda-a-mencao-a-kassio-nunes-marques-no-caso-vorcaro/<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-kassio-vorcaro-3\" value=\"3\">Alma Preta, \"Apartamento de suposto encontro de Nunes Marques com prostituta pertenceu à empresa de Fabiano Zettel\". <a href=\"https://almapreta.com.br/sessao/politica/apartamento-nunes-marques-prostituta-fabiano-zettel-cunhado-vorcaro/\" target=\"_blank\" rel=\"noopener\">https://almapreta.com.br/sessao/politica/apartamento-nunes-marques-prostituta-fabiano-zettel-cunhado-vorcaro/<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-kassio-vorcaro-4\" value=\"4\">Correio Braziliense, \"Deputados do PT pedem investigação contra Nunes Marques por caso Master\", 10/2026. <a href=\"https://www.correiobraziliense.com.br/politica/2026/10/7519311-deputados-do-pt-pedem-investigacao-contra-nunes-marques-por-caso-master.html\" target=\"_blank\" rel=\"noopener\">https://www.correiobraziliense.com.br/politica/2026/10/7519311-deputados-do-pt-pedem-investigacao-contra-nunes-marques-por-caso-master.html<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-kassio-vorcaro-5\" value=\"5\">Diário de São Paulo, \"125 mensagens detalham festa organizada por Vorcaro com referência a ministro do STF\", 15/10/2026. <a href=\"https://spdiario.com.br/noticias/politica/125-mensagens-detalham-festa-organizada-por-vorcaro-com-referencia-a-ministro-do-stf.html\" target=\"_blank\" rel=\"noopener\">https://spdiario.com.br/noticias/politica/125-mensagens-detalham-festa-organizada-por-vorcaro-com-referencia-a-ministro-do-stf.html<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-kassio-vorcaro-6\" value=\"6\">Painel Político, \"As 125 mensagens que reconstroem a festa de Nunes Marques no triplex de Vorcaro\" (reproduz a piauí), 15/10/2026. <a href=\"https://painelpolitico.com/as-125-mensagens-que-reconstroem-a-festa-de-nunes-marques-no-triplex-de-vorcaro\" target=\"_blank\" rel=\"noopener\">https://painelpolitico.com/as-125-mensagens-que-reconstroem-a-festa-de-nunes-marques-no-triplex-de-vorcaro<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-kassio-vorcaro-7\" value=\"7\">ICL Notícias / Folhapress, \"Vorcaro promoveu festa com garotas de programa para Kassio, diz revista\", 15/10/2026. <a href=\"https://iclnoticias.com.br/vorcaro-festa-garotas-de-programa-kassio/\" target=\"_blank\" rel=\"noopener\">https://iclnoticias.com.br/vorcaro-festa-garotas-de-programa-kassio/<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-kassio-vorcaro-8\" value=\"8\">ICL Notícias / Folhapress, \"Kassio estuda estender impedimento no caso Master\", 16/10/2026. <a href=\"https://iclnoticias.com.br/kassio-estuda-estender-impedimento-no-master/\" target=\"_blank\" rel=\"noopener\">https://iclnoticias.com.br/kassio-estuda-estender-impedimento-no-master/<\/a> (acesso em 17/10/2026)<\/li><\/ol><\/section><section class=\"hist\"><h3>Histórico<\/h3><ul><li>14/10/2026: verbete criado.<\/li><li>15/10/2026: incluída a reportagem da piauí com as 125 mensagens.<\/li><li>17/10/2026: atualizado com notícias de 16 e 17/10.<\/li><\/ul><\/section>", "texto": "O que se alega Mensagens do celular de Daniel Vorcaro, analisadas pela PF, mencionam pagamentos ligados a Kevin Marques, filho de Kassio Nunes Marques. Uma delas cita R$ 500 mil. Segundo reportagem do UOL, mensagens de funcionários de Vorcaro sobre uma festa em 28/02/2025 no triplex do banqueiro, em São Paulo, mencionam um \"ministro\". Em 07/03, uma intermediária cobrou R$ 10 mil pelo cachê de uma garota de programa, numa mensagem que cita \"Kassio\". O texto das mensagens não identifica de quem se trata. Reportagens posteriores afirmam que o apartamento do suposto encontro pertenceu a uma empresa de Fabiano Zettel, cunhado de Vorcaro. A representação de deputados do PT ao STF cita ainda contratos de até R$ 427 milhões com pessoas próximas ao ministro, hospedagem estimada em R$ 1,45 milhão e uma viagem em avião particular pago por uma advogada ligada ao banco. A reportagem da piauí (15/10/2026) A revista piauí publicou 125 mensagens do celular de Vorcaro, obtidas pela PF, trocadas com sete pessoas (motoristas, chef, mordomo, uma agenciadora, uma funcionária e um amigo) sobre a festa de 28/02/2025 no triplex do Itaim Bibi. Segundo a revista: - Às 20h56, o mordomo escreveu a Vorcaro que tinha emprestado o \"quarto do lado\" para o \"ministro com 5 menina\". Em outra conversa, Vorcaro disse estar \"fazendo graça para ministro em SP\". - Os gastos com comida e equipe foram de cerca de R$ 27 mil para 15 convidados. Vorcaro orientou que os celulares não fossem usados no local. - Segundo o relato do mordomo nas mensagens, o ministro saiu por volta das 23h15. - Em 26/02, o desembargador Newton Ramos pediu um quarto no Hotel Fasano \"de sexta a sábado pro KN\". A piauí interpreta a sigla como referência a Kassio Nunes Marques. É uma interpretação da revista. - Em 07/03, a agenciadora disse que uma participante cobrava pelo encontro e tinha estado com \"Kassio\". Vorcaro pediu os dados para pagamento, e foi indicado o valor de R$ 10 mil. As mensagens não mostram se o pagamento foi feito. - A defesa do Master pediu três vezes que o processo do banco fosse relatado por Nunes Marques, e não por André Mendonça. Cinco meses antes da festa, o ministro desempatou o chamado \"caso Alcídia\" na Segunda Turma, e há mensagens comemorando o resultado. As mensagens não citam o ministro pelo nome completo. A ligação com Nunes Marques se apoia no nome \"Kassio\", na sigla \"KN\" e na leitura dos investigadores e da revista. A própria piauí trata os pontos como indícios, não como fatos estabelecidos. Em 13/10, o UOL relatou que Vorcaro financiava desde 2023 uma rede de prostituição, com ao menos R$ 4,3 milhões. Vorcaro nega ter explorado ou desrespeitado mulheres. Quem diz o quê Nunes Marques : nega proximidade ou favorecimento a Vorcaro, diz que não trocou mensagens com ele, que nunca autorizou ninguém a falar em seu nome, que não responde por conversas de terceiros e que votou pela manutenção da prisão do banqueiro. A nota divulgada após a reportagem da piauí não trata da presença na festa, dos pagamentos nem de eventual impedimento nos processos do Master. STF e TSE : não haviam se manifestado institucionalmente até 15/10/2026. Depois da reportagem, o presidente do STF, Edson Fachin, pediu à PF que reúna e envie à corte todas as menções a ministros encontradas no caso, sem prazo definido. Nunes Marques, depois da piauí : em nota, diz que nunca trocou mensagens com Vorcaro, nunca pediu nada a ele e acusa a revista de fazer ilações para ligar as conversas à presidência do TSE. Segundo a Folhapress, estuda estender o impedimento no caso Master. Kevin Marques : diz que recebeu R$ 281,6 mil de uma consultoria tributária, não do Master nem de Vorcaro, e que não atuou em processos do banco. O que está comprovado A consultoria para a qual Kevin trabalhou recebeu R$ 6,6 milhões do Master, e o Coaf apontou operações incompatíveis com a capacidade financeira dela. Que o \"Kassio\" das mensagens seja o ministro, e que tenha havido favorecimento. A PF ainda apura. Fontes 1. SP Diário, \"Nunes Marques avalia voltar a julgar processos ligados ao Banco Master após eleições\". (acesso em 14/10/2026) 2. Portal 27, \"Festas de luxo e garotas de programa: entenda a menção a Kassio Nunes Marques no caso Vorcaro\". (acesso em 14/10/2026) 3. Alma Preta, \"Apartamento de suposto encontro de Nunes Marques com prostituta pertenceu à empresa de Fabiano Zettel\". (acesso em 14/10/2026) 4. Correio Braziliense, \"Deputados do PT pedem investigação contra Nunes Marques por caso Master\", 10/2026. (acesso em 14/10/2026) 5. Diário de São Paulo, \"125 mensagens detalham festa organizada por Vorcaro com referência a ministro do STF\", 15/10/2026. (acesso em 15/10/2026) 6. Painel Político, \"As 125 mensagens que reconstroem a festa de Nunes Marques no triplex de Vorcaro\" (reproduz a piauí), 15/10/2026. (acesso em 15/10/2026) 7. ICL Notícias / Folhapress, \"Vorcaro promoveu festa com garotas de programa para Kassio, diz revista\", 15/10/2026. (acesso em 15/10/2026) 8. ICL Notícias / Folhapress, \"Kassio estuda estender impedimento no caso Master\", 16/10/2026. (acesso em 17/10/2026) Histórico - 14/10/2026: verbete criado. - 15/10/2026: incluída a reportagem da piauí com as 125 mensagens. - 17/10/2026: atualizado com notícias de 16 e 17/10."}, {"id": "meta-interferencia", "titulo": "Acusação de interferência da Meta", "tipo": "alegacao", "temas": ["meta", "campanhas"], "apelidos": ["interferência da Meta", "censura digital", "alcance do Lula", "algoritmo", "repost", "impulsionamento"], "data": "2026-10-10", "status": "alegacao", "resumo": "A campanha de Lula acusa a Meta de favorecer Flávio Bolsonaro com uma série de falhas que só atingiram um lado. A Meta nega. O TSE mandou a empresa tratar as campanhas com igualdade, sob multa diária de R$ 500 mil, decisão confirmada por unanimidade em 16/10, mas disse não haver prova de manipulação deliberada.", "revisado": "2026-10-17", "html": "<section><h3>O que se alega<\/h3><p><span class=\"st st-alegacao\">Alegação<\/span> A campanha de <a class=\"ref\" href=\"#lula\" data-id=\"lula\">Lula<\/a> afirma que uma \"sucessão de problemas técnicos\" na <a class=\"ref\" href=\"#meta\" data-id=\"meta\">Meta<\/a> indica \"tentativa de interferência no processo eleitoral brasileiro em benefício da candidatura de Flávio Bolsonaro\". Episódios citados:<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><ul><li><span class=\"st st-alegacao\">Alegação<\/span> Dezembro de 2025: perfis de Lula e de lideranças de esquerda sumiram temporariamente da busca do Instagram. A Meta atribuiu a falha técnica.<\/li><li><span class=\"st st-alegacao\">Alegação<\/span> 1º turno: a conta de anúncios da campanha foi desativada sem justificativa formal.<\/li><li><span class=\"st st-alegacao\">Alegação<\/span> Início do 2º turno: levantamento do próprio PT indica que a página de Flávio teve 2,96 vezes mais engajamento que a de Lula, com 17,2% menos seguidores.<\/li><li><span class=\"st st-alegacao\">Alegação<\/span> 08/10: um post de Lula teve a contagem de visualizações interrompida.<\/li><li><span class=\"st st-alegacao\">Alegação<\/span> 08 e 09/10: o perfil de Lula ficou impedido de impulsionar posts e, por várias horas, sem os botões de repostar e criar story.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><\/li><li><span class=\"st st-comprovado\">Comprovado<\/span> Buscas por \"Exército do Lula\" sugeriam a página de apoiadores de Flávio, segundo Camilo Santana. Mensagens internas da Meta confirmam o problema.<sup class=\"fn\"><a href=\"#\" data-fonte=\"4\">4<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"14\">14<\/a><\/sup><\/li><li><span class=\"st st-comprovado\">Comprovado<\/span> A IA do WhatsApp recusou \"Lula 13\" e gerou \"Flávio 22\". Ver <a class=\"ref\" href=\"#meta-ai-lula13\" data-id=\"meta-ai-lula13\">Meta AI recusa \"Lula 13\" e gera \"Flávio 22\"<\/a>.<\/li><\/ul><p><span class=\"st st-documentado\">Documentado<\/span> A organização Repro Uncensored documentou \"dezenas\" de contas pró-Lula com suspensões ou queda de alcance. O levantamento CTRL+Z reuniu mais de mil casos de restrição, 22% sem explicação.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"5\">5<\/a><\/sup><\/p><\/section><section><h3>Quem diz o quê<\/h3><p><strong>Meta<\/strong>: chamou as alegações de \"simplesmente falsas\", disse que muitos problemas \"não afetaram exclusivamente o Brasil ou contas específicas\" e que a falha de visualizações foi global, em mais de 100 países.<sup class=\"fn\"><a href=\"#\" data-fonte=\"6\">6<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"7\">7<\/a><\/sup><\/p><p><strong>Campanha de Lula<\/strong>: levou o caso ao <a class=\"ref\" href=\"#tse\" data-id=\"tse\">TSE<\/a>, à ANPD e à OEA e criou o site \"Censura Digital\" para receber relatos.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"4\">4<\/a><\/sup><\/p><p><strong>TSE<\/strong>: o ministro Marco Aurélio Bellizze deu 48 horas para a Meta explicar o tratamento dado às candidaturas. O conteúdo da resposta da empresa ao tribunal não foi divulgado até 15/10/2026.<sup class=\"fn\"><a href=\"#\" data-fonte=\"8\">8<\/a><\/sup><\/p><p><strong>Ministério Público Federal<\/strong>: segundo o The Rio Times, deu cinco dias para a Meta e o X explicarem contas bloqueadas e posts políticos apagados.<sup class=\"fn\"><a href=\"#\" data-fonte=\"9\">9<\/a><\/sup><\/p><p><strong>Meta, sobre o levantamento da CTRL+Z<\/strong>: contesta a metodologia e diz que a amostra foi selecionada de forma deliberada, sem acesso aos dados completos.<sup class=\"fn\"><a href=\"#\" data-fonte=\"10\">10<\/a><\/sup><\/p><\/section><section><h3>O que a Meta admitiu<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Em resposta ao TSE, a Meta admitiu que a conta de anúncios de Lula foi suspensa por engano em 23/09, por \"erro nos mecanismos automáticos de identificação de fraudes\", e restabelecida cerca de uma hora depois. Admitiu também a falha na contagem de visualizações do Instagram em 07/10, que atingiu criadores em mais de 100 países, e disse que os posts de Lula naquele dia tiveram desempenho acima da média. Das 35 contas identificáveis de uma suposta rede de 255 perfis apontada pela campanha, removeu sete. A fonte não informa de que lado eram.<sup class=\"fn\"><a href=\"#\" data-fonte=\"13\">13<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> Mensagens internas da Meta obtidas pela jornalista Patrícia Campos Mello, da Folha de S.Paulo, e publicadas em 16/10/2026, mostram que:<sup class=\"fn\"><a href=\"#\" data-fonte=\"14\">14<\/a><\/sup><\/p><ul><li>um funcionário escreveu que a conta de Lula estava \"limitada\" em comparação com a de Flávio, o que poderia gerar ação judicial;<\/li><li>em 09/10, a conta de Lula ficou quase 24 horas sem conseguir impulsionar posts do feed; a explicação oficial citou uma interrupção global de 07/10, que durou cerca de cinco horas;<\/li><li>funcionários reconheceram que o perfil de Flávio aparecia indevidamente em buscas no Instagram, enquanto o de Lula não aparecia nem pelo nome exato, e chamaram a recomendação indevida de \"furo\";<\/li><li>no WhatsApp, a busca por \"Exército do Lula\" retornava a \"Tropa do Flávio\", o que a regra do TSE proíbe;<\/li><li>funcionários reclamaram da demora dos engenheiros nos EUA e pediram classificação de maior gravidade para o problema.<\/li><\/ul><p><span class=\"st st-comprovado\">Comprovado<\/span> Segundo a reportagem, nenhuma das mensagens admite interferência intencional; elas tratam da gravidade e da demora na correção. As mesmas mensagens registram que anúncios de Flávio foram barrados em 01/10 por suposto uso de IA em período proibido, o que a campanha dele nega ter feito.<sup class=\"fn\"><a href=\"#\" data-fonte=\"14\">14<\/a><\/sup><\/p><p><strong>Campanha de Flávio<\/strong>: diz que as informações da reportagem não procedem e que sua conta de anúncios opera sem interrupções.<sup class=\"fn\"><a href=\"#\" data-fonte=\"14\">14<\/a><\/sup><\/p><\/section><section><h3>Decisão do TSE (15/10/2026)<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> O ministro Marco Aurélio Bellizze atendeu em parte o pedido da campanha de Lula. Determinou que a Meta dê tratamento igual às duas campanhas até 25/10, sem restrições desiguais na distribuição de conteúdo, nas recomendações e na busca. Bloqueios de contas de anúncios e limites ao impulsionamento passam a exigir revisão humana, em até duas horas quando automáticos. A multa por descumprimento é de R$ 500 mil por dia.<sup class=\"fn\"><a href=\"#\" data-fonte=\"11\">11<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Na mesma decisão, o ministro afirmou não haver, até aquele momento, prova de manipulação deliberada dos algoritmos para favorecer Flávio ou prejudicar Lula, e que as falhas da IA não permitem concluir que houve interferência intencional.<sup class=\"fn\"><a href=\"#\" data-fonte=\"11\">11<\/a><\/sup><\/p><\/section><section><h3>Confirmação no plenário (16/10/2026)<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> O plenário do TSE confirmou a decisão por unanimidade, com os votos de Bellizze, Floriano de Azevedo Marques, André Mendonça, Estela Aranha, Villas Bôas Cueva, Nunes Marques e Dias Toffoli. Entre as obrigações: revisão humana em até duas horas de bloqueios automáticos de anúncios; suspensão em 24 horas de anúncios eleitorais pagos por contas não autorizadas ou sediadas no exterior; apuração em 24 horas dos 255 perfis apontados como inautênticos e checagem do rótulo de IA em 1.204 publicações; e reposição, até 21/10, dos impulsionamentos da campanha de Lula não entregues durante as falhas.<sup class=\"fn\"><a href=\"#\" data-fonte=\"15\">15<\/a><\/sup><\/p><p><strong>Meta, sobre as mensagens internas<\/strong>: disse à Reuters que os problemas técnicos citados já eram públicos e que as conversas tratavam da gravidade deles, não de interferência política, e que \"qualquer sugestão de que a Meta favorece um lado é falsa\".<sup class=\"fn\"><a href=\"#\" data-fonte=\"16\">16<\/a><\/sup><\/p><\/section><section><h3>Na imprensa internacional<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> A AP noticiou a decisão de 15/10 com o título \"Lula vence contestação contra a Meta na Justiça Eleitoral por suposto viés algorítmico pró-Bolsonaro\", reproduzido por NBC News, CTV e Gulf News, entre outros.<sup class=\"fn\"><a href=\"#\" data-fonte=\"12\">12<\/a><\/sup> AP, New York Times e AFP já tinham noticiado a acusação, apresentada como queixa da campanha de Lula com negativa da Meta. A Tech Policy Press publicou artigo crítico à empresa, assinado pela diretora da CTRL+Z. Ver <a class=\"ref\" href=\"#repercussao-internacional\" data-id=\"repercussao-internacional\">Repercussão internacional<\/a>.<sup class=\"fn\"><a href=\"#\" data-fonte=\"10\">10<\/a><\/sup><\/p><\/section><section><h3>O que está comprovado<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> O episódio da IA do WhatsApp.<\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> O TSE reconheceu falhas que comprometem a igualdade entre os candidatos e mandou corrigi-las, mas afirmou, em 15/10/2026, não haver prova de manipulação deliberada.<\/p><p><span class=\"st st-alegacao\">Alegação<\/span> Que os episódios tenham sido intencionais. O levantamento de engajamento é do próprio PT, e o da CTRL+Z é contestado pela Meta.<\/p><\/section><section class=\"fontes\"><h3>Fontes<\/h3><ol><li id=\"f-meta-interferencia-1\" value=\"1\">Correio Braziliense, \"PT reforça suspeita de interferência da Meta nas eleições; TSE é acionado\", 10/10/2026. <a href=\"https://www.correiobraziliense.com.br/politica/2026/10/7518606-pt-reforca-suspeita-de-interferencia-da-meta-nas-eleicoes-tse-e-acionado.html\" target=\"_blank\" rel=\"noopener\">https://www.correiobraziliense.com.br/politica/2026/10/7518606-pt-reforca-suspeita-de-interferencia-da-meta-nas-eleicoes-tse-e-acionado.html<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-meta-interferencia-2\" value=\"2\">Poder360, \"Meta bloqueia 'Lula 13', mas libera 'Flávio 22' na IA do WhatsApp\", 14/10/2026. <a href=\"https://www.poder360.com.br/poder-eleicoes-2026/meta-bloqueia-lula-13-mas-libera-flavio-22-na-ia-do-whatsapp/\" target=\"_blank\" rel=\"noopener\">https://www.poder360.com.br/poder-eleicoes-2026/meta-bloqueia-lula-13-mas-libera-flavio-22-na-ia-do-whatsapp/<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-meta-interferencia-3\" value=\"3\">Acessa.com, \"OEA será acionada por Lula sobre interferência da Meta nas eleições\", 10/2026. <a href=\"https://www.acessa.com/politica/2026/10/342273-oea-sera-acionada-por-lula-sobre-interferencia-da-meta-nas-eleicoes.html\" target=\"_blank\" rel=\"noopener\">https://www.acessa.com/politica/2026/10/342273-oea-sera-acionada-por-lula-sobre-interferencia-da-meta-nas- tatiaia.com.br/politica/disputa-judicial-entre-flavio-e-lula-se-intensifica-no-segundo-turno/\" target=\"_blank\" rel=\"noopener\">https://www.itatiaia.com.br/politica/disputa-judicial-entre-flavio-e-lula-se-intensifica-no-segundo-turno/<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-meta-interferencia-9\" value=\"9\">The Rio Times, \"Lula Campaign Says Meta AI Favours Flávio Bolsonaro\", 10/2026. <a href=\"https://www.riotimesonline.com/lula-campaign-meta-ai-favours-flavio-2026/\" target=\"_blank\" rel=\"noopener\">https://www.riotimesonline.com/lula-campaign-meta-ai-favours-flavio-2026/<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-meta-interferencia-10\" value=\"10\">Tech Policy Press, \"Meta Moderation Failures Loom Over Brazil's Runoff Presidential Election\", 15/10/2026. <a href=\"https://www.techpolicy.press/meta-moderation-failures-loom-over-brazils-runoff-presidential-election/\" target=\"_blank\" rel=\"noopener\">https://www.techpolicy.press/meta-moderation-failures-loom-over-brazils-runoff-presidential-election/<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-meta-interferencia-11\" value=\"11\">Correio da Manhã, \"TSE impõe multa de R$ 500 mil à Meta e exige tratamento igual a Lula e Flávio\", 10/2026. <a href=\"https://www.correiodamanha.com.br/politica/2026/10/327550-tse-impoe-multa-de-rs-500-mil-a-meta-e-exige-tratamento-igual-a-lula-e-flavio.html\" target=\"_blank\" rel=\"noopener\">https://www.correiodamanha.com.br/politica/2026/10/327550-tse-impoe-multa-de-rs-500-mil-a-meta-e-exige-tratamento-igual-a-lula-e-flavio.html<\/a> (acesso em 16/10/2026)<\/li><li id=\"f-meta-interferencia-12\" value=\"12\">NBC News (AP), \"Brazil's Lula wins electoral court challenge against Meta for alleged pro-Bolsonaro algorithm bias\", 16/10/2026. <a href=\"https://www.nbcnews.com/world/south-america/brazil-lula-wins-electoral-court-challenge-meta-alleged-bolsonaro-bias-rcna603835\" target=\"_blank\" rel=\"noopener\">https://www.nbcnews.com/world/south-america/brazil-lula-wins-electoral-court-challenge-meta-alleged-bolsonaro-bias-rcna603835<\/a> (acesso em 16/10/2026)<\/li><li id=\"f-meta-interferencia-13\" value=\"13\">Correio da Manhã, \"Após denúncia de Lula, Meta admite falhas e remove sete perfis irregulares, mas nega favorecer Flávio\", 14/10/2026. <a href=\"https://www.correiodamanha.com.br/politica/2026/10/326753-apos-denuncia-de-lula-meta-admite-falhas-e-remove-sete-perfis-irregulares-mas-nega-favorecer-flavio.html\" target=\"_blank\" rel=\"noopener\">https://www.correiodamanha.com.br/politica/2026/10/326753-apos-denuncia-de-lula-meta-admite-falhas-e-remove-sete-perfis-irregulares-mas-nega-favorecer-flavio.html<\/a> (acesso em 16/10/2026)<\/li><li id=\"f-meta-interferencia-14\" value=\"14\">Portal 6 / Folhapress, \"Em mensagens internas, Meta admite que contas de Lula foram prejudicadas por restrições\", 16/10/2026. <a href=\"https://portal6.com.br/2026/10/16/em-mensagens-internas-meta-admite-que-contas-de-lula-foram-prejudicadas-por-restricoes-engenheiros-falam-em-falhas-tecnicas/\" target=\"_blank\" rel=\"noopener\">https://portal6.com.br/2026/10/16/em-mensagens-internas-meta-admite-que-contas-de-lula-foram-prejudicadas-por-restricoes-engenheiros-falam-em-falhas-tecnicas/<\/a> (acesso em 16/10/2026)<\/li><li id=\"f-meta-interferencia-15\" value=\"15\">Gazeta do Povo, \"TSE confirma decisão que mandou Meta garantir igualdade entre Flávio e Lula nas redes\", 16/10/2026. <a href=\"https://www.gazetadopovo.com.br/eleicoes/2026/tse-confirma-decisao-que-mandou-meta-garantir-igualdade-entre-flavio-e-lula-nas-redes/\" target=\"_blank\" rel=\"noopener\">https://www.gazetadopovo.com.br/eleicoes/2026/tse-confirma-decisao-que-mandou-meta-garantir-igualdade-entre-flavio-e-lula-nas-redes/<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-meta-interferencia-16\" value=\"16\">Al Jazeera (com Reuters e AP), \"Meta employees say Lula's accounts restricted in Brazil election: Report\", 16/10/2026. <a href=\"https://www.aljazeera.com/economy/2026/10/16/meta-employees-say-lulas-accounts-restricted-in-brazil-election-report\" target=\"_blank\" rel=\"noopener\">https://www.aljazeera.com/economy/2026/10/16/meta-employees-say-lulas-accounts-restricted-in-brazil-election-report<\/a> (acesso em 17/10/2026)<\/li><\/ol><\/section><section class=\"hist\"><h3>Histórico<\/h3><ul><li>14/10/2026: verbete criado.<\/li><li>15/10/2026: atualizado com notícias de 13 a 15/10.<\/li><li>15/10/2026: incluída a repercussão internacional e novos fatos (MPF, teste da Folha).<\/li><li>16/10/2026: incluída a decisão do TSE de 15/10 sobre a Meta.<\/li><li>16/10/2026: incluído o que a Meta admitiu ao TSE e nas mensagens internas reveladas pela Folha.<\/li><li>17/10/2026: atualizado com notícias de 16 e 17/10.<\/li><\/ul><\/section>", "texto": "O que se alega A campanha de Lula afirma que uma \"sucessão de problemas técnicos\" na Meta indica \"tentativa de interferência no processo eleitoral brasileiro em benefício da candidatura de Flávio Bolsonaro\". Episódios citados: - Dezembro de 2025: perfis de Lula e de lideranças de esquerda sumiram temporariamente da busca do Instagram. A Meta atribuiu a falha técnica. - 1º turno: a conta de anúncios da campanha foi desativada sem justificativa formal. - Início do 2º turno: levantamento do próprio PT indica que a página de Flávio teve 2,96 vezes mais engajamento que a de Lula, com 17,2% menos seguidores. - 08/10: um post de Lula teve a contagem de visualizações interrompida. - 08 e 09/10: o perfil de Lula ficou impedido de impulsionar posts e, por várias horas, sem os botões de repostar e criar story. - Buscas por \"Exército do Lula\" sugeriam a página de apoiadores de Flávio, segundo Camilo Santana. Mensagens internas da Meta confirmam o problema. - A IA do WhatsApp recusou \"Lula 13\" e gerou \"Flávio 22\". Ver meta-ai-lula13. A organização Repro Uncensored documentou \"dezenas\" de contas pró-Lula com suspensões ou queda de alcance. O levantamento CTRL+Z reuniu mais de mil casos de restrição, 22% sem explicação. Quem diz o quê Meta : chamou as alegações de \"simplesmente falsas\", disse que muitos problemas \"não afetaram exclusivamente o Brasil ou contas específicas\" e que a falha de visualizações foi global, em mais de 100 países. Campanha de Lula : levou o caso ao TSE, à ANPD e à OEA e criou o site \"Censura Digital\" para receber relatos. TSE : o ministro Marco Aurélio Bellizze deu 48 horas para a Meta explicar o tratamento dado às candidaturas. O conteúdo da resposta da empresa ao tribunal não foi divulgado até 15/10/2026. Ministério Público Federal : segundo o The Rio Times, deu cinco dias para a Meta e o X explicarem contas bloqueadas e posts políticos apagados. Meta, sobre o levantamento da CTRL+Z : contesta a metodologia e diz que a amostra foi selecionada de forma deliberada, sem acesso aos dados completos. O que a Meta admitiu Em resposta ao TSE, a Meta admitiu que a conta de anúncios de Lula foi suspensa por engano em 23/09, por \"erro nos mecanismos automáticos de identificação de fraudes\", e restabelecida cerca de uma hora depois. Admitiu também a falha na contagem de visualizações do Instagram em 07/10, que atingiu criadores em mais de 100 países, e disse que os posts de Lula naquele dia tiveram desempenho acima da média. Das 35 contas identificáveis de uma suposta rede de 255 perfis apontada pela campanha, removeu sete. A fonte não informa de que lado eram. Mensagens internas da Meta obtidas pela jornalista Patrícia Campos Mello, da Folha de S.Paulo, e publicadas em 16/10/2026, mostram que: - um funcionário escreveu que a conta de Lula estava \"limitada\" em comparação com a de Flávio, o que poderia gerar ação judicial; - em 09/10, a conta de Lula ficou quase 24 horas sem conseguir impulsionar posts do feed; a explicação oficial citou uma interrupção global de 07/10, que durou cerca de cinco horas; - funcionários reconheceram que o perfil de Flávio aparecia indevidamente em buscas no Instagram, enquanto o de Lula não aparecia nem pelo nome exato, e chamaram a recomendação indevida de \"furo\"; - no WhatsApp, a busca por \"Exército do Lula\" retornava a \"Tropa do Flávio\", o que a regra do TSE proíbe; - funcionários reclamaram da demora dos engenheiros nos EUA e pediram classificação de maior gravidade para o problema. Segundo a reportagem, nenhuma das mensagens admite interferência intencional; elas tratam da gravidade e da demora na correção. As mesmas mensagens registram que anúncios de Flávio foram barrados em 01/10 por suposto uso de IA em período proibido, o que a campanha dele nega ter feito. Campanha de Flávio : diz que as informações da reportagem não procedem e que sua conta de anúncios opera sem interrupções. Decisão do TSE (15/10/2026) O ministro Marco Aurélio Bellizze atendeu em parte o pedido da campanha de Lula. Determinou que a Meta dê tratamento igual às duas campanhas até 25/10, sem restrições desiguais na distribuição de conteúdo, nas recomendações e na busca. Bloqueios de contas de anúncios e limites ao impulsionamento passam a exigir revisão humana, em até duas horas quando automáticos. A multa por descumprimento é de R$ 500 mil por dia. Na mesma decisão, o ministro afirmou não haver, até aquele momento, prova de manipulação deliberada dos algoritmos para favorecer Flávio ou prejudicar Lula, e que as falhas da IA não permitem concluir que houve interferência intencional. Confirmação no plenário (16/10/2026) O plenário do TSE confirmou a decisão por unanimidade, com os votos de Bellizze, Floriano de Azevedo Marques, André Mendonça, Estela Aranha, Villas Bôas Cueva, Nunes Marques e Dias Toffoli. Entre as obrigações: revisão humana em até duas horas de bloqueios automáticos de anúncios; suspensão em 24 horas de anúncios eleitorais pagos por contas não autorizadas ou sediadas no exterior; apuração em 24 horas dos 255 perfis apontados como inautênticos e checagem do rótulo de IA em 1.204 publicações; e reposição, até 21/10, dos impulsionamentos da campanha de Lula não entregues durante as falhas. Meta, sobre as mensagens internas : disse à Reuters que os problemas técnicos citados já eram públicos e que as conversas tratavam da gravidade deles, não de interferência política, e que \"qualquer sugestão de que a Meta favorece um lado é falsa\". Na imprensa internacional A AP noticiou a decisão de 15/10 com o título \"Lula vence contestação contra a Meta na Justiça Eleitoral por suposto viés algorítmico pró-Bolsonaro\", reproduzido por NBC News, CTV e Gulf News, entre outros. AP, New York Times e AFP já tinham noticiado a acusação, apresentada como queixa da campanha de Lula com negativa da Meta. A Tech Policy Press publicou artigo crítico à empresa, assinado pela diretora da CTRL+Z. Ver repercussao-internacional. O que está comprovado O episódio da IA do WhatsApp. O TSE reconheceu falhas que comprometem a igualdade entre os candidatos e mandou corrigi-las, mas afirmou, em 15/10/2026, não haver prova de manipulação deliberada. Que os episódios tenham sido intencionais. O levantamento de engajamento é do próprio PT, e o da CTRL+Z é contestado pela Meta. Fontes 1. Correio Braziliense, \"PT reforça suspeita de interferência da Meta nas eleições; TSE é acionado\", 10/10/2026. (acesso em 14/10/2026) 2. Poder360, \"Meta bloqueia 'Lula 13', mas libera 'Flávio 22' na IA do WhatsApp\", 14/10/2026. (acesso em 14/10/2026) 3. Acessa.com, \"OEA será acionada por Lula sobre interferência da Meta nas eleições\", 10/2026. (acesso em 14/10/2026) 4. NC News, \"PT denuncia Meta por interferência nas eleições 2026\", 14/10/2026. (acesso em 14/10/2026) 5. ATHOSGLS / Repro Uncensored, \"Dezenas de contas pró-Lula no Instagram já foram afetadas\", 12/10/2026. (acesso em 14/10/2026) 6. SBT News, \"Meta nega interferência após acusações da campanha de Lula\", 10/2026. (acesso em 14/10/2026) 7. Olhar Digital, \"Meta AI apresenta resultados diferentes em pedidos com Lula e Flávio\", 14/10/2026. (acesso em 14/10/2026) 8. Itatiaia, \"Disputa judicial entre Flávio e Lula se intensifica no segundo turno\", 10/2026. (acesso em 15/10/2026) 9. The Rio Times, \"Lula Campaign Says Meta AI Favours Flávio Bolsonaro\", 10/2026. (acesso em 15/10/2026) 10. Tech Policy Press, \"Meta Moderation Failures Loom Over Brazil's Runoff Presidential Election\", 15/10/2026. (acesso em 15/10/2026) 11. Correio da Manhã, \"TSE impõe multa de R$ 500 mil à Meta e exige tratamento igual a Lula e Flávio\", 10/2026. (acesso em 16/10/2026) 12. NBC News (AP), \"Brazil's Lula wins electoral court challenge against Meta for alleged pro-Bolsonaro algorithm bias\", 16/10/2026. (acesso em 16/10/2026) 13. Correio da Manhã, \"Após denúncia de Lula, Meta admite falhas e remove sete perfis irregulares, mas nega favorecer Flávio\", 14/10/2026. (acesso em 16/10/2026) 14. Portal 6 / Folhapress, \"Em mensagens internas, Meta admite que contas de Lula foram prejudicadas por restrições\", 16/10/2026. (acesso em 16/10/2026) 15. Gazeta do Povo, \"TSE confirma decisão que mandou Meta garantir igualdade entre Flávio e Lula nas redes\", 16/10/2026. (acesso em 17/10/2026) 16. Al Jazeera (com Reuters e AP), \"Meta employees say Lula's accounts restricted in Brazil election: Report\", 16/10/2026. (acesso em 17/10/2026) Histórico - 14/10/2026: verbete criado. - 15/10/2026: atualizado com notícias de 13 a 15/10. - 15/10/2026: incluída a repercussão internacional e novos fatos (MPF, teste da Folha). - 16/10/2026: incluída a decisão do TSE de 15/10 sobre a Meta. - 16/10/2026: incluído o que a Meta admitiu ao TSE e nas mensagens internas reveladas pela Folha. - 17/10/2026: atualizado com notícias de 16 e 17/10."}, {"id": "almoco-flavio-globo", "titulo": "Almoço de Flávio com a cúpula da Globo", "tipo": "evento", "temas": ["campanhas", "master"], "apelidos": ["almoço", "sabatina", "Jornal Nacional", "JN", "Rogério Marinho", "Igor Gadelha"], "data": "2026-10-16", "status": "documentado", "resumo": "No dia da sua sabatina no Jornal Nacional, Flávio teve almoço reservado com a cúpula da Globo, o segundo encontro com a direção da emissora. Lula, sabatinado na véspera, não foi convidado para encontro semelhante, segundo aliados.", "revisado": "2026-10-16", "html": "<section><h3>O que aconteceu<\/h3><p><span class=\"st st-documentado\">Documentado<\/span> Segundo a coluna de Igor Gadelha, no Metrópoles, <a class=\"ref\" href=\"#flavio-bolsonaro\" data-id=\"flavio-bolsonaro\">Flávio Bolsonaro<\/a> almoçou em 16/10/2026 com os principais executivos da <a class=\"ref\" href=\"#globo\" data-id=\"globo\">Globo<\/a>, na sede da emissora no Rio de Janeiro, horas antes de sua sabatina no Jornal Nacional. Participaram também uma assessora de imprensa e o senador Rogério Marinho (PL-RN), coordenador da campanha.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> Foi o segundo almoço de Flávio com a direção da Globo, dentro de uma rodada pelos grandes veículos. <a class=\"ref\" href=\"#lula\" data-id=\"lula\">Lula<\/a>, sabatinado no JN em 15/10, não foi convidado para encontro semelhante, segundo aliados dele.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><\/section><section><h3>Contexto<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Na véspera, 15/10, a Globo demitiu o diretor-geral Frederic Kachar por mensagens com <a class=\"ref\" href=\"#vorcaro\" data-id=\"vorcaro\">Daniel Vorcaro<\/a>, que financiou o filme <a class=\"ref\" href=\"#dark-horse\" data-id=\"dark-horse\">Dark Horse<\/a>, de Flávio.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> A informação sobre o almoço foi publicada pelo Metrópoles, portal que recebeu pagamentos do Banco Master. Ver <a class=\"ref\" href=\"#vorcaro-metropoles\" data-id=\"vorcaro-metropoles\">Vorcaro e as reportagens do Metrópoles<\/a>.<\/p><\/section><section><h3>Quem diz o quê<\/h3><p><strong>Globo<\/strong>: não respondeu à coluna.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><strong>Campanha de Flávio<\/strong>: não respondeu à coluna.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><\/section><section><h3>O que está comprovado<\/h3><p><span class=\"st st-documentado\">Documentado<\/span> O almoço e a diferença de tratamento entre os candidatos, segundo apuração do colunista. Não houve agenda oficial divulgada.<\/p><p><span class=\"st st-alegacao\">Alegação<\/span> Que o encontro tenha relação com o conteúdo da sabatina. Nenhuma fonte apresentou evidência sobre isso até 16/10/2026.<\/p><\/section><section class=\"fontes\"><h3>Fontes<\/h3><ol><li id=\"f-almoco-flavio-globo-1\" value=\"1\">Metrópoles, coluna Igor Gadelha, \"Flávio tem almoço reservado com a cúpula da Globo antes da sabatina do JN\", 16/10/2026. <a href=\"https://www.metropoles.com/colunas/igor-gadelha/flavio-tem-almoco-reservado-com-a-cupula-da-globo-antes-da-sabatina-do-jn\" target=\"_blank\" rel=\"noopener\">https://www.metropoles.com/colunas/igor-gadelha/flavio-tem-almoco-reservado-com-a-cupula-da-globo-antes-da-sabatina-do-jn<\/a> (acesso em 16/10/2026)<\/li><li id=\"f-almoco-flavio-globo-2\" value=\"2\">Brasil de Fato, \"Grupo Globo demite diretor-geral após mensagens vazadas com Daniel Vorcaro\", 15/10/2026. <a href=\"https://www.brasildefato.com.br/2026/10/15/grupo-globo-demite-diretor-geral-apos-mensagens-vazadas-com-daniel-vorcaro/\" target=\"_blank\" rel=\"noopener\">https://www.brasildefato.com.br/2026/10/15/grupo-globo-demite-diretor-geral-apos-mensagens-vazadas-com-daniel-vorcaro/<\/a> (acesso em 16/10/2026)<\/li><\/ol><\/section><section class=\"hist\"><h3>Histórico<\/h3><ul><li>16/10/2026: verbete criado.<\/li><\/ul><\/section>", "texto": "O que aconteceu Segundo a coluna de Igor Gadelha, no Metrópoles, Flávio Bolsonaro almoçou em 16/10/2026 com os principais executivos da Globo, na sede da emissora no Rio de Janeiro, horas antes de sua sabatina no Jornal Nacional. Participaram também uma assessora de imprensa e o senador Rogério Marinho (PL-RN), coordenador da campanha. Foi o segundo almoço de Flávio com a direção da Globo, dentro de uma rodada pelos grandes veículos. Lula, sabatinado no JN em 15/10, não foi convidado para encontro semelhante, segundo aliados dele. Contexto Na véspera, 15/10, a Globo demitiu o diretor-geral Frederic Kachar por mensagens com Daniel Vorcaro, que financiou o filme Dark Horse, de Flávio. A informação sobre o almoço foi publicada pelo Metrópoles, portal que recebeu pagamentos do Banco Master. Ver vorcaro-metropoles. Quem diz o quê Globo : não respondeu à coluna. Campanha de Flávio : não respondeu à coluna. O que está comprovado O almoço e a diferença de tratamento entre os candidatos, segundo apuração do colunista. Não houve agenda oficial divulgada. Que o encontro tenha relação com o conteúdo da sabatina. Nenhuma fonte apresentou evidência sobre isso até 16/10/2026. Fontes 1. Metrópoles, coluna Igor Gadelha, \"Flávio tem almoço reservado com a cúpula da Globo antes da sabatina do JN\", 16/10/2026. (acesso em 16/10/2026) 2. Brasil de Fato, \"Grupo Globo demite diretor-geral após mensagens vazadas com Daniel Vorcaro\", 15/10/2026. (acesso em 16/10/2026) Histórico - 16/10/2026: verbete criado."}, {"id": "dark-horse", "titulo": "Financiamento do filme Dark Horse", "tipo": "evento", "temas": ["master", "campanhas"], "apelidos": ["Dark Horse", "filme do Bolsonaro", "filme sobre Bolsonaro"], "data": "2025-05-01", "status": "comprovado", "resumo": "Daniel Vorcaro financiou o filme Dark Horse, sobre Jair Bolsonaro, a pedido de Flávio, que cobrou parcelas atrasadas em áudio. Foram negociados US$ 24 milhões e pagos ao menos US$ 10,6 milhões, por um fundo nos EUA ligado ao advogado de Eduardo. Flávio é investigado no STF pelo caso desde julho de 2026.", "revisado": "2026-10-17", "html": "<section><h3>O que aconteceu<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> <a class=\"ref\" href=\"#flavio-bolsonaro\" data-id=\"flavio-bolsonaro\">Flávio Bolsonaro<\/a> captou recursos de <a class=\"ref\" href=\"#vorcaro\" data-id=\"vorcaro\">Daniel Vorcaro<\/a> para o filme Dark Horse, sobre <a class=\"ref\" href=\"#jair-bolsonaro\" data-id=\"jair-bolsonaro\">Jair Bolsonaro<\/a>. Segundo Flávio, o último pagamento foi em maio de 2025, num total de US$ 10,6 milhões.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> A revista piauí aponta cerca de US$ 14 milhões pagos, de US$ 24 milhões pedidos.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> Segundo o UOL Confere, foram pedidos R$ 134 milhões, e ao menos R$ 61 milhões foram repassados por Vorcaro.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> Segundo O Globo, um empresário firmou delação com a PGR e entregou extratos de pagamentos ao fundo de um advogado de Eduardo Bolsonaro.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> Um relatório do Coaf, revelado pela piauí, aponta transferência em 16/09/2025, depois da data que Flávio dá como último pagamento.<sup class=\"fn\"><a href=\"#\" data-fonte=\"6\">6<\/a><\/sup><\/p><\/section><section><h3>O áudio<\/h3><p><span class=\"st st-documentado\">Documentado<\/span> Em 13/05/2026, o Intercept Brasil revelou um áudio de 08/09/2025 em que Flávio cobra de Vorcaro parcelas atrasadas: \"Imagina a gente dando calote num Jim Caviezel\" e \"não pode não honrar com os compromissos aqui, porque senão a gente perde tudo\". O compromisso negociado era de US$ 24 milhões, e ao menos US$ 10,6 milhões foram pagos em seis operações entre fevereiro e maio de 2025.<sup class=\"fn\"><a href=\"#\" data-fonte=\"4\">4<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Flávio chamou a informação de \"mentira\" ao repórter e, no mesmo dia, admitiu as mensagens em vídeo, dizendo que buscava investimento privado para o filme do pai. A revelação gerou ao menos 20 pedidos de investigação ao STF, à PGR, à PF e a outros órgãos.<sup class=\"fn\"><a href=\"#\" data-fonte=\"6\">6<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"7\">7<\/a><\/sup> Ver <a class=\"ref\" href=\"#relacao-flavio-vorcaro\" data-id=\"relacao-flavio-vorcaro\">Relação de Flávio com Vorcaro<\/a>.<\/p><\/section><section><h3>A rota do dinheiro<\/h3><p><span class=\"st st-documentado\">Documentado<\/span> Segundo planilha e comprovante bancário publicados pelo Intercept em 09/06/2026, o dinheiro saiu da Entre Investimentos e Participações, passou pelo banco BS2 e chegou ao fundo Havengate Development Fund, nos EUA, controlado por Paulo Calixto, advogado de <a class=\"ref\" href=\"#eduardo-bolsonaro\" data-id=\"eduardo-bolsonaro\">Eduardo Bolsonaro<\/a>. O primeiro envio, de US$ 2 milhões, foi em 13/02/2025. A Entre e Vorcaro negam vínculo societário; a reportagem não afirma que Eduardo tenha participado das operações.<sup class=\"fn\"><a href=\"#\" data-fonte=\"5\">5<\/a><\/sup><\/p><p><span class=\"st st-alegacao\">Alegação<\/span> Segundo o Intercept, um intermediário escreveu que \"Flávio está ciente de tudo\". Não há confirmação independente de que Flávio soubesse da origem dos recursos.<sup class=\"fn\"><a href=\"#\" data-fonte=\"4\">4<\/a><\/sup><\/p><\/section><section><h3>Proposta de delação de Vorcaro<\/h3><p><span class=\"st st-alegacao\">Alegação<\/span> Em junho de 2026, a nova proposta de delação de Vorcaro à PF e à PGR afirma que Flávio fez cobranças e que cerca de R$ 60 milhões foram para a produção. A primeira proposta tinha sido rejeitada por omitir dados; a nova não tinha sido aceita até a última notícia encontrada.<sup class=\"fn\"><a href=\"#\" data-fonte=\"8\">8<\/a><\/sup><\/p><\/section><section><h3>Emendas parlamentares (Operação Make Up)<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Em 10/09/2026, a PF cumpriu 49 mandados de busca na Operação Make Up, relatada pelo ministro Flávio Dino, do STF. Ela apura se cerca de R$ 2 milhões em emendas do deputado Mario Frias (PL-SP) a entidades ligadas à produtora Karina Gama foram desviados para o filme. Frias e outras 28 pessoas foram proibidos de deixar o país. Flávio não é alvo dessa operação. Frias não respondeu.<sup class=\"fn\"><a href=\"#\" data-fonte=\"9\">9<\/a><\/sup><\/p><\/section><section><h3>Investigação<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Em julho de 2026, o ministro André Mendonça, do STF, autorizou investigar <a class=\"ref\" href=\"#flavio-bolsonaro\" data-id=\"flavio-bolsonaro\">Flávio Bolsonaro<\/a> por suspeita de lavagem de dinheiro, evasão de divisas e corrupção no financiamento do filme. O procedimento corre em sigilo, vinculado ao inquérito do caso Master (INQ 5026), e veio a público quando Mendonça retirou o sigilo do inquérito principal, em 10/09. Não há denúncia nem indiciamento conhecidos.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><\/section><section><h3>Quem diz o quê<\/h3><p><strong>Flávio Bolsonaro<\/strong>: diz que quem deve esclarecer os pagamentos é a produtora do filme.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup> Na sabatina da TV Globo, em 16/10, disse não ter havido irregularidade, que Vorcaro aceitou participar antes de haver suspeitas sobre o banco e que as contas da produção já tinham sido prestadas. O UOL Confere classificou esta última afirmação como falsa.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><\/p><p><strong>Rogério Marinho<\/strong>, coordenador da campanha: disse que \"não há fato novo\" na investigação.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><\/section><section><h3>O que está comprovado<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> O financiamento, admitido por Flávio.<\/p><p><span class=\"st st-alegacao\">Alegação<\/span> Que tenha se tratado de investimento privado comum. O Aos Fatos afirma que não é possível confirmar essa versão com as provas divulgadas até setembro de 2026.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><\/section><section class=\"fontes\"><h3>Fontes<\/h3><ol><li id=\"f-dark-horse-1\" value=\"1\">Aos Fatos, \"Oito homens e um banqueiro: explicamos as novas revelações do caso Master\", 09/2026. <a href=\"https://www.aosfatos.org/noticias/explicamos-novas-revelacoes-caso-master/\" target=\"_blank\" rel=\"noopener\">https://www.aosfatos.org/noticias/explicamos-novas-revelacoes-caso-master/<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-dark-horse-2\" value=\"2\">Poder360, \"Flávio é investigado no STF por financiamento do Dark Horse\", 11/09/2026. <a href=\"https://www.poder360.com.br/poder-justica/flavio-e-investigado-no-stf-por-financiamento-do-dark-horse/\" target=\"_blank\" rel=\"noopener\">https://www.poder360.com.br/poder-justica/flavio-e-investigado-no-stf-por-financiamento-do-dark-horse/<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-dark-horse-3\" value=\"3\">A Crítica, \"Em sabatina, Flávio não explica propostas e cita acusações falsas\" (com checagens do UOL Confere), 17/10/2026. <a href=\"https://acritica.net/noticias/em-sabatina-flavio-nao-explica-propostas-e-cita-acusacoes-falsas/\" target=\"_blank\" rel=\"noopener\">https://acritica.net/noticias/em-sabatina-flavio-nao-explica-propostas-e-cita-acusacoes-falsas/<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-dark-horse-4\" value=\"4\">Intercept Brasil, \"Áudio: Flávio Bolsonaro negociou com Daniel Vorcaro R$ 134 milhões para bancar filme sobre Jair\", 13/05/2026. <a href=\"https://www.intercept.com.br/2026/05/13/audio-flavio-negociou-vorcaro-milhoes/\" target=\"_blank\" rel=\"noopener\">https://www.intercept.com.br/2026/05/13/audio-flavio-negociou-vorcaro-milhoes/<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-dark-horse-5\" value=\"5\">Intercept Brasil, \"Planilha e comprovante bancário mostram co
