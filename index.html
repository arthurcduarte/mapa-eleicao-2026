etadopovo.com.br/eleicoes/2026/tse-confirma-decisao-que-mandou-meta-garantir-igualdade-entre-flavio-e-lula-nas-redes/\" target=\"_blank\" rel=\"noopener\">https://www.gazetadopovo.com.br/eleicoes/2026/tse-confirma-decisao-que-mandou-meta-garantir-igualdade-entre-flavio-e-lula-nas-redes/<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-nunes-marques-14\" value=\"14\">ICL Notícias / Folhapress, \"Kassio estuda estender impedimento no caso Master\", 16/10/2026. <a href=\"https://iclnoticias.com.br/kassio-estuda-estender-impedimento-no-master/\" target=\"_blank\" rel=\"noopener\">https://iclnoticias.com.br/kassio-estuda-estender-impedimento-no-master/<\/a> (acesso em 17/10/2026)<\/li><\/ol><\/section><section class=\"hist\"><h3>Histórico<\/h3><ul><li>14/10/2026: verbete criado.<\/li><li>15/10/2026: atualizado com notícias de 13 a 15/10.<\/li><li>15/10/2026: incluída a reportagem da piauí.<\/li><li>17/10/2026: atualizado com notícias de 16 e 17/10.<\/li><\/ul><\/section>", "texto": "Quem é Ministro do STF, indicado por Jair Bolsonaro em 2020 para a vaga de Celso de Mello. Antes, foi nomeado ao TRF-1 por Dilma Rousseff, em 2011. Preside o TSE durante a eleição de 2026. Decisões na eleição Em 11/10/2026, a pedido da campanha de Flávio Bolsonaro, suspendeu o canal Exército do Lula, por ver indícios de disseminação coordenada de conteúdo falso. O corregedor Ricardo Villas Bôas Cueva reverteu a decisão horas depois. Em 13/10, suspendeu o canal de novo por falta de registro no TSE. Ainda em 13/10, reconheceu o registro do canal e autorizou a retomada após 48 horas. O corregedor Cueva pediu que ele leve o caso ao plenário com urgência. O canal Tropa do Flávio, também sem registro até 13/10, não foi suspenso. Ficou vencido na decisão colegiada que multou Flávio Bolsonaro em R$ 5 mil por associar Lula ao PCC e ao Comando Vermelho. Ver disputas-tse-2turno. Advogados ouvidos pelo Nexo classificaram decisões do ministro como \"pouco usuais\". Ministros do TSE e do STF ouvidos sem identificação por O Globo, Estadão e CNN dizem que ele passou à frente do corregedor no caso Exército do Lula e age para evitar o plenário, onde seria derrotado. Segundo a CNN, há no tribunal clima de \"incômodo e de desconfiança\". Nunes Marques disse a interlocutores que considera o caso resolvido e que não faz sentido levá-lo ao plenário. Em 15/10, a Associação Brasileira de Juristas pela Democracia (ABJD) protocolou no TSE pedido de suspeição do ministro, citando as decisões sobre o Exército do Lula e o tratamento diferente dado à Tropa do Flávio. Até 17/10, o pedido não tinha sido pautado. Em 16/10, acompanhou a decisão unânime do plenário que confirmou as obrigações impostas à Meta para garantir tratamento igual às duas campanhas. Ver meta-interferencia. Caso Master O escritório de Kevin Marques, filho do ministro, recebeu cerca de R$ 281 mil de uma consultoria que recebeu R$ 6,6 milhões do Banco Master. O Coaf classificou as operações da consultoria como incompatíveis com sua capacidade financeira. A defesa diz que Kevin nunca atuou para o banco. Em 15/09/2026, declarou-se impedido de julgar no STF a validade das provas do celular de Vorcaro enquanto preside o TSE. Avalia voltar ao caso após a eleição. Mensagens do celular de Vorcaro citam \"Kassio\" e \"ministro\". Em 15/10, a piauí reconstituiu com 125 mensagens uma festa com garotas de programa no triplex de Vorcaro e a liga ao ministro por interpretação de nomes e siglas. Segundo a revista, a defesa do Master pediu três vezes que ele relatasse o caso do banco. Ver kassio-vorcaro. Deputados do PT pediram ao STF investigação contra ele por corrupção passiva, lavagem e outros crimes. Segundo a Folhapress, estuda estender o impedimento no caso Master para além da eleição, para se antecipar a pedidos de suspeição. A pedido do presidente do STF, Edson Fachin, a PF vai reunir e enviar à corte todas as menções a ministros encontradas no caso. Resposta Nunes Marques nega contato com Vorcaro, diz que nunca autorizou ninguém a falar em seu nome e lembra que votou pela manutenção da prisão do banqueiro. Fontes 1. Wikipedia, \"Nunes Marques\". (acesso em 14/10/2026) 2. SBT News, \"'Exército do Lula': entenda vaivém de decisões do TSE\", 10/2026. (acesso em 14/10/2026) 3. Brasil de Fato, \"Enquanto TSE suspende grupo pró-Lula, canal 'Tropa do Flávio' dispara fake news no WhatsApp\", 13/10/2026. (acesso em 14/10/2026) 4. Correio Braziliense, \"Deputados do PT pedem investigação contra Nunes Marques por caso Master\", 10/2026. (acesso em 14/10/2026) 5. SP Diário, \"Nunes Marques avalia voltar a julgar processos ligados ao Banco Master após eleições\". (acesso em 14/10/2026) 6. Nexo, \"Como Nunes Marques acena ao bolsonarismo no TSE e no STF\", 13/10/2026. (acesso em 14/10/2026) 7. Portal 27, \"Festas de luxo e garotas de programa: entenda a menção a Kassio Nunes Marques no caso Vorcaro\". (acesso em 14/10/2026) 8. CNN Brasil, \"Corregedor cobra julgamento sobre 'Exército do Lula' no plenário do TSE\", 13/10/2026. (acesso em 15/10/2026) 9. Itatiaia, \"Disputa judicial entre Flávio e Lula se intensifica no segundo turno\", 10/2026. (acesso em 15/10/2026) 10. Brasil 247 (a partir da coluna de Bela Megale, O Globo), \"Ministros do TSE e do STF acusam Nunes Marques de atropelar decisões no segundo turno\", 12/10/2026. (acesso em 17/10/2026) 11. A Crítica (a partir do Estadão), \"Ministros do TSE cobram plenário e criticam Nunes Marques no caso Exército do Lula\", 13/10/2026. (acesso em 17/10/2026) 12. TVT News, \"ABJD protocola pedido de suspeição do ministro Kassio Nunes\", 15/10/2026. (acesso em 17/10/2026) 13. Gazeta do Povo, \"TSE confirma decisão que mandou Meta garantir igualdade entre Flávio e Lula nas redes\", 16/10/2026. (acesso em 17/10/2026) 14. ICL Notícias / Folhapress, \"Kassio estuda estender impedimento no caso Master\", 16/10/2026. (acesso em 17/10/2026) Histórico - 14/10/2026: verbete criado. - 15/10/2026: atualizado com notícias de 13 a 15/10. - 15/10/2026: incluída a reportagem da piauí. - 17/10/2026: atualizado com notícias de 16 e 17/10."}, {"id": "trump", "titulo": "Donald Trump", "tipo": "pessoa", "temas": ["eua"], "apelidos": ["Trump", "presidente dos EUA", "Casa Branca"], "data": null, "status": "comprovado", "resumo": "Presidente dos EUA. Impôs tarifa de 50% ao Brasil em 2025 citando o julgamento de Bolsonaro. Em 2026 disse acompanhar a eleição brasileira \"muito de perto\", sem declarar apoio.", "revisado": "2026-10-14", "html": "<section><h3>Quem é<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Presidente dos Estados Unidos desde janeiro de 2025.<\/p><\/section><section><h3>Relação com o Brasil<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Em 09/07/2025, anunciou tarifa de 50% sobre produtos brasileiros. A carta citava o julgamento de <a class=\"ref\" href=\"#jair-bolsonaro\" data-id=\"jair-bolsonaro\">Jair Bolsonaro<\/a> e decisões do STF sobre plataformas americanas. Ver <a class=\"ref\" href=\"#tarifaco-2025\" data-id=\"tarifaco-2025\">Tarifaço de 2025<\/a>.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Em 01/10/2026, disse que acompanha a eleição brasileira \"muito de perto\" e chamou o Brasil de \"país muito importante\". Não declarou apoio a nenhum candidato, ao contrário do que fez na Colômbia.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> O Departamento de Estado liberou cerca de US$ 1 milhão para o projeto \"Countering Lawfare and Censorship in Brazil\", de grupos críticos ao STF, segundo o The Guardian.<sup class=\"fn\"><a href=\"#\" data-fonte=\"5\">5<\/a><\/sup><\/p><\/section><section class=\"fontes\"><h3>Fontes<\/h3><ol><li id=\"f-trump-1\" value=\"1\">Poder360, \"Trump anuncia tarifa de 50% para produtos do Brasil\", 09/07/2025. <a href=\"https://www.poder360.com.br/poder-internacional/trump-anuncia-tarifa-de-50-para-produtos-do-brasil/\" target=\"_blank\" rel=\"noopener\">https://www.poder360.com.br/poder-internacional/trump-anuncia-tarifa-de-50-para-produtos-do-brasil/<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-trump-2\" value=\"2\">Agência Brasil, \"Trump diz acompanhar de perto eleição brasileira e não declara apoio\", 01/10/2026. <a href=\"https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/trump-diz-acompanhar-de-perto-eleicao-brasileira-e-nao-declarar-apoio\" target=\"_blank\" rel=\"noopener\">https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/trump-diz-acompanhar-de-perto-eleicao-brasileira-e-nao-declarar-apoio<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-trump-3\" value=\"3\">Correio Braziliense, \"O que o governo dos EUA diz sobre fechamento de embaixada e consulados no Brasil\", 10/2026. <a href=\"https://www.correiobraziliense.com.br/mundo/2026/10/7513016-o-que-o-governo-dos-eua-diz-sobre-fechamento-de-embaixada-e-consulados-no-brasil-as-vesperas-da-eleicao.html\" target=\"_blank\" rel=\"noopener\">https://www.correiobraziliense.com.br/mundo/2026/10/7513016-o-que-o-governo-dos-eua-diz-sobre-fechamento-de-embaixada-e-consulados-no-brasil-as-vesperas-da-eleicao.html<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-trump-4\" value=\"4\">Agência Pública, \"How Trump's trade war with Brazil serves Big Tech's interests\", 07/2025. <a href=\"https://apublica.org/2025/07/how-trumps-trade-war-with-brazil-serves-big-techs-interests/\" target=\"_blank\" rel=\"noopener\">https://apublica.org/2025/07/how-trumps-trade-war-with-brazil-serves-big-techs-interests/<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-trump-5\" value=\"5\">SBT News, \"EUA destinam US$ 1 milhão para projeto anti-STF, diz jornal\", 10/2026. <a href=\"https://sbtnews.sbt.com.br/noticia/politica/eua-destinam-us-1-milhao-para-projeto-anti-stf-diz-jornal\" target=\"_blank\" rel=\"noopener\">https://sbtnews.sbt.com.br/noticia/politica/eua-destinam-us-1-milhao-para-projeto-anti-stf-diz-jornal<\/a> (acesso em 14/10/2026)<\/li><\/ol><\/section><section class=\"hist\"><h3>Histórico<\/h3><ul><li>14/10/2026: verbete criado.<\/li><\/ul><\/section>", "texto": "Quem é Presidente dos Estados Unidos desde janeiro de 2025. Relação com o Brasil Em 09/07/2025, anunciou tarifa de 50% sobre produtos brasileiros. A carta citava o julgamento de Jair Bolsonaro e decisões do STF sobre plataformas americanas. Ver tarifaco-2025. Em 01/10/2026, disse que acompanha a eleição brasileira \"muito de perto\" e chamou o Brasil de \"país muito importante\". Não declarou apoio a nenhum candidato, ao contrário do que fez na Colômbia. O Departamento de Estado liberou cerca de US$ 1 milhão para o projeto \"Countering Lawfare and Censorship in Brazil\", de grupos críticos ao STF, segundo o The Guardian. Fontes 1. Poder360, \"Trump anuncia tarifa de 50% para produtos do Brasil\", 09/07/2025. (acesso em 14/10/2026) 2. Agência Brasil, \"Trump diz acompanhar de perto eleição brasileira e não declara apoio\", 01/10/2026. (acesso em 14/10/2026) 3. Correio Braziliense, \"O que o governo dos EUA diz sobre fechamento de embaixada e consulados no Brasil\", 10/2026. (acesso em 14/10/2026) 4. Agência Pública, \"How Trump's trade war with Brazil serves Big Tech's interests\", 07/2025. (acesso em 14/10/2026) 5. SBT News, \"EUA destinam US$ 1 milhão para projeto anti-STF, diz jornal\", 10/2026. (acesso em 14/10/2026) Histórico - 14/10/2026: verbete criado."}, {"id": "vorcaro", "titulo": "Daniel Vorcaro", "tipo": "pessoa", "temas": ["master"], "apelidos": ["Vorcaro", "Daniel Vorcaro", "dono do Master", "banqueiro"], "data": null, "status": "comprovado", "resumo": "Ex-controlador do Banco Master, preso em novembro de 2025 por lavagem de dinheiro. Mensagens do celular dele citam ministros do STF, políticos de vários partidos e autoridades.", "revisado": "2026-10-16", "html": "<section><h3>Quem é<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Ex-controlador do Banco Master. Preso em 18/11/2025, no mesmo dia em que o Banco Central decretou a liquidação extrajudicial do banco.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><\/section><section><h3>O que as investigações apontam<\/h3><p><span class=\"st st-documentado\">Documentado<\/span> O relatório da Polícia Federal com mensagens do celular dele, tornado público em 01/09/2026, cita contatos com ministros do STF, o procurador-geral da República, o diretor-geral da PF e políticos de vários partidos. Ver <a class=\"ref\" href=\"#caso-master\" data-id=\"caso-master\">Caso Banco Master<\/a>.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Financiou o filme <a class=\"ref\" href=\"#dark-horse\" data-id=\"dark-horse\">Dark Horse<\/a>, sobre Jair Bolsonaro, a pedido de <a class=\"ref\" href=\"#flavio-bolsonaro\" data-id=\"flavio-bolsonaro\">Flávio Bolsonaro<\/a>.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> Foi recebido por <a class=\"ref\" href=\"#lula\" data-id=\"lula\">Lula<\/a> no Planalto em dezembro de 2024, fora da agenda.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> Segundo mensagens analisadas pela PF e reveladas pelo UOL em 15/10/2026, recebia reportagens do Metrópoles antes da publicação e pedia mudanças. Ver <a class=\"ref\" href=\"#vorcaro-metropoles\" data-id=\"vorcaro-metropoles\">Vorcaro e as reportagens do Metrópoles<\/a>.<\/p><p><span class=\"st st-documentado\">Documentado<\/span> Trocava mensagens com Frederic Kachar, diretor-geral de veículos do Grupo Globo, sobre cobertura e patrocínios. Kachar foi demitido em 15/10/2026. Ver <a class=\"ref\" href=\"#globo\" data-id=\"globo\">Grupo Globo<\/a>.<\/p><\/section><section class=\"fontes\"><h3>Fontes<\/h3><ol><li id=\"f-vorcaro-1\" value=\"1\">Wikipedia, \"Banco Master\". <a href=\"https://en.wikipedia.org/wiki/Banco_Master\" target=\"_blank\" rel=\"noopener\">https://en.wikipedia.org/wiki/Banco_Master<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-vorcaro-2\" value=\"2\">Aos Fatos, \"Oito homens e um banqueiro: explicamos as novas revelações do caso Master\", 09/2026. <a href=\"https://www.aosfatos.org/noticias/explicamos-novas-revelacoes-caso-master/\" target=\"_blank\" rel=\"noopener\">https://www.aosfatos.org/noticias/explicamos-novas-revelacoes-caso-master/<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-vorcaro-3\" value=\"3\">Portal de Prefeitura, \"Lula teve encontro fora da agenda no Planalto com Vorcaro\", 26/01/2026. <a href=\"https://portaldeprefeitura.com.br/bastidores-da-politica/lula-teve-encontro-fora-da-agenda-no-planalto-com-vorcaro/613758/\" target=\"_blank\" rel=\"noopener\">https://portaldeprefeitura.com.br/bastidores-da-politica/lula-teve-encontro-fora-da-agenda-no-planalto-com-vorcaro/613758/<\/a> (acesso em 14/10/2026)<\/li><\/ol><\/section><section class=\"hist\"><h3>Histórico<\/h3><ul><li>14/10/2026: verbete criado.<\/li><li>15/10/2026: atualizado com notícias de 13 a 15/10.<\/li><li>16/10/2026: incluída a relação com a Globo.<\/li><\/ul><\/section>", "texto": "Quem é Ex-controlador do Banco Master. Preso em 18/11/2025, no mesmo dia em que o Banco Central decretou a liquidação extrajudicial do banco. O que as investigações apontam O relatório da Polícia Federal com mensagens do celular dele, tornado público em 01/09/2026, cita contatos com ministros do STF, o procurador-geral da República, o diretor-geral da PF e políticos de vários partidos. Ver caso-master. Financiou o filme Dark Horse, sobre Jair Bolsonaro, a pedido de Flávio Bolsonaro. Foi recebido por Lula no Planalto em dezembro de 2024, fora da agenda. Segundo mensagens analisadas pela PF e reveladas pelo UOL em 15/10/2026, recebia reportagens do Metrópoles antes da publicação e pedia mudanças. Ver vorcaro-metropoles. Trocava mensagens com Frederic Kachar, diretor-geral de veículos do Grupo Globo, sobre cobertura e patrocínios. Kachar foi demitido em 15/10/2026. Ver globo. Fontes 1. Wikipedia, \"Banco Master\". (acesso em 14/10/2026) 2. Aos Fatos, \"Oito homens e um banqueiro: explicamos as novas revelações do caso Master\", 09/2026. (acesso em 14/10/2026) 3. Portal de Prefeitura, \"Lula teve encontro fora da agenda no Planalto com Vorcaro\", 26/01/2026. (acesso em 14/10/2026) Histórico - 14/10/2026: verbete criado. - 15/10/2026: atualizado com notícias de 13 a 15/10. - 16/10/2026: incluída a relação com a Globo."}, {"id": "caso-master", "titulo": "Caso Banco Master", "tipo": "tema", "temas": ["master"], "apelidos": ["Master", "Banco Master", "escândalo do Master", "caso Vorcaro"], "data": null, "status": "comprovado", "resumo": "Liquidação do Banco Master em 2025 e prisão de Daniel Vorcaro. Mensagens do celular dele citam ministros do STF, o PGR, o diretor da PF e políticos de vários partidos.", "revisado": "2026-10-16", "html": "<section><h3>O que é<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Em 18/11/2025, o Banco Central decretou a liquidação extrajudicial do Banco Master, e o controlador <a class=\"ref\" href=\"#vorcaro\" data-id=\"vorcaro\">Daniel Vorcaro<\/a> foi preso por lavagem de dinheiro. O Will Bank, do mesmo grupo, foi liquidado em janeiro de 2026.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><\/section><section><h3>Quem aparece<\/h3><p>As menções abaixo vêm de mensagens, depoimentos e reportagens, sem conclusão judicial até 14/10/2026.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><ul><li><span class=\"st st-documentado\">Documentado<\/span> <a class=\"ref\" href=\"#moraes\" data-id=\"moraes\">Alexandre de Moraes<\/a>: mensagens a um celular atribuído a ele e contrato com o escritório da esposa. Nega.<\/li><li><span class=\"st st-documentado\">Documentado<\/span> André Mendonça, relator: admite um encontro com Vorcaro e nega relação com o banco.<\/li><li><span class=\"st st-documentado\">Documentado<\/span> Paulo Gonet (PGR) e Andrei Rodrigues (diretor-geral da PF): citados em mensagens. Gonet pediu a anulação da investigação; Rodrigues diz que Vorcaro mentiu.<\/li><li><span class=\"st st-documentado\">Documentado<\/span> Nikolas Ferreira (PL): voos pagos por Vorcaro, segundo as mensagens. Nega proximidade.<\/li><li><span class=\"st st-alegacao\">Alegação<\/span> Gilberto Kassab: citado na proposta de delação. Diz que o relato não tem \"qualquer sustentação factual\".<\/li><li><span class=\"st st-comprovado\">Comprovado<\/span> <a class=\"ref\" href=\"#flavio-bolsonaro\" data-id=\"flavio-bolsonaro\">Flávio Bolsonaro<\/a>: recursos de Vorcaro para o filme <a class=\"ref\" href=\"#dark-horse\" data-id=\"dark-horse\">Dark Horse<\/a>.<\/li><li><span class=\"st st-documentado\">Documentado<\/span> <a class=\"ref\" href=\"#lula\" data-id=\"lula\">Lula<\/a>: recebeu Vorcaro no Planalto em dezembro de 2024.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><\/li><li><span class=\"st st-alegacao\">Alegação<\/span> <a class=\"ref\" href=\"#nunes-marques\" data-id=\"nunes-marques\">Kassio Nunes Marques<\/a>: ver <a class=\"ref\" href=\"#kassio-vorcaro\" data-id=\"kassio-vorcaro\">Menções a \"Kassio\" nas mensagens de Vorcaro<\/a>.<\/li><li><span class=\"st st-documentado\">Documentado<\/span> Globo: demitiu em 15/10/2026 o diretor-geral Frederic Kachar por mensagens com Vorcaro sobre cobertura e patrocínios. Ver <a class=\"ref\" href=\"#globo\" data-id=\"globo\">Grupo Globo<\/a>.<\/li><li><span class=\"st st-documentado\">Documentado<\/span> Metrópoles: recebeu R$ 20 milhões do Master e, segundo a PF, enviava reportagens a Vorcaro antes da publicação. Ver <a class=\"ref\" href=\"#vorcaro-metropoles\" data-id=\"vorcaro-metropoles\">Vorcaro e as reportagens do Metrópoles<\/a>.<\/li><\/ul><\/section><section class=\"fontes\"><h3>Fontes<\/h3><ol><li id=\"f-caso-master-1\" value=\"1\">Wikipedia, \"Banco Master\". <a href=\"https://en.wikipedia.org/wiki/Banco_Master\" target=\"_blank\" rel=\"noopener\">https://en.wikipedia.org/wiki/Banco_Master<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-caso-master-2\" value=\"2\">Aos Fatos, \"Oito homens e um banqueiro: explicamos as novas revelações do caso Master\", 09/2026. <a href=\"https://www.aosfatos.org/noticias/explicamos-novas-revelacoes-caso-master/\" target=\"_blank\" rel=\"noopener\">https://www.aosfatos.org/noticias/explicamos-novas-revelacoes-caso-master/<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-caso-master-3\" value=\"3\">Portal de Prefeitura, \"Lula teve encontro fora da agenda no Planalto com Vorcaro\", 26/01/2026. <a href=\"https://portaldeprefeitura.com.br/bastidores-da-politica/lula-teve-encontro-fora-da-agenda-no-planalto-com-vorcaro/613758/\" target=\"_blank\" rel=\"noopener\">https://portaldeprefeitura.com.br/bastidores-da-politica/lula-teve-encontro-fora-da-agenda-no-planalto-com-vorcaro/613758/<\/a> (acesso em 14/10/2026)<\/li><\/ol><\/section><section class=\"hist\"><h3>Histórico<\/h3><ul><li>14/10/2026: verbete criado.<\/li><li>15/10/2026: atualizado com notícias de 13 a 15/10.<\/li><li>16/10/2026: incluída a Globo.<\/li><\/ul><\/section>", "texto": "O que é Em 18/11/2025, o Banco Central decretou a liquidação extrajudicial do Banco Master, e o controlador Daniel Vorcaro foi preso por lavagem de dinheiro. O Will Bank, do mesmo grupo, foi liquidado em janeiro de 2026. Quem aparece As menções abaixo vêm de mensagens, depoimentos e reportagens, sem conclusão judicial até 14/10/2026. - Alexandre de Moraes: mensagens a um celular atribuído a ele e contrato com o escritório da esposa. Nega. - André Mendonça, relator: admite um encontro com Vorcaro e nega relação com o banco. - Paulo Gonet (PGR) e Andrei Rodrigues (diretor-geral da PF): citados em mensagens. Gonet pediu a anulação da investigação; Rodrigues diz que Vorcaro mentiu. - Nikolas Ferreira (PL): voos pagos por Vorcaro, segundo as mensagens. Nega proximidade. - Gilberto Kassab: citado na proposta de delação. Diz que o relato não tem \"qualquer sustentação factual\". - Flávio Bolsonaro: recursos de Vorcaro para o filme Dark Horse. - Lula: recebeu Vorcaro no Planalto em dezembro de 2024. - Kassio Nunes Marques: ver kassio-vorcaro. - Globo: demitiu em 15/10/2026 o diretor-geral Frederic Kachar por mensagens com Vorcaro sobre cobertura e patrocínios. Ver globo. - Metrópoles: recebeu R$ 20 milhões do Master e, segundo a PF, enviava reportagens a Vorcaro antes da publicação. Ver vorcaro-metropoles. Fontes 1. Wikipedia, \"Banco Master\". (acesso em 14/10/2026) 2. Aos Fatos, \"Oito homens e um banqueiro: explicamos as novas revelações do caso Master\", 09/2026. (acesso em 14/10/2026) 3. Portal de Prefeitura, \"Lula teve encontro fora da agenda no Planalto com Vorcaro\", 26/01/2026. (acesso em 14/10/2026) Histórico - 14/10/2026: verbete criado. - 15/10/2026: atualizado com notícias de 13 a 15/10. - 16/10/2026: incluída a Globo."}, {"id": "relacao-flavio-vorcaro", "titulo": "Relação de Flávio com Vorcaro", "tipo": "tema", "temas": ["master", "campanhas"], "apelidos": ["Flávio e Vorcaro", "encontros com Vorcaro", "contigo sempre", "jatinho de Vorcaro", "Sicário", "Ciro Nogueira", "43 mentiras", "CPI do Master"], "data": "2025-08-20", "status": "documentado", "resumo": "Mensagens extraídas pela PF mostram encontros e conversas frequentes entre Flávio e Vorcaro em 2025, inclusive no dia em que a compra do Master pelo BRB foi sancionada e na véspera da prisão do banqueiro. Flávio diz que o assunto era só o filme Dark Horse.", "revisado": "2026-10-17", "html": "<section><h3>Encontros e mensagens<\/h3><p><span class=\"st st-documentado\">Documentado<\/span> Mensagens do celular de <a class=\"ref\" href=\"#vorcaro\" data-id=\"vorcaro\">Daniel Vorcaro<\/a>, extraídas pela PF e reveladas pelo Estadão, mencionam seis encontros entre ele e <a class=\"ref\" href=\"#flavio-bolsonaro\" data-id=\"flavio-bolsonaro\">Flávio Bolsonaro<\/a>. Nem todos têm confirmação de que aconteceram. As conversas disponíveis vão de 20/08 a 16/11/2025, porque Flávio tinha ativado a exclusão automática do histórico a cada três meses.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> Em 20/08/2025, Flávio foi à casa de Vorcaro, em Brasília, com o senador Ciro Nogueira (PP). Foi o mesmo dia em que o governador do DF, Ibaneis Rocha, sancionou a aprovação da compra do Master pelo BRB. O presidente da Câmara, Hugo Motta, foi convidado; sua assessoria não confirmou nem negou a presença. Flávio e Ciro não comentaram o encontro na reportagem.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> Depois que o Banco Central reprovou a compra pelo BRB, Vorcaro pediu um novo encontro, e Flávio confirmou. Nas mensagens, Flávio também se oferece para falar com o irmão Eduardo quando Vorcaro tentava vender o banco a investidores em Dubai. Eduardo nega contato com Vorcaro.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> Em 16/11/2025, véspera da prisão de Vorcaro, Flávio escreveu que estaria \"contigo sempre\", segundo o Aos Fatos.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><\/p><\/section><section><h3>O avião<\/h3><p><span class=\"st st-documentado\">Documentado<\/span> Em janeiro de 2025, Flávio voou com a família de Fort Lauderdale (EUA) a Brasília num Legacy 650 em que Vorcaro tinha um terço das cotas, por meio da empresa Prime You. Outro cotista, o advogado Willer Tomaz, diz que oferecia \"caronas\" a amigos e não respondeu se Flávio era seu convidado. É o mesmo avião que levou Alexandre de Moraes em 2024 e que Flávio citou para atacar o ministro. Flávio não respondeu à reportagem.<sup class=\"fn\"><a href=\"#\" data-fonte=\"4\">4<\/a><\/sup><\/p><\/section><section><h3>A foto com &quot;Sicário&quot;<\/h3><p><span class=\"st st-documentado\">Documentado<\/span> Em 15/07/2026, o ICL publicou foto de Flávio ao lado de Luiz Philipi Mourão, o \"Sicário\", apontado pela PF como chefe do núcleo de intimidação de Vorcaro, morto sob custódia em março. Não se sabe quando nem onde a foto foi tirada.<sup class=\"fn\"><a href=\"#\" data-fonte=\"5\">5<\/a><\/sup><\/p><p><strong>Flávio<\/strong>: primeiro disse não se lembrar do homem e que tira muitas fotos com desconhecidos; depois afirmou que a imagem foi feita com IA. A plataforma SignaIP e cinco ferramentas usadas pela jornalista não encontraram sinal de IA.<sup class=\"fn\"><a href=\"#\" data-fonte=\"5\">5<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"6\">6<\/a><\/sup><\/p><\/section><section><h3>Atuação no Senado<\/h3><p><span class=\"st st-documentado\">Documentado<\/span> Flávio votou a favor de um artigo da lei de licenciamento ambiental que limita a responsabilidade de bancos por danos de projetos que financiam, e votou pela derrubada do veto de Lula a esse artigo, em novembro de 2025. O Master investia em mineração e créditos de carbono no período. A própria reportagem diz não haver prova de que a atuação tenha beneficiado o banco ou sido pedida por Vorcaro, e a regra vale para todo o sistema financeiro.<sup class=\"fn\"><a href=\"#\" data-fonte=\"7\">7<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Flávio disse ao menos quatro vezes que defende a CPI do Master, mas assinou dois dos cinco pedidos de CPI que poderia apoiar.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"8\">8<\/a><\/sup><\/p><\/section><section><h3>O que Flávio disse ao longo do tempo<\/h3><p><span class=\"st st-documentado\">Documentado<\/span> O Aos Fatos reuniu 43 declarações enganosas de Flávio sobre o caso, de fevereiro a setembro de 2026. Em março, negou conhecer Vorcaro; em maio, chamou de \"mentira\" o áudio revelado pelo Intercept e, no mesmo dia, admitiu as mensagens em vídeo, dizendo que buscava investimento para o filme do pai. Disse também que não havia acusação contra Vorcaro na época, embora a piauí já tivesse noticiado problemas de liquidez do banco em abril de 2025. Flávio não respondeu ao Aos Fatos.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><\/p><\/section><section><h3>O que circula sem prova<\/h3><p><span class=\"st st-alegacao\">Alegação<\/span> Em 08/10/2026, advogados do grupo Prerrogativas pediram à PF que apure uma possível articulação entre Vorcaro e aliados de Flávio para interferir no 2º turno, a partir de relatos de um suposto depoimento gravado em HD. Os próprios autores dizem não ter tido acesso à gravação.<sup class=\"fn\"><a href=\"#\" data-fonte=\"9\">9<\/a><\/sup><\/p><p><span class=\"st st-desmentido\">Desmentido<\/span> Em março de 2026, a Justiça do DF mandou remover publicações com uma imagem feita por IA que mostrava Flávio num encontro com Vorcaro que não aconteceu. A decisão é liminar.<sup class=\"fn\"><a href=\"#\" data-fonte=\"10\">10<\/a><\/sup><\/p><\/section><section><h3>O que está comprovado<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Que Flávio e Vorcaro mantinham contato direto e frequente em 2025, e que Flávio pediu e cobrou dinheiro do banqueiro para o filme. Ver <a class=\"ref\" href=\"#dark-horse\" data-id=\"dark-horse\">Financiamento do filme Dark Horse<\/a>.<\/p><p><span class=\"st st-alegacao\">Alegação<\/span> Que Flávio tenha agido em favor do Master ou sabia da origem ilícita dos recursos. É o que o inquérito no STF apura.<\/p><\/section><section class=\"fontes\"><h3>Fontes<\/h3><ol><li id=\"f-relacao-flavio-vorcaro-1\" value=\"1\">Terra (a partir do Estadão), \"Mensagens trocadas entre Flávio Bolsonaro e Vorcaro mencionam seis encontros\", 24/09/2026. <a href=\"https://www.terra.com.br/noticias/brasil/politica/mensagens-trocadas-entre-flavio-bolsonaro-e-vorcaro-mencionam-seis-encontros-entre-o-senador-e-o-banqueiro,759c606ae7fded26f0275827cc97bf9c1unkbs01.html\" target=\"_blank\" rel=\"noopener\">https://www.terra.com.br/noticias/brasil/politica/mensagens-trocadas-entre-flavio-bolsonaro-e-vorcaro-mencionam-seis-encontros-entre-o-senador-e-o-banqueiro,759c606ae7fded26f0275827cc97bf9c1unkbs01.html<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-relacao-flavio-vorcaro-2\" value=\"2\">BNews (a partir de Lauro Jardim, O Globo), \"Novas mensagens da PF revelam encontro reservado de Flávio Bolsonaro na casa de Vorcaro\", 11/10/2026. <a href=\"https://www.bnews.com.br/noticias/politica/novas-mensagens-da-pf-revelam-encontro-reservado-de-flavio-bolsonaro-na-casa-de-vorcaro-junto-com-ciro-nogueira-em-dia-decisivo-para-o-master.html\" target=\"_blank\" rel=\"noopener\">https://www.bnews.com.br/noticias/politica/novas-mensagens-da-pf-revelam-encontro-reservado-de-flavio-bolsonaro-na-casa-de-vorcaro-junto-com-ciro-nogueira-em-dia-decisivo-para-o-master.html<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-relacao-flavio-vorcaro-3\" value=\"3\">Aos Fatos, \"Flávio mentiu ao menos 43 vezes sobre elo com Vorcaro\", 24/09/2026. <a href=\"https://www.aosfatos.org/noticias/flavio-mentiu-ao-menos-43-vezes-sobre-envolvimento-com-vorcaro/\" target=\"_blank\" rel=\"noopener\">https://www.aosfatos.org/noticias/flavio-mentiu-ao-menos-43-vezes-sobre-envolvimento-com-vorcaro/<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-relacao-flavio-vorcaro-4\" value=\"4\">Itatiaia (CNN Brasil, a partir da piauí), \"Flávio Bolsonaro usou avião ligado a Daniel Vorcaro em 2025\", 24/09/2026. <a href=\"https://www.itatiaia.com.br/politica/flavio-bolsonaro-aviao-daniel-vorcaro-2025/\" target=\"_blank\" rel=\"noopener\">https://www.itatiaia.com.br/politica/flavio-bolsonaro-aviao-daniel-vorcaro-2025/<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-relacao-flavio-vorcaro-5\" value=\"5\">Poder360, \"Flávio Bolsonaro tem foto com Sicário, aliado de Vorcaro\", 15/07/2026. <a href=\"https://www.poder360.com.br/poder-eleicoes-2026/flavio-bolsonaro-tem-foto-com-sicario-aliado-de-vorcaro/\" target=\"_blank\" rel=\"noopener\">https://www.poder360.com.br/poder-eleicoes-2026/flavio-bolsonaro-tem-foto-com-sicario-aliado-de-vorcaro/<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-relacao-flavio-vorcaro-6\" value=\"6\">SBT News, \"Plataforma diz que foto de Flávio e 'Sicário' não usou IA\", 17/07/2026. <a href=\"https://sbtnews.sbt.com.br/noticia/politica/plataforma-diz-que-foto-de-flavio-e-sicario-nao-usou-ia\" target=\"_blank\" rel=\"noopener\">https://sbtnews.sbt.com.br/noticia/politica/plataforma-diz-que-foto-de-flavio-e-sicario-nao-usou-ia<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-relacao-flavio-vorcaro-7\" value=\"7\">Brasil de Fato (a partir do ICL Notícias), \"Flávio Bolsonaro atuou por regra que favorecia setor onde Master investia\", 30/07/2026. <a href=\"https://www.brasildefato.com.br/2026/07/30/flavio-bolsonaro-atuou-por-regra-que-favorecia-setor-onde-master-investia/\" target=\"_blank\" rel=\"noopener\">https://www.brasildefato.com.br/2026/07/30/flavio-bolsonaro-atuou-por-regra-que-favorecia-setor-onde-master-investia/<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-relacao-flavio-vorcaro-8\" value=\"8\">Jornal do Brasil, \"Flávio Bolsonaro não assinou três das cinco CPIs sobre o Master que poderia apoiar\", 05/2026. <a href=\"https://www.jb.com.br/brasil/politica/2026/05/1059703-flavio-bolsonaro-nao-assinou-tres-das-cinco-cpis-sobre-o-master-que-poderia-apoiar.html\" target=\"_blank\" rel=\"noopener\">https://www.jb.com.br/brasil/politica/2026/05/1059703-flavio-bolsonaro-nao-assinou-tres-das-cinco-cpis-sobre-o-master-que-poderia-apoiar.html<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-relacao-flavio-vorcaro-9\" value=\"9\">Brasil de Fato, \"PF é acionada por suspeita de trama entre Vorcaro e aliados de Flávio Bolsonaro na eleição\", 09/10/2026. <a href=\"https://www.brasildefato.com.br/2026/10/09/pf-e-acionada-por-suspeita-de-trama-entre-vorcaro-e-aliados-de-flavio-bolsonaro-na-eleicao/\" target=\"_blank\" rel=\"noopener\">https://www.brasildefato.com.br/2026/10/09/pf-e-acionada-por-suspeita-de-trama-entre-vorcaro-e-aliados-de-flavio-bolsonaro-na-eleicao/<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-relacao-flavio-vorcaro-10\" value=\"10\">Gazeta do Povo, \"Justiça manda remover postagem que ligava Flávio Bolsonaro a escândalo do Master\", 06/03/2026. <a href=\"https://www.gazetadopovo.com.br/republica/justica-manda-remover-postagem-que-ligava-flavio-bolsonaro-a-escandalo-do-master/\" target=\"_blank\" rel=\"noopener\">https://www.gazetadopovo.com.br/republica/justica-manda-remover-postagem-que-ligava-flavio-bolsonaro-a-escandalo-do-master/<\/a> (acesso em 17/10/2026)<\/li><\/ol><\/section><section class=\"hist\"><h3>Histórico<\/h3><ul><li>17/10/2026: verbete criado.<\/li><\/ul><\/section>", "texto": "Encontros e mensagens Mensagens do celular de Daniel Vorcaro, extraídas pela PF e reveladas pelo Estadão, mencionam seis encontros entre ele e Flávio Bolsonaro. Nem todos têm confirmação de que aconteceram. As conversas disponíveis vão de 20/08 a 16/11/2025, porque Flávio tinha ativado a exclusão automática do histórico a cada três meses. Em 20/08/2025, Flávio foi à casa de Vorcaro, em Brasília, com o senador Ciro Nogueira (PP). Foi o mesmo dia em que o governador do DF, Ibaneis Rocha, sancionou a aprovação da compra do Master pelo BRB. O presidente da Câmara, Hugo Motta, foi convidado; sua assessoria não confirmou nem negou a presença. Flávio e Ciro não comentaram o encontro na reportagem. Depois que o Banco Central reprovou a compra pelo BRB, Vorcaro pediu um novo encontro, e Flávio confirmou. Nas mensagens, Flávio também se oferece para falar com o irmão Eduardo quando Vorcaro tentava vender o banco a investidores em Dubai. Eduardo nega contato com Vorcaro. Em 16/11/2025, véspera da prisão de Vorcaro, Flávio escreveu que estaria \"contigo sempre\", segundo o Aos Fatos. O avião Em janeiro de 2025, Flávio voou com a família de Fort Lauderdale (EUA) a Brasília num Legacy 650 em que Vorcaro tinha um terço das cotas, por meio da empresa Prime You. Outro cotista, o advogado Willer Tomaz, diz que oferecia \"caronas\" a amigos e não respondeu se Flávio era seu convidado. É o mesmo avião que levou Alexandre de Moraes em 2024 e que Flávio citou para atacar o ministro. Flávio não respondeu à reportagem. A foto com \"Sicário\" Em 15/07/2026, o ICL publicou foto de Flávio ao lado de Luiz Philipi Mourão, o \"Sicário\", apontado pela PF como chefe do núcleo de intimidação de Vorcaro, morto sob custódia em março. Não se sabe quando nem onde a foto foi tirada. Flávio : primeiro disse não se lembrar do homem e que tira muitas fotos com desconhecidos; depois afirmou que a imagem foi feita com IA. A plataforma SignaIP e cinco ferramentas usadas pela jornalista não encontraram sinal de IA. Atuação no Senado Flávio votou a favor de um artigo da lei de licenciamento ambiental que limita a responsabilidade de bancos por danos de projetos que financiam, e votou pela derrubada do veto de Lula a esse artigo, em novembro de 2025. O Master investia em mineração e créditos de carbono no período. A própria reportagem diz não haver prova de que a atuação tenha beneficiado o banco ou sido pedida por Vorcaro, e a regra vale para todo o sistema financeiro. Flávio disse ao menos quatro vezes que defende a CPI do Master, mas assinou dois dos cinco pedidos de CPI que poderia apoiar. O que Flávio disse ao longo do tempo O Aos Fatos reuniu 43 declarações enganosas de Flávio sobre o caso, de fevereiro a setembro de 2026. Em março, negou conhecer Vorcaro; em maio, chamou de \"mentira\" o áudio revelado pelo Intercept e, no mesmo dia, admitiu as mensagens em vídeo, dizendo que buscava investimento para o filme do pai. Disse também que não havia acusação contra Vorcaro na época, embora a piauí já tivesse noticiado problemas de liquidez do banco em abril de 2025. Flávio não respondeu ao Aos Fatos. O que circula sem prova Em 08/10/2026, advogados do grupo Prerrogativas pediram à PF que apure uma possível articulação entre Vorcaro e aliados de Flávio para interferir no 2º turno, a partir de relatos de um suposto depoimento gravado em HD. Os próprios autores dizem não ter tido acesso à gravação. Em março de 2026, a Justiça do DF mandou remover publicações com uma imagem feita por IA que mostrava Flávio num encontro com Vorcaro que não aconteceu. A decisão é liminar. O que está comprovado Que Flávio e Vorcaro mantinham contato direto e frequente em 2025, e que Flávio pediu e cobrou dinheiro do banqueiro para o filme. Ver dark-horse. Que Flávio tenha agido em favor do Master ou sabia da origem ilícita dos recursos. É o que o inquérito no STF apura. Fontes 1. Terra (a partir do Estadão), \"Mensagens trocadas entre Flávio Bolsonaro e Vorcaro mencionam seis encontros\", 24/09/2026. (acesso em 17/10/2026) 2. BNews (a partir de Lauro Jardim, O Globo), \"Novas mensagens da PF revelam encontro reservado de Flávio Bolsonaro na casa de Vorcaro\", 11/10/2026. (acesso em 17/10/2026) 3. Aos Fatos, \"Flávio mentiu ao menos 43 vezes sobre elo com Vorcaro\", 24/09/2026. (acesso em 17/10/2026) 4. Itatiaia (CNN Brasil, a partir da piauí), \"Flávio Bolsonaro usou avião ligado a Daniel Vorcaro em 2025\", 24/09/2026. (acesso em 17/10/2026) 5. Poder360, \"Flávio Bolsonaro tem foto com Sicário, aliado de Vorcaro\", 15/07/2026. (acesso em 17/10/2026) 6. SBT News, \"Plataforma diz que foto de Flávio e 'Sicário' não usou IA\", 17/07/2026. (acesso em 17/10/2026) 7. Brasil de Fato (a partir do ICL Notícias), \"Flávio Bolsonaro atuou por regra que favorecia setor onde Master investia\", 30/07/2026. (acesso em 17/10/2026) 8. Jornal do Brasil, \"Flávio Bolsonaro não assinou três das cinco CPIs sobre o Master que poderia apoiar\", 05/2026. (acesso em 17/10/2026) 9. Brasil de Fato, \"PF é acionada por suspeita de trama entre Vorcaro e aliados de Flávio Bolsonaro na eleição\", 09/10/2026. (acesso em 17/10/2026) 10. Gazeta do Povo, \"Justiça manda remover postagem que ligava Flávio Bolsonaro a escândalo do Master\", 06/03/2026. (acesso em 17/10/2026) Histórico - 17/10/2026: verbete criado."}, {"id": "repercussao-internacional", "titulo": "Repercussão internacional", "tipo": "tema", "temas": ["meta", "eua"], "apelidos": ["imprensa internacional", "mídia estrangeira", "AP", "New York Times", "AFP", "Bloomberg", "Washington Post", "Guardian", "Tech Policy Press", "Rio Times"], "data": null, "status": "documentado", "resumo": "Como a imprensa estrangeira cobre a eleição. O caso Meta chegou às agências e aos grandes jornais, contado como acusação da campanha de Lula com negativa da empresa. A cobertura econômica trata Flávio como favorito.", "revisado": "2026-10-17", "html": "<section><h3>O caso Meta<\/h3><ul><li><span class=\"st st-comprovado\">Comprovado<\/span> <strong>AP<\/strong> (15/10): reportagem distribuída a jornais americanos sobre a ação da campanha de <a class=\"ref\" href=\"#lula\" data-id=\"lula\">Lula<\/a> no <a class=\"ref\" href=\"#tse\" data-id=\"tse\">TSE<\/a> contra a <a class=\"ref\" href=\"#meta\" data-id=\"meta\">Meta<\/a>: algoritmo enviesado, alcance reduzido e a <a class=\"ref\" href=\"#meta-ai-lula13\" data-id=\"meta-ai-lula13\">IA do WhatsApp<\/a>. Lembra que Flávio é aliado de Trump. As fontes do texto são os advogados da campanha e a posição da Meta; não há especialista independente.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/li><li><span class=\"st st-documentado\">Documentado<\/span> <strong>New York Times<\/strong>: noticiou a queixa ao tribunal e a \"indignação pública\" com o chatbot que recusou \"Lula 13\" e gerou \"Flávio 22\", segundo resumo do Latin America Daily Briefing.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/li><li><span class=\"st st-documentado\">Documentado<\/span> <strong>AFP<\/strong>: destacou a queixa que o PT prepara na OEA e a resposta da Meta Brasil, que chamou as acusações de \"simply false\".<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"6\">6<\/a><\/sup><\/li><li><span class=\"st st-comprovado\">Comprovado<\/span> <strong>Tech Policy Press<\/strong> (15/10): artigo crítico à Meta, que fala em indícios de censura e \"discriminação algorítmica\" contra apoiadores de Lula e cita mais de 1.100 relatos reunidos pela ONG CTRL+Z, mais de 90% de perfis pró-Lula. A autora, Tatiana Dias, dirige a CTRL+Z. O texto registra que a Meta contesta a metodologia, dizendo que a amostra foi selecionada de forma deliberada.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><\/li><li><span class=\"st st-comprovado\">Comprovado<\/span> <strong>AP<\/strong> (16/10): \"Lula vence contestação contra a Meta na Justiça Eleitoral por suposto viés algorítmico pró-Bolsonaro\", reproduzida por NBC News, CTV, Gulf News e outros. O título destaca a vitória da campanha; a decisão, porém, afirma não haver prova de manipulação deliberada. Ver <a class=\"ref\" href=\"#meta-interferencia\" data-id=\"meta-interferencia\">Acusação de interferência da Meta<\/a>.<sup class=\"fn\"><a href=\"#\" data-fonte=\"9\">9<\/a><\/sup><\/li><li><span class=\"st st-documentado\">Documentado<\/span> <strong>The Rio Times<\/strong>: informou que o Ministério Público Federal deu cinco dias para a Meta e o X explicarem contas bloqueadas e posts políticos apagados.<sup class=\"fn\"><a href=\"#\" data-fonte=\"7\">7<\/a><\/sup><\/li><\/ul><\/section><section><h3>A eleição em geral<\/h3><ul><li><span class=\"st st-comprovado\">Comprovado<\/span> <strong>Bloomberg<\/strong>: cobertura centrada em mercado e pesquisas, com títulos como \"Bolsonaro empurra Lula à beira da derrota\" (04/10) e \"Bolsonaro mantém vantagem estreita\" (14/10), além de textos sobre economistas cortando apostas de queda de juros com Flávio na frente e sobre a guinada à direita na América do Sul \"chegando ao Brasil\".<sup class=\"fn\"><a href=\"#\" data-fonte=\"5\">5<\/a><\/sup><\/li><li><span class=\"st st-comprovado\">Comprovado<\/span> <strong>Washington Post<\/strong> (05/10): \"Trump ficou em silêncio na eleição do Brasil. Isso pode ter ajudado seu aliado.\"<sup class=\"fn\"><a href=\"#\" data-fonte=\"4\">4<\/a><\/sup><\/li><li><span class=\"st st-comprovado\">Comprovado<\/span> <strong>Imprensa francesa e Euronews<\/strong>: enquadramento de \"surpresa\" com a liderança de Flávio no 1º turno. Um analista ouvido pelo Public Sénat o considera um candidato \"relativamente fraco\".<sup class=\"fn\"><a href=\"#\" data-fonte=\"8\">8<\/a><\/sup><\/li><li><span class=\"st st-documentado\">Documentado<\/span> <strong>Guardian<\/strong>: noticiou a aprovação da jornada de 40 horas no Senado. Ver <a class=\"ref\" href=\"#pec-6x1\" data-id=\"pec-6x1\">Fim da escala 6x1 aprovado no Senado<\/a>.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/li><\/ul><\/section><section><h3>Semana de 14 a 17/10<\/h3><ul><li><span class=\"st st-comprovado\">Comprovado<\/span> <strong>Al Jazeera, com Reuters e AP<\/strong> (16/10): repercutiu as mensagens internas da Meta reveladas pela Folha e a negativa da empresa à Reuters. Ver <a class=\"ref\" href=\"#meta-interferencia\" data-id=\"meta-interferencia\">Acusação de interferência da Meta<\/a>.<sup class=\"fn\"><a href=\"#\" data-fonte=\"10\">10<\/a><\/sup><\/li><li><span class=\"st st-documentado\">Documentado<\/span> <strong>Departamento de Estado dos EUA<\/strong> (15/10): em resposta a carta do senador Bernie Sanders e de 30 deputados democratas, disse apoiar \"um processo eleitoral livre e justo\" e que trabalhará com \"o governo eleito\", sem se comprometer a reconhecer o resultado certificado pelo TSE. O relato é do The Rio Times, que não teve acesso ao texto completo da carta. Ver <a class=\"ref\" href=\"#trump\" data-id=\"trump\">Donald Trump<\/a>.<sup class=\"fn\"><a href=\"#\" data-fonte=\"11\">11<\/a><\/sup><\/li><li><span class=\"st st-comprovado\">Comprovado<\/span> <strong>Mother Jones<\/strong> (14/10): cobriu uma gala conservadora em Washington em que <a class=\"ref\" href=\"#eduardo-bolsonaro\" data-id=\"eduardo-bolsonaro\">Eduardo Bolsonaro<\/a> foi a principal atração e Javier Milei prometeu \"expulsar o ditador comunista do Brasil\". O blogueiro Allan dos Santos, considerado foragido pela Justiça brasileira, estava presente.<sup class=\"fn\"><a href=\"#\" data-fonte=\"12\">12<\/a><\/sup><\/li><li><span class=\"st st-comprovado\">Comprovado<\/span> <strong>Christian Science Monitor<\/strong> (17/10): perfil de Flávio como candidato \"moderado\" na imagem e de extrema direita na agenda; lembra a investigação sobre o <a class=\"ref\" href=\"#dark-horse\" data-id=\"dark-horse\">Dark Horse<\/a>.<sup class=\"fn\"><a href=\"#\" data-fonte=\"13\">13<\/a><\/sup><\/li><\/ul><\/section><section><h3>Observação de método<\/h3><p>Os textos de Bloomberg e Washington Post foram registrados pelos títulos, porque os sites bloqueiam leitura automática. Itens marcados como documentados vêm de resumos de terceiros e serão revistos quando houver acesso ao original.<\/p><\/section><section class=\"fontes\"><h3>Fontes<\/h3><ol><li id=\"f-repercussao-internacional-1\" value=\"1\">AP, via ClickOrlando, \"Brazil's Lula challenges Meta at electoral court for alleged algorithmic bias and AI restrictions\", 15/10/2026. <a href=\"https://www.clickorlando.com/business/2026/10/15/brazils-lula-challenges-meta-at-electoral-court-for-alleged-algorithmic-bias-and-ai-restrictions/\" target=\"_blank\" rel=\"noopener\">https://www.clickorlando.com/business/2026/10/15/brazils-lula-challenges-meta-at-electoral-court-for-alleged-algorithmic-bias-and-ai-restrictions/<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-repercussao-internacional-2\" value=\"2\">Latin America Daily Briefing, \"Lula accuses Meta of election interference\", 10/2026. <a href=\"https://latinamericadailybriefing.substack.com/p/lula-accuses-meta-of-election-interference\" target=\"_blank\" rel=\"noopener\">https://latinamericadailybriefing.substack.com/p/lula-accuses-meta-of-election-interference<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-repercussao-internacional-3\" value=\"3\">Tech Policy Press, \"Meta Moderation Failures Loom Over Brazil's Runoff Presidential Election\", 15/10/2026. <a href=\"https://www.techpolicy.press/meta-moderation-failures-loom-over-brazils-runoff-presidential-election/\" target=\"_blank\" rel=\"noopener\">https://www.techpolicy.press/meta-moderation-failures-loom-over-brazils-runoff-presidential-election/<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-repercussao-internacional-4\" value=\"4\">Washington Post, \"Trump kept silent in Brazil's election. It might have helped his ally.\", 05/10/2026. <a href=\"https://www.washingtonpost.com/world/2026/10/05/trump-kept-silent-brazils-election-it-might-have-helped-his-ally/\" target=\"_blank\" rel=\"noopener\">https://www.washingtonpost.com/world/2026/10/05/trump-kept-silent-brazils-election-it-might-have-helped-his-ally/<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-repercussao-internacional-5\" value=\"5\">Bloomberg, \"Bolsonaro Holds Narrow Lead Over Lula Ahead of Brazil Runoff\", 14/10/2026. <a href=\"https://www.bloomberg.com/news/articles/2026-10-14/bolsonaro-holds-narrow-lead-over-lula-ahead-of-brazil-runoff\" target=\"_blank\" rel=\"noopener\">https://www.bloomberg.com/news/articles/2026-10-14/bolsonaro-holds-narrow-lead-over-lula-ahead-of-brazil-runoff<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-repercussao-internacional-6\" value=\"6\">Malay Mail (AFP), \"Brazil's Lula accuses Meta of election interference\", 11/10/2026. <a href=\"https://www.malaymail.com/news/world/2026/10/11/brazils-lula-accuses-meta-of-election-interference/238627\" target=\"_blank\" rel=\"noopener\">https://www.malaymail.com/news/world/2026/10/11/brazils-lula-accuses-meta-of-election-interference/238627<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-repercussao-internacional-7\" value=\"7\">The Rio Times, \"Lula Campaign Says Meta AI Favours Flávio Bolsonaro\", 10/2026. <a href=\"https://www.riotimesonline.com/lula-campaign-meta-ai-favours-flavio-2026/\" target=\"_blank\" rel=\"noopener\">https://www.riotimesonline.com/lula-campaign-meta-ai-favours-flavio-2026/<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-repercussao-internacional-8\" value=\"8\">Public Sénat, \"Élection présidentielle au Brésil: Flavio Bolsonaro reste à mon sens un candidat relativement faible\", 10/2026. <a href=\"https://www.publicsenat.fr/actualites/international/election-presidentielle-au-bresil-flavio-bolsonaro-reste-a-mon-sens-un-candidat-relativement-faible\" target=\"_blank\" rel=\"noopener\">https://www.publicsenat.fr/actualites/international/election-presidentielle-au-bresil-flavio-bolsonaro-reste-a-mon-sens-un-candidat-relativement-faible<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-repercussao-internacional-9\" value=\"9\">NBC News (AP), \"Brazil's Lula wins electoral court challenge against Meta for alleged pro-Bolsonaro algorithm bias\", 16/10/2026. <a href=\"https://www.nbcnews.com/world/south-america/brazil-lula-wins-electoral-court-challenge-meta-alleged-bolsonaro-bias-rcna603835\" target=\"_blank\" rel=\"noopener\">https://www.nbcnews.com/world/south-america/brazil-lula-wins-electoral-court-challenge-meta-alleged-bolsonaro-bias-rcna603835<\/a> (acesso em 16/10/2026)<\/li><li id=\"f-repercussao-internacional-10\" value=\"10\">Al Jazeera (com Reuters e AP), \"Meta employees say Lula's accounts restricted in Brazil election: Report\", 16/10/2026. <a href=\"https://www.aljazeera.com/economy/2026/10/16/meta-employees-say-lulas-accounts-restricted-in-brazil-election-report\" target=\"_blank\" rel=\"noopener\">https://www.aljazeera.com/economy/2026/10/16/meta-employees-say-lulas-accounts-restricted-in-brazil-election-report<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-repercussao-internacional-11\" value=\"11\">The Rio Times, \"US Avoids Pledge to Accept Brazil Result\", 10/2026. <a href=\"https://www.riotimesonline.com/state-department-brazil-election-result-pledge-moraes-2026\" target=\"_blank\" rel=\"noopener\">https://www.riotimesonline.com/state-department-brazil-election-result-pledge-moraes-2026<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-repercussao-internacional-12\" value=\"12\">Mother Jones, \"MAGA World Is Counting on a Bolsonaro Win in Brazil\", 10/2026. <a href=\"https://motherjones.com/politics/2026/10/brazil-election-maga-bolsonaro-lula-milei-hispanic-heritage-gala\" target=\"_blank\" rel=\"noopener\">https://motherjones.com/politics/2026/10/brazil-election-maga-bolsonaro-lula-milei-hispanic-heritage-gala<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-repercussao-internacional-13\" value=\"13\">Christian Science Monitor, \"Like father, like son? Meet Brazil's 'moderate' Bolsonaro\", 17/10/2026. <a href=\"https://csmonitor.com/World/Americas/2026/1017/flavio-bolsonaro-brazil-lula-runoff\" target=\"_blank\" rel=\"noopener\">https://csmonitor.com/World/Americas/2026/1017/flavio-bolsonaro-brazil-lula-runoff<\/a> (acesso em 17/10/2026)<\/li><\/ol><\/section><section class=\"hist\"><h3>Histórico<\/h3><ul><li>15/10/2026: verbete criado.<\/li><li>16/10/2026: incluída a decisão do TSE de 15/10 sobre a Meta.<\/li><li>17/10/2026: atualizado com notícias de 16 e 17/10.<\/li><\/ul><\/section>", "texto": "O caso Meta - AP (15/10): reportagem distribuída a jornais americanos sobre a ação da campanha de Lula no TSE contra a Meta: algoritmo enviesado, alcance reduzido e a IA do WhatsApp. Lembra que Flávio é aliado de Trump. As fontes do texto são os advogados da campanha e a posição da Meta; não há especialista independente. - New York Times : noticiou a queixa ao tribunal e a \"indignação pública\" com o chatbot que recusou \"Lula 13\" e gerou \"Flávio 22\", segundo resumo do Latin America Daily Briefing. - AFP : destacou a queixa que o PT prepara na OEA e a resposta da Meta Brasil, que chamou as acusações de \"simply false\". - Tech Policy Press (15/10): artigo crítico à Meta, que fala em indícios de censura e \"discriminação algorítmica\" contra apoiadores de Lula e cita mais de 1.100 relatos reunidos pela ONG CTRL+Z, mais de 90% de perfis pró-Lula. A autora, Tatiana Dias, dirige a CTRL+Z. O texto registra que a Meta contesta a metodologia, dizendo que a amostra foi selecionada de forma deliberada. - AP (16/10): \"Lula vence contestação contra a Meta na Justiça Eleitoral por suposto viés algorítmico pró-Bolsonaro\", reproduzida por NBC News, CTV, Gulf News e outros. O título destaca a vitória da campanha; a decisão, porém, afirma não haver prova de manipulação deliberada. Ver meta-interferencia. - The Rio Times : informou que o Ministério Público Federal deu cinco dias para a Meta e o X explicarem contas bloqueadas e posts políticos apagados. A eleição em geral - Bloomberg : cobertura centrada em mercado e pesquisas, com títulos como \"Bolsonaro empurra Lula à beira da derrota\" (04/10) e \"Bolsonaro mantém vantagem estreita\" (14/10), além de textos sobre economistas cortando apostas de queda de juros com Flávio na frente e sobre a guinada à direita na América do Sul \"chegando ao Brasil\". - Washington Post (05/10): \"Trump ficou em silêncio na eleição do Brasil. Isso pode ter ajudado seu aliado.\" - Imprensa francesa e Euronews : enquadramento de \"surpresa\" com a liderança de Flávio no 1º turno. Um analista ouvido pelo Public Sénat o considera um candidato \"relativamente fraco\". - Guardian : noticiou a aprovação da jornada de 40 horas no Senado. Ver pec-6x1. Semana de 14 a 17/10 - Al Jazeera, com Reuters e AP (16/10): repercutiu as mensagens internas da Meta reveladas pela Folha e a negativa da empresa à Reuters. Ver meta-interferencia. - Departamento de Estado dos EUA (15/10): em resposta a carta do senador Bernie Sanders e de 30 deputados democratas, disse apoiar \"um processo eleitoral livre e justo\" e que trabalhará com \"o governo eleito\", sem se comprometer a reconhecer o resultado certificado pelo TSE. O relato é do The Rio Times, que não teve acesso ao texto completo da carta. Ver trump. - Mother Jones (14/10): cobriu uma gala conservadora em Washington em que Eduardo Bolsonaro foi a principal atração e Javier Milei prometeu \"expulsar o ditador comunista do Brasil\". O blogueiro Allan dos Santos, considerado foragido pela Justiça brasileira, estava presente. - Christian Science Monitor (17/10): perfil de Flávio como candidato \"moderado\" na imagem e de extrema direita na agenda; lembra a investigação sobre o Dark Horse. Observação de método Os textos de Bloomberg e Washington Post foram registrados pelos títulos, porque os sites bloqueiam leitura automática. Itens marcados como documentados vêm de resumos de terceiros e serão revistos quando houver acesso ao original. Fontes 1. AP, via ClickOrlando, \"Brazil's Lula challenges Meta at electoral court for alleged algorithmic bias and AI restrictions\", 15/10/2026. (acesso em 15/10/2026) 2. Latin America Daily Briefing, \"Lula accuses Meta of election interference\", 10/2026. (acesso em 15/10/2026) 3. Tech Policy Press, \"Meta Moderation Failures Loom Over Brazil's Runoff Presidential Election\", 15/10/2026. (acesso em 15/10/2026) 4. Washington Post, \"Trump kept silent in Brazil's election. It might have helped his ally.\", 05/10/2026. (acesso em 15/10/2026) 5. Bloomberg, \"Bolsonaro Holds Narrow Lead Over Lula Ahead of Brazil Runoff\", 14/10/2026. (acesso em 15/10/2026) 6. Malay Mail (AFP), \"Brazil's Lula accuses Meta of election interference\", 11/10/2026. (acesso em 15/10/2026) 7. The Rio Times, \"Lula Campaign Says Meta AI Favours Flávio Bolsonaro\", 10/2026. (acesso em 15/10/2026) 8. Public Sénat, \"Élection présidentielle au Brésil: Flavio Bolsonaro reste à mon sens un candidat relativement faible\", 10/2026. (acesso em 15/10/2026) 9. NBC News (AP), \"Brazil's Lula wins electoral court challenge against Meta for alleged pro-Bolsonaro algorithm bias\", 16/10/2026. (acesso em 16/10/2026) 10. Al Jazeera (com Reuters e AP), \"Meta employees say Lula's accounts restricted in Brazil election: Report\", 16/10/2026. (acesso em 17/10/2026) 11. The Rio   // deriva lenta de cada nó + leve afastamento perto do cursor; só no desenho, sem mexer na física
  let mouseNoMapa = false;

  function flutuar(escala) {
    if (!MOV) return;
    const t = performance.now();
    // velocidade do mouse desde o último quadro, em pixels de tela
    let vx = 0, vy = 0;
    if (mouseNoMapa && pmx !== null) { vx = mx - pmx; vy = my - pmy; }
    pmx = mouseNoMapa ? mx : null; pmy = mouseNoMapa ? my : null;
    const vel = Math.min(Math.hypot(vx, vy), 60);
    const m = mouseNoMapa ? G.screen2GraphCoords(mx, my) : null;
    const raio = 170 / escala;      // alcance da influência
    const empurra = 16 / escala;    // afastamento máximo perto do cursor
    const esteira = 0.05;           // quanto do movimento do mouse é arrastado junto
    const deriva = 1.8 / escala;    // oscilação ambiente

      if (n.x == null) return;
      let alvoX = Math.sin(t * 0.0003 + n.fase) * deriva;
      let alvoY = Math.cos(t * 0.00024 + n.fase * 1.7) * deriva;

    else if (e.key === 'Escape') { limparBusca(); q.blur(); }
  });
  lista.addEventListener('pointerdown', e => { const li = e.target.closest('li'); if (li) { e.preventDefault(); escolher(li.dataset.id); } });
  function escolher(id) { lista.hidden = true; q.setAttribute('aria-expanded', 'false'); st.busca = new Set([id]); abrir(id); }
  q.addEventListener('blur', () => setTimeout(() => { lista.hidden = true; }, 150));
  q.addEventListener('focus', () => { if (res.length) renderLista(); });

  // ---------- temas ----------
  const temasEl = $('#temas');
  temasEl.innerHTML = temasUsados.map(t => `<button class="chip" type="button" aria-pressed="false" data-t="${t}">${NOME_TEMA[t]}</button>`).join('');
  temasEl.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    st.tema = st.tema === b.dataset.t ? null : b.dataset.t;
    temasEl.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.t === st.tema)));
    if (st.tema) enquadrar(T, n => (n.temas || []).includes(st.tema));
    else enquadrar(T);
  });

  // ---------- legenda e status ----------
  $('#legenda').innerHTML = Object.keys(NOME_TIPO).filter(t => nos.some(n => n.tipo === t))
    .map(t => `<span><i style="background:${COR_TIPO[t]}"></i>${NOME_TIPO[t]}</span>`).join('') +
    `<span><i class="anel"></i>Acusação não comprovada</span>` +
    (nos.some(n => n.status === 'boato') ? `<span><i class="anel pt"></i>Boato</span>` : '') +
    `<span><i class="ln"></i>Comprovado ou documentado</span><span><i class="ln tr"></i>Alegação</span><span><i class="ln pt"></i>Boato</span>`;
  const filtrosEl = $('#filtrosSt');
  const stUsados = ['comprovado', 'documentado', 'alegacao', 'boato', 'desmentido', 'mencao'].filter(s => arestas.some(a => a.status === s) || nos.some(n => n.status === s && n.tipo === 'alegacao'));
  filtrosEl.innerHTML = stUsados.map(s => `<button class="chip" type="button" aria-pressed="true" data-s="${s}">${s === 'mencao' ? 'Menções' : NOME_ST[s]}</button>`).join('');
  filtrosEl.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    const s = b.dataset.s;
    if (st.statusOn.has(s)) st.statusOn.delete(s); else st.statusOn.add(s);
    b.setAttribute('aria-pressed', String(st.statusOn.has(s)));
    G.nodeVisibility(visivelNo).linkVisibility(visivelAresta);
  });

  // ---------- régua do tempo ----------
  const tempo = $('#tempo');
  tempo.max = DIAS; tempo.value = DIAS;
  const marcas = $('#marcas');
  marcas.innerHTML = nos.filter(n => n.data).map(n => {
    const d = Math.round((new Date(n.data + 'T12:00:00') - dMin) / 864e5);
    return `<b title="${esc(fmt(n.data) + ' · ' + n.titulo)}" style="left:${(d / DIAS) * 100}%;background:${COR_TIPO[n.tipo]}"></b>`;
  }).join('');
  function atualizarTempo() {
    st.ate = isoDe(+tempo.value);
    $('#dataAtual').textContent = fmt(st.ate);
    G.nodeVisibility(visivelNo).linkVisibility(visivelAresta);
  }
  tempo.addEventListener('input', atualizarTempo);
  let tocando = null;
  $('#play').addEventListener('click', () => {
    if (tocando) { cancelAnimationFrame(tocando); tocando = null; return; }
    let v = 0, t0 = null; const dur = 14000;
    const passo = ts => {
      if (!t0) t0 = ts;
      v = Math.min(DIAS, Math.round(((ts - t0) / dur) * DIAS));
      tempo.value = v; atualizarTempo();
      if (v < DIAS) tocando = requestAnimationFrame(passo); else tocando = null;
    };
    tocando = requestAnimationFrame(passo);
  });
  atualizarTempo();

  // ---------- início ----------
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => G.nodeCanvasObject(desenharNo));
  const inicial = location.hash.slice(1);
  if (porId[inicial]) setTimeout(() => abrir(inicial), 900);
})();
</script>

</html>
