": ["eua"], "apelidos": ["tarifaço", "tarifa de 50%", "Magnitsky", "Seção 301", "sanções dos EUA"], "data": "2025-07-09", "status": "comprovado", "resumo": "Em julho de 2025, Trump anunciou tarifa de 50% sobre produtos brasileiros, citando o julgamento de Bolsonaro e decisões do STF sobre plataformas. Vieram depois sanções a Moraes, retiradas em dezembro.", "revisado": "2026-10-14", "html": "<section><h3>O que aconteceu<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Em 09/07/2025, <a class=\"ref\" href=\"#trump\" data-id=\"trump\">Donald Trump<\/a> anunciou tarifa de 50% sobre produtos brasileiros. A carta ao governo brasileiro citava o processo contra <a class=\"ref\" href=\"#jair-bolsonaro\" data-id=\"jair-bolsonaro\">Jair Bolsonaro<\/a> e ordens do STF a plataformas americanas.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> No mesmo mês, o governo americano abriu uma investigação comercial (Seção 301) contra o Brasil, citando \"ataques\" a empresas americanas de redes sociais, entre outros pontos como o Pix.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> <a class=\"ref\" href=\"#moraes\" data-id=\"moraes\">Alexandre de Moraes<\/a> foi sancionado com base na Lei Magnitsky. Os EUA retiraram a sanção em dezembro de 2025.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><\/section><section><h3>Desdobramento<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Em 2026, o STF condenou <a class=\"ref\" href=\"#eduardo-bolsonaro\" data-id=\"eduardo-bolsonaro\">Eduardo Bolsonaro<\/a> por coação no curso do processo, entendendo que ele articulou as medidas para tentar impedir a condenação do pai.<sup class=\"fn\"><a href=\"#\" data-fonte=\"4\">4<\/a><\/sup><\/p><\/section><section class=\"fontes\"><h3>Fontes<\/h3><ol><li id=\"f-tarifaco-2025-1\" value=\"1\">Poder360, \"Trump anuncia tarifa de 50% para produtos do Brasil\", 09/07/2025. <a href=\"https://www.poder360.com.br/poder-internacional/trump-anuncia-tarifa-de-50-para-produtos-do-brasil/\" target=\"_blank\" rel=\"noopener\">https://www.poder360.com.br/poder-internacional/trump-anuncia-tarifa-de-50-para-produtos-do-brasil/<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-tarifaco-2025-2\" value=\"2\">Band, \"EUA retiram Alexandre de Moraes e a esposa da lista da Lei Magnitsky\", 12/12/2025. <a href=\"https://www.band.com.br/noticias/eua-retiram-alexandre-de-moraes-e-a-esposa-da-lista-da-lei-magnitsky-202512121448\" target=\"_blank\" rel=\"noopener\">https://www.band.com.br/noticias/eua-retiram-alexandre-de-moraes-e-a-esposa-da-lista-da-lei-magnitsky-202512121448<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-tarifaco-2025-3\" value=\"3\">Outras Palavras, \"Como Trump sabota a soberania digital brasileira\", 2026. <a href=\"https://outraspalavras.net/tecnologiaemdisputa/como-trump-sabota-a-soberania-digital-brasileira/\" target=\"_blank\" rel=\"noopener\">https://outraspalavras.net/tecnologiaemdisputa/como-trump-sabota-a-soberania-digital-brasileira/<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-tarifaco-2025-4\" value=\"4\">Jornal do Brasil, \"Moraes decreta prisão de Eduardo Bolsonaro após condenação no STF\", 10/2026. <a href=\"https://www.jb.com.br/brasil/justica/2026/10/1061164-moraes-decreta-prisao-de-eduardo-bolsonaro-apos-condenacao-no-stf.html\" target=\"_blank\" rel=\"noopener\">https://www.jb.com.br/brasil/justica/2026/10/1061164-moraes-decreta-prisao-de-eduardo-bolsonaro-apos-condenacao-no-stf.html<\/a> (acesso em 14/10/2026)<\/li><\/ol><\/section><section class=\"hist\"><h3>Histórico<\/h3><ul><li>14/10/2026: verbete criado.<\/li><\/ul><\/section>", "texto": "O que aconteceu Em 09/07/2025, Donald Trump anunciou tarifa de 50% sobre produtos brasileiros. A carta ao governo brasileiro citava o processo contra Jair Bolsonaro e ordens do STF a plataformas americanas. No mesmo mês, o governo americano abriu uma investigação comercial (Seção 301) contra o Brasil, citando \"ataques\" a empresas americanas de redes sociais, entre outros pontos como o Pix. Alexandre de Moraes foi sancionado com base na Lei Magnitsky. Os EUA retiraram a sanção em dezembro de 2025. Desdobramento Em 2026, o STF condenou Eduardo Bolsonaro por coação no curso do processo, entendendo que ele articulou as medidas para tentar impedir a condenação do pai. Fontes 1. Poder360, \"Trump anuncia tarifa de 50% para produtos do Brasil\", 09/07/2025. (acesso em 14/10/2026) 2. Band, \"EUA retiram Alexandre de Moraes e a esposa da lista da Lei Magnitsky\", 12/12/2025. (acesso em 14/10/2026) 3. Outras Palavras, \"Como Trump sabota a soberania digital brasileira\", 2026. (acesso em 14/10/2026) 4. Jornal do Brasil, \"Moraes decreta prisão de Eduardo Bolsonaro após condenação no STF\", 10/2026. (acesso em 14/10/2026) Histórico - 14/10/2026: verbete criado."}, {"id": "vorcaro-metropoles", "titulo": "Vorcaro e as reportagens do Metrópoles", "tipo": "evento", "temas": ["master"], "apelidos": ["Metrópoles", "Lilian Tahan", "Luiz Estevão", "contrato de R$ 20 milhões", "imprensa"], "data": "2026-10-15", "status": "documentado", "resumo": "Mensagens do celular de Vorcaro, analisadas pela PF e reveladas pelo UOL, indicam que o banqueiro recebia reportagens do Metrópoles antes da publicação e pedia mudanças, aceitas em vários casos. O Master pagou R$ 20 milhões ao portal em contrato publicitário. O Metrópoles nega vínculo editorial.", "revisado": "2026-10-16", "html": "<section><h3>O que se revelou<\/h3><p><span class=\"st st-documentado\">Documentado<\/span> Segundo reportagem do UOL de 15/10/2026, baseada em dados periciais da PF no celular de <a class=\"ref\" href=\"#vorcaro\" data-id=\"vorcaro\">Daniel Vorcaro<\/a>, ao menos 14 reportagens do Metrópoles foram enviadas a ele antes da publicação, entre 2024 e 2025. Onze foram modificadas e duas foram produzidas a pedido dele.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> Entre os pedidos atribuídos a Vorcaro estão a retirada da menção a uma suposta oferta de R$ 1 pelos ativos do Master, a remoção de citações ao diretor do Banco Central Renato Gomes e uma \"freada\" na cobertura do pré-candidato Ricardo Cappelli. Nas mensagens, a diretora do portal, Lilian Tahan, responde \"Tiramos\" e \"Deixa comigo\".<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> O Master pagou R$ 1 milhão em junho e R$ 900 mil em julho de 2024 ao grupo, como projetos de educação financeira, e depois fechou um contrato de R$ 20 milhões, quitado em 2025 em quatro parcelas.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> Segundo o Terra, Vorcaro autorizou ao todo cerca de R$ 51,9 milhões em pagamentos ao Metrópoles em 2024 e 2025, incluindo um projeto de R$ 25 milhões e uma proposta de patrocínio de R$ 6 milhões. O Coaf apontou como suspeitos R$ 27,2 milhões pagos diretamente pelo Master, por terem sido repassados de imediato a empresas ligadas à família de Luiz Estevão. Nas mensagens, Vorcaro tratava os pagamentos como prioridade.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><\/p><\/section><section><h3>Quem diz o quê<\/h3><p><strong>Metrópoles<\/strong>: não comentou a reportagem do Terra sobre os R$ 52 milhões.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><\/p><p><strong>Metrópoles (Lilian Tahan, ao UOL)<\/strong>: disse que conferir com a fonte se o texto reflete o contexto da entrevista é prática comum, que o contrato publicitário não tinha vínculo editorial e que o portal cobriu as dificuldades financeiras das empresas de Vorcaro. Sobre Cappelli, disse que o dono do portal, Luiz Estevão, era crítico da operação.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><\/section><section><h3>Contexto<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Foi o Metrópoles que revelou, em janeiro de 2026, o encontro de <a class=\"ref\" href=\"#lula\" data-id=\"lula\">Lula<\/a> com Vorcaro no Planalto em dezembro de 2024, depois confirmado pela CNN.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><\/section><section class=\"fontes\"><h3>Fontes<\/h3><ol><li id=\"f-vorcaro-metropoles-1\" value=\"1\">Brasil de Fato, \"Mensagens apontam que Vorcaro aprovava e alterava reportagens do site Metrópoles antes de publicação\" (reproduz reportagem do UOL), 15/10/2026. <a href=\"https://www.brasildefato.com.br/2026/10/15/mensagens-apontam-que-vorcaro-aprovava-e-alterava-reportagens-do-site-metropoles-antes-de-publicacao/\" target=\"_blank\" rel=\"noopener\">https://www.brasildefato.com.br/2026/10/15/mensagens-apontam-que-vorcaro-aprovava-e-alterava-reportagens-do-site-metropoles-antes-de-publicacao/<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-vorcaro-metropoles-2\" value=\"2\">Portal de Prefeitura, \"Lula teve encontro fora da agenda no Planalto com Vorcaro\", 26/01/2026. <a href=\"https://portaldeprefeitura.com.br/bastidores-da-politica/lula-teve-encontro-fora-da-agenda-no-planalto-com-vorcaro/613758/\" target=\"_blank\" rel=\"noopener\">https://portaldeprefeitura.com.br/bastidores-da-politica/lula-teve-encontro-fora-da-agenda-no-planalto-com-vorcaro/613758/<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-vorcaro-metropoles-3\" value=\"3\">Terra, \"Metrópoles negociou R$ 52 milhões com Vorcaro, que tratou pagamentos como 'coisa mais importante'\", 10/2026. <a href=\"https://www.terra.com.br/noticias/brasil/politica/metropoles-negociou-r-52-milhoes-com-vorcaro-que-tratou-pagamentos-como-coisa-mais-importante,c0c2d88da9aa355f09ba1cf7c636a5417c8s959f.html\" target=\"_blank\" rel=\"noopener\">https://www.terra.com.br/noticias/brasil/politica/metropoles-negociou-r-52-milhoes-com-vorcaro-que-tratou-pagamentos-como-coisa-mais-importante,c0c2d88da9aa355f09ba1cf7c636a5417c8s959f.html<\/a> (acesso em 16/10/2026)<\/li><\/ol><\/section><section class=\"hist\"><h3>Histórico<\/h3><ul><li>15/10/2026: verbete criado.<\/li><li>16/10/2026: incluídos os valores totais e o alerta do Coaf.<\/li><\/ul><\/section>", "texto": "O que se revelou Segundo reportagem do UOL de 15/10/2026, baseada em dados periciais da PF no celular de Daniel Vorcaro, ao menos 14 reportagens do Metrópoles foram enviadas a ele antes da publicação, entre 2024 e 2025. Onze foram modificadas e duas foram produzidas a pedido dele. Entre os pedidos atribuídos a Vorcaro estão a retirada da menção a uma suposta oferta de R$ 1 pelos ativos do Master, a remoção de citações ao diretor do Banco Central Renato Gomes e uma \"freada\" na cobertura do pré-candidato Ricardo Cappelli. Nas mensagens, a diretora do portal, Lilian Tahan, responde \"Tiramos\" e \"Deixa comigo\". O Master pagou R$ 1 milhão em junho e R$ 900 mil em julho de 2024 ao grupo, como projetos de educação financeira, e depois fechou um contrato de R$ 20 milhões, quitado em 2025 em quatro parcelas. Segundo o Terra, Vorcaro autorizou ao todo cerca de R$ 51,9 milhões em pagamentos ao Metrópoles em 2024 e 2025, incluindo um projeto de R$ 25 milhões e uma proposta de patrocínio de R$ 6 milhões. O Coaf apontou como suspeitos R$ 27,2 milhões pagos diretamente pelo Master, por terem sido repassados de imediato a empresas ligadas à família de Luiz Estevão. Nas mensagens, Vorcaro tratava os pagamentos como prioridade. Quem diz o quê Metrópoles : não comentou a reportagem do Terra sobre os R$ 52 milhões. Metrópoles (Lilian Tahan, ao UOL) : disse que conferir com a fonte se o texto reflete o contexto da entrevista é prática comum, que o contrato publicitário não tinha vínculo editorial e que o portal cobriu as dificuldades financeiras das empresas de Vorcaro. Sobre Cappelli, disse que o dono do portal, Luiz Estevão, era crítico da operação. Contexto Foi o Metrópoles que revelou, em janeiro de 2026, o encontro de Lula com Vorcaro no Planalto em dezembro de 2024, depois confirmado pela CNN. Fontes 1. Brasil de Fato, \"Mensagens apontam que Vorcaro aprovava e alterava reportagens do site Metrópoles antes de publicação\" (reproduz reportagem do UOL), 15/10/2026. (acesso em 15/10/2026) 2. Portal de Prefeitura, \"Lula teve encontro fora da agenda no Planalto com Vorcaro\", 26/01/2026. (acesso em 15/10/2026) 3. Terra, \"Metrópoles negociou R$ 52 milhões com Vorcaro, que tratou pagamentos como 'coisa mais importante'\", 10/2026. (acesso em 16/10/2026) Histórico - 15/10/2026: verbete criado. - 16/10/2026: incluídos os valores totais e o alerta do Coaf."}, {"id": "globo", "titulo": "Grupo Globo", "tipo": "instituicao", "temas": ["master", "campanhas"], "apelidos": ["Globo", "TV Globo", "Jornal Nacional", "JN", "O Globo", "Valor", "Frederic Kachar", "Kachar", "Marinho", "Huck", "Will Bank", "Domingão"], "data": null, "status": "comprovado", "resumo": "Maior grupo de mídia do país. Em 15/10/2026 demitiu o diretor-geral Frederic Kachar depois de mensagens com Vorcaro sobre cobertura, patrocínios e pautas. O Master e o Will Bank foram anunciantes do grupo.", "revisado": "2026-10-16", "html": "<section><h3>O que é<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Maior grupo de comunicação do Brasil, controlado pela família Marinho. Dono da TV Globo, de O Globo, do Valor Econômico e da Editora Globo.<\/p><\/section><section><h3>Mensagens com Vorcaro<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Em 15/10/2026, o grupo demitiu Frederic Kachar, diretor-geral da Editora Globo, da Infoglobo e da Globo Condé Nast, há 29 anos na empresa. Em nota, a Globo disse que as mensagens revelam \"uma relação inadequada do executivo com um anunciante\" e reafirmou a independência editorial.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> Segundo mensagens do celular de <a class=\"ref\" href=\"#vorcaro\" data-id=\"vorcaro\">Daniel Vorcaro<\/a>, apreendido pela PF, trocadas entre outubro de 2023 e julho de 2025:<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><ul><li>Kachar enviou a Vorcaro uma reportagem do Valor sobre o Master e pediu a opinião dele.<\/li><li>Diante de uma reclamação de Vorcaro sobre a colunista Malu Gaspar, Kachar disse que tentava conversar com ela.<\/li><li>Kachar disse que o contato com o colunista Lauro Jardim criou uma \"linha direta\" e que ele \"virou até fonte\".<\/li><li>Kachar foi a uma festa privada de Vorcaro em maio de 2024.<\/li><li>O Master foi o principal patrocinador de um evento do Valor em Nova York em 2024.<\/li><\/ul><p><span class=\"st st-documentado\">Documentado<\/span> Em outubro de 2024, Kachar comentou com Vorcaro a suspeita de que uma reportagem da piauí contra o banco teria sido encomendada pelo Itaú. Kachar não afirmou saber disso; a suspeita era de Vorcaro, e não há documento que a comprove.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><\/p><\/section><section><h3>Patrocínios<\/h3><p><span class=\"st st-documentado\">Documentado<\/span> O Will Bank, do grupo Master, patrocinou o Domingão com Huck a partir de 2025. Segundo o Poder360, citado pelo Brasil 247, os investimentos de mídia na TV Globo ligados a esse contrato somaram R$ 83 milhões. As mensagens entre Kachar e Vorcaro citam encontros com \"Roberto\", que o Brasil 247 associa a Roberto Marinho Neto; o sobrenome não aparece. A assessoria de Huck diz que a relação com Vorcaro se limitou ao patrocínio, com notas fiscais e impostos recolhidos.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><\/section><section><h3>Na eleição<\/h3><p><span class=\"st st-documentado\">Documentado<\/span> Recebeu <a class=\"ref\" href=\"#flavio-bolsonaro\" data-id=\"flavio-bolsonaro\">Flávio Bolsonaro<\/a> para um almoço reservado com a cúpula da emissora no dia da sabatina dele no Jornal Nacional. Ver <a class=\"ref\" href=\"#almoco-flavio-globo\" data-id=\"almoco-flavio-globo\">Almoço de Flávio com a cúpula da Globo<\/a>.<\/p><\/section><section><h3>Quem diz o quê<\/h3><p><strong>Grupo Globo<\/strong>: \"relação inadequada do executivo com um anunciante\"; reafirma independência editorial.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><strong>Frederic Kachar<\/strong>: não respondeu às reportagens até 15/10/2026.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><\/section><section class=\"fontes\"><h3>Fontes<\/h3><ol><li id=\"f-globo-1\" value=\"1\">Gazeta do Povo, \"Como diretor demitido da Globo tratou de reportagens com Vorcaro\", 15/10/2026. <a href=\"https://www.gazetadopovo.com.br/republica/diretor-demitido-da-globo-tratou-de-reportagens-com-vorcaro/\" target=\"_blank\" rel=\"noopener\">https://www.gazetadopovo.com.br/republica/diretor-demitido-da-globo-tratou-de-reportagens-com-vorcaro/<\/a> (acesso em 16/10/2026)<\/li><li id=\"f-globo-2\" value=\"2\">Brasil 247, \"Mensagens ligam ex-CEO da Globo à aproximação de Vorcaro e Huck\", 15/10/2026. <a href=\"https://www.brasil247.com/midia/mensagens-ligam-ex-ceo-da-globo-a-aproximacao-de-vorcaro-e-huck/\" target=\"_blank\" rel=\"noopener\">https://www.brasil247.com/midia/mensagens-ligam-ex-ceo-da-globo-a-aproximacao-de-vorcaro-e-huck/<\/a> (acesso em 16/10/2026)<\/li><li id=\"f-globo-3\" value=\"3\">Brasil 247, \"Kachar, da Globo, disse a Vorcaro que denúncias da piauí contra o banco foram encomendadas pelo Itaú\", 15/10/2026. <a href=\"https://brasil247.com/midia/kachar-da-globo-disse-a-vorcaro-que-denuncias-da-piaui-contra-o-banco-foram-encomendadas-pelo-itau\" target=\"_blank\" rel=\"noopener\">https://brasil247.com/midia/kachar-da-globo-disse-a-vorcaro-que-denuncias-da-piaui-contra-o-banco-foram-encomendadas-pelo-itau<\/a> (acesso em 16/10/2026)<\/li><\/ol><\/section><section class=\"hist\"><h3>Histórico<\/h3><ul><li>16/10/2026: verbete criado.<\/li><\/ul><\/section>", "texto": "O que é Maior grupo de comunicação do Brasil, controlado pela família Marinho. Dono da TV Globo, de O Globo, do Valor Econômico e da Editora Globo. Mensagens com Vorcaro Em 15/10/2026, o grupo demitiu Frederic Kachar, diretor-geral da Editora Globo, da Infoglobo e da Globo Condé Nast, há 29 anos na empresa. Em nota, a Globo disse que as mensagens revelam \"uma relação inadequada do executivo com um anunciante\" e reafirmou a independência editorial. Segundo mensagens do celular de Daniel Vorcaro, apreendido pela PF, trocadas entre outubro de 2023 e julho de 2025: - Kachar enviou a Vorcaro uma reportagem do Valor sobre o Master e pediu a opinião dele. - Diante de uma reclamação de Vorcaro sobre a colunista Malu Gaspar, Kachar disse que tentava conversar com ela. - Kachar disse que o contato com o colunista Lauro Jardim criou uma \"linha direta\" e que ele \"virou até fonte\". - Kachar foi a uma festa privada de Vorcaro em maio de 2024. - O Master foi o principal patrocinador de um evento do Valor em Nova York em 2024. Em outubro de 2024, Kachar comentou com Vorcaro a suspeita de que uma reportagem da piauí contra o banco teria sido encomendada pelo Itaú. Kachar não afirmou saber disso; a suspeita era de Vorcaro, e não há documento que a comprove. Patrocínios O Will Bank, do grupo Master, patrocinou o Domingão com Huck a partir de 2025. Segundo o Poder360, citado pelo Brasil 247, os investimentos de mídia na TV Globo ligados a esse contrato somaram R$ 83 milhões. As mensagens entre Kachar e Vorcaro citam encontros com \"Roberto\", que o Brasil 247 associa a Roberto Marinho Neto; o sobrenome não aparece. A assessoria de Huck diz que a relação com Vorcaro se limitou ao patrocínio, com notas fiscais e impostos recolhidos. Na eleição Recebeu Flávio Bolsonaro para um almoço reservado com a cúpula da emissora no dia da sabatina dele no Jornal Nacional. Ver almoco-flavio-globo. Quem diz o quê Grupo Globo : \"relação inadequada do executivo com um anunciante\"; reafirma independência editorial. Frederic Kachar : não respondeu às reportagens até 15/10/2026. Fontes 1. Gazeta do Povo, \"Como diretor demitido da Globo tratou de reportagens com Vorcaro\", 15/10/2026. (acesso em 16/10/2026) 2. Brasil 247, \"Mensagens ligam ex-CEO da Globo à aproximação de Vorcaro e Huck\", 15/10/2026. (acesso em 16/10/2026) 3. Brasil 247, \"Kachar, da Globo, disse a Vorcaro que denúncias da piauí contra o banco foram encomendadas pelo Itaú\", 15/10/2026. (acesso em 16/10/2026) Histórico - 16/10/2026: verbete criado."}, {"id": "meta", "titulo": "Meta", "tipo": "instituicao", "temas": ["meta"], "apelidos": ["Meta", "Facebook", "Instagram", "WhatsApp", "Zuckerberg", "Mark Zuckerberg", "big techs"], "data": null, "status": "comprovado", "resumo": "Dona de Facebook, Instagram e WhatsApp. Acusada pela campanha de Lula de favorecer Flávio Bolsonaro nas plataformas; nega e atribui os episódios a falhas técnicas.", "revisado": "2026-10-16", "html": "<section><h3>O que é<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Empresa americana dona de Facebook, Instagram e WhatsApp, comandada por Mark Zuckerberg.<\/p><\/section><section><h3>Na eleição de 2026<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> A campanha de <a class=\"ref\" href=\"#lula\" data-id=\"lula\">Lula<\/a> acusa a empresa de favorecer <a class=\"ref\" href=\"#flavio-bolsonaro\" data-id=\"flavio-bolsonaro\">Flávio Bolsonaro<\/a>. Ver <a class=\"ref\" href=\"#meta-interferencia\" data-id=\"meta-interferencia\">Acusação de interferência da Meta<\/a>.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> A IA da Meta no WhatsApp recusou imagens com \"Lula 13\" e gerou com \"Flávio 22\". Ver <a class=\"ref\" href=\"#meta-ai-lula13\" data-id=\"meta-ai-lula13\">Meta AI recusa \"Lula 13\" e gera \"Flávio 22\"<\/a>.<\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> A Meta chamou as acusações de \"simplesmente falsas\" e disse que muitos dos problemas técnicos \"não afetaram exclusivamente o Brasil ou contas específicas\". Disse ao <a class=\"ref\" href=\"#tse\" data-id=\"tse\">TSE<\/a> que uma falha na contagem de visualizações foi global, atingiu mais de 100 países e não alterou a distribuição dos posts.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"4\">4<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Em 15/10/2026, o TSE determinou que a Meta trate as duas campanhas com igualdade até o 2º turno, sob multa diária de R$ 500 mil, sem reconhecer prova de manipulação deliberada. Ver <a class=\"ref\" href=\"#meta-interferencia\" data-id=\"meta-interferencia\">Acusação de interferência da Meta<\/a>.<sup class=\"fn\"><a href=\"#\" data-fonte=\"5\">5<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> Mensagens internas reveladas pela Folha em 16/10/2026 mostram funcionários reconhecendo que a conta de Lula estava \"limitada\" em comparação com a de Flávio e chamando de \"furo\" a recomendação indevida de Flávio nas buscas. A empresa admitiu ao TSE erros técnicos, mas nega favorecimento. Ver <a class=\"ref\" href=\"#meta-interferencia\" data-id=\"meta-interferencia\">Acusação de interferência da Meta<\/a>.<sup class=\"fn\"><a href=\"#\" data-fonte=\"7\">7<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> Segundo levantamento do NetLab, da UFRJ, as plataformas da Meta mantiveram 568 anúncios político-eleitorais no dia do 1º turno, quando a propaganda paga é proibida, e outros seis anúncios imitavam comunicações do TSE com um falso voto pelo celular. O estudo não identifica quais candidatos foram beneficiados e aponta divergências entre a Biblioteca de Anúncios da Meta e sua API. A Meta respondeu que \"a amostragem deste relatório não reflete a escala do nosso trabalho de integridade\".<sup class=\"fn\"><a href=\"#\" data-fonte=\"6\">6<\/a><\/sup><\/p><\/section><section><h3>Contexto<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Em julho de 2025, o governo dos EUA abriu uma investigação comercial (Seção 301) contra o Brasil citando \"ataques\" a empresas americanas de redes sociais. Meta, Google, X e Microsoft enviaram comentários ao processo.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><\/p><\/section><section class=\"fontes\"><h3>Fontes<\/h3><ol><li id=\"f-meta-1\" value=\"1\">Correio Braziliense, \"PT reforça suspeita de interferência da Meta nas eleições; TSE é acionado\", 10/10/2026. <a href=\"https://www.correiobraziliense.com.br/politica/2026/10/7518606-pt-reforca-suspeita-de-interferencia-da-meta-nas-eleicoes-tse-e-acionado.html\" target=\"_blank\" rel=\"noopener\">https://www.correiobraziliense.com.br/politica/2026/10/7518606-pt-reforca-suspeita-de-interferencia-da-meta-nas-eleicoes-tse-e-acionado.html<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-meta-2\" value=\"2\">SBT News, \"Meta nega interferência após acusações da campanha de Lula\", 10/2026. <a href=\"https://sbtnews.sbt.com.br/noticia/politica/meta-nega-interferencia-apos-acusacoes-da-campanha-de-lula\" target=\"_blank\" rel=\"noopener\">https://sbtnews.sbt.com.br/noticia/politica/meta-nega-interferencia-apos-acusacoes-da-campanha-de-lula<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-meta-3\" value=\"3\">Outras Palavras, \"Como Trump sabota a soberania digital brasileira\", 2026. <a href=\"https://outraspalavras.net/tecnologiaemdisputa/como-trump-sabota-a-soberania-digital-brasileira/\" target=\"_blank\" rel=\"noopener\">https://outraspalavras.net/tecnologiaemdisputa/como-trump-sabota-a-soberania-digital-brasileira/<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-meta-4\" value=\"4\">Olhar Digital, \"Meta AI apresenta resultados diferentes em pedidos com Lula e Flávio\", 14/10/2026. <a href=\"https://olhardigital.com.br/2026/10/14/pro/meta-ai-apresenta-resultados-diferentes-em-pedidos-com-lula-e-flavio\" target=\"_blank\" rel=\"noopener\">https://olhardigital.com.br/2026/10/14/pro/meta-ai-apresenta-resultados-diferentes-em-pedidos-com-lula-e-flavio<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-meta-5\" value=\"5\">Correio da Manhã, \"TSE impõe multa de R$ 500 mil à Meta e exige tratamento igual a Lula e Flávio\", 10/2026. <a href=\"https://www.correiodamanha.com.br/politica/2026/10/327550-tse-impoe-multa-de-rs-500-mil-a-meta-e-exige-tratamento-igual-a-lula-e-flavio.html\" target=\"_blank\" rel=\"noopener\">https://www.correiodamanha.com.br/politica/2026/10/327550-tse-impoe-multa-de-rs-500-mil-a-meta-e-exige-tratamento-igual-a-lula-e-flavio.html<\/a> (acesso em 16/10/2026)<\/li><li id=\"f-meta-6\" value=\"6\">Jornal Opção, \"Redes sociais mantiveram anúncios eleitorais irregulares no dia da votação, aponta UFRJ\", 06/10/2026. <a href=\"https://www.jornalopcao.com.br/ultimas-noticias/redes-sociais-mantiveram-anuncios-eleitorais-irregulares-no-dia-da-votacao-aponta-ufrj-876316/\" target=\"_blank\" rel=\"noopener\">https://www.jornalopcao.com.br/ultimas-noticias/redes-sociais-mantiveram-anuncios-eleitorais-irregulares-no-dia-da-votacao-aponta-ufrj-876316/<\/a> (acesso em 16/10/2026)<\/li><li id=\"f-meta-7\" value=\"7\">Portal 6 / Folhapress, \"Em mensagens internas, Meta admite que contas de Lula foram prejudicadas por restrições\", 16/10/2026. <a href=\"https://portal6.com.br/2026/10/16/em-mensagens-internas-meta-admite-que-contas-de-lula-foram-prejudicadas-por-restricoes-engenheiros-falam-em-falhas-tecnicas/\" target=\"_blank\" rel=\"noopener\">https://portal6.com.br/2026/10/16/em-mensagens-internas-meta-admite-que-contas-de-lula-foram-prejudicadas-por-restricoes-engenheiros-falam-em-falhas-tecnicas/<\/a> (acesso em 16/10/2026)<\/li><\/ol><\/section><section class=\"hist\"><h3>Histórico<\/h3><ul><li>14/10/2026: verbete criado.<\/li><li>16/10/2026: incluídos a decisão do TSE e o estudo do NetLab.<\/li><li>16/10/2026: incluído o que a Meta admitiu ao TSE e nas mensagens internas reveladas pela Folha.<\/li><\/ul><\/section>", "texto": "O que é Empresa americana dona de Facebook, Instagram e WhatsApp, comandada por Mark Zuckerberg. Na eleição de 2026 A campanha de Lula acusa a empresa de favorecer Flávio Bolsonaro. Ver meta-interferencia. A IA da Meta no WhatsApp recusou imagens com \"Lula 13\" e gerou com \"Flávio 22\". Ver meta-ai-lula13. A Meta chamou as acusações de \"simplesmente falsas\" e disse que muitos dos problemas técnicos \"não afetaram exclusivamente o Brasil ou contas específicas\". Disse ao TSE que uma falha na contagem de visualizações foi global, atingiu mais de 100 países e não alterou a distribuição dos posts. Em 15/10/2026, o TSE determinou que a Meta trate as duas campanhas com igualdade até o 2º turno, sob multa diária de R$ 500 mil, sem reconhecer prova de manipulação deliberada. Ver meta-interferencia. Mensagens internas reveladas pela Folha em 16/10/2026 mostram funcionários reconhecendo que a conta de Lula estava \"limitada\" em comparação com a de Flávio e chamando de \"furo\" a recomendação indevida de Flávio nas buscas. A empresa admitiu ao TSE erros técnicos, mas nega favorecimento. Ver meta-interferencia. Segundo levantamento do NetLab, da UFRJ, as plataformas da Meta mantiveram 568 anúncios político-eleitorais no dia do 1º turno, quando a propaganda paga é proibida, e outros seis anúncios imitavam comunicações do TSE com um falso voto pelo celular. O estudo não identifica quais candidatos foram beneficiados e aponta divergências entre a Biblioteca de Anúncios da Meta e sua API. A Meta respondeu que \"a amostragem deste relatório não reflete a escala do nosso trabalho de integridade\". Contexto Em julho de 2025, o governo dos EUA abriu uma investigação comercial (Seção 301) contra o Brasil citando \"ataques\" a empresas americanas de redes sociais. Meta, Google, X e Microsoft enviaram comentários ao processo. Fontes 1. Correio Braziliense, \"PT reforça suspeita de interferência da Meta nas eleições; TSE é acionado\", 10/10/2026. (acesso em 14/10/2026) 2. SBT News, \"Meta nega interferência após acusações da campanha de Lula\", 10/2026. (acesso em 14/10/2026) 3. Outras Palavras, \"Como Trump sabota a soberania digital brasileira\", 2026. (acesso em 14/10/2026) 4. Olhar Digital, \"Meta AI apresenta resultados diferentes em pedidos com Lula e Flávio\", 14/10/2026. (acesso em 14/10/2026) 5. Correio da Manhã, \"TSE impõe multa de R$ 500 mil à Meta e exige tratamento igual a Lula e Flávio\", 10/2026. (acesso em 16/10/2026) 6. Jornal Opção, \"Redes sociais mantiveram anúncios eleitorais irregulares no dia da votação, aponta UFRJ\", 06/10/2026. (acesso em 16/10/2026) 7. Portal 6 / Folhapress, \"Em mensagens internas, Meta admite que contas de Lula foram prejudicadas por restrições\", 16/10/2026. (acesso em 16/10/2026) Histórico - 14/10/2026: verbete criado. - 16/10/2026: incluídos a decisão do TSE e o estudo do NetLab. - 16/10/2026: incluído o que a Meta admitiu ao TSE e nas mensagens internas reveladas pela Folha."}, {"id": "tse", "titulo": "Tribunal Superior Eleitoral", "tipo": "instituicao", "temas": ["tse"], "apelidos": ["TSE", "Justiça Eleitoral", "tribunal eleitoral"], "data": null, "status": "comprovado", "resumo": "Órgão máximo da Justiça Eleitoral. Presidido em 2026 por Kassio Nunes Marques. Julga as disputas sobre redes, canais de WhatsApp e plataformas no 2º turno.", "revisado": "2026-10-14", "html": "<section><h3>O que é<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Tribunal de cúpula da Justiça Eleitoral, com sete ministros: três do STF, dois do STJ e dois juristas. Em 2026 é presidido por <a class=\"ref\" href=\"#nunes-marques\" data-id=\"nunes-marques\">Kassio Nunes Marques<\/a>.<\/p><\/section><section><h3>Regras de 2026<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> É a primeira eleição geral sob as regras do TSE para inteligência artificial: deepfake proibido, conteúdo sintético rotulado, e nada de conteúdo sintético com imagem ou voz de candidato entre 72 horas antes e 24 horas depois da votação. Disparo em massa continua proibido, e só candidatos, partidos e coligações podem pagar impulsionamento.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Ver também <a class=\"ref\" href=\"#resolucao-23755\" data-id=\"resolucao-23755\">Resolução TSE 23.755/2026<\/a>.<\/p><\/section><section><h3>Casos em curso no 2º turno<\/h3><ul><li><a class=\"ref\" href=\"#exercito-do-lula\" data-id=\"exercito-do-lula\">Suspensões do canal Exército do Lula<\/a><\/li><li><a class=\"ref\" href=\"#meta-interferencia\" data-id=\"meta-interferencia\">Acusação de interferência da Meta<\/a><\/li><li><a class=\"ref\" href=\"#meta-ai-lula13\" data-id=\"meta-ai-lula13\">Meta AI recusa \"Lula 13\" e gera \"Flávio 22\"<\/a><\/li><\/ul><\/section><section class=\"fontes\"><h3>Fontes<\/h3><ol><li id=\"f-tse-1\" value=\"1\">Jornal de Brasília, \"TSE define regras para campanha eleitoral nas redes em 2026\". <a href=\"https://jornaldebrasilia.com.br/noticias/politica-e-poder/tse-define-regras-para-campanha-eleitoral-nas-redes-em-2026/\" target=\"_blank\" rel=\"noopener\">https://jornaldebrasilia.com.br/noticias/politica-e-poder/tse-define-regras-para-campanha-eleitoral-nas-redes-em-2026/<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-tse-2\" value=\"2\">Terra, \"Meta AI no WhatsApp gera imagem de 'Flávio 22', mas recusa 'Lula 13' e 'Flávio Bolsonaro 22'\", 14/10/2026. <a href=\"https://www.terra.com.br/noticias/eleicoes/meta-ai-no-whatsapp-gera-imagem-de-flavio-22-mas-recusa-lula-13-e-flavio-bolsonaro-22,b9e8fe6be5612c0fd231ad682406c4ecgjplwayc.html\" target=\"_blank\" rel=\"noopener\">https://www.terra.com.br/noticias/eleicoes/meta-ai-no-whatsapp-gera-imagem-de-flavio-22-mas-recusa-lula-13-e-flavio-bolsonaro-22,b9e8fe6be5612c0fd231ad682406c4ecgjplwayc.html<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-tse-3\" value=\"3\">Portal de Prefeitura, \"Eleições 2026: com 100% das seções totalizadas, Flávio tem 47,03%\", 05/10/2026. <a href=\"https://portaldeprefeitura.com.br/bastidores-da-politica/eleicoes-2026-com-100-das-secoes-totalizadas-flavio-tem-4703-e/633498/\" target=\"_blank\" rel=\"noopener\">https://portaldeprefeitura.com.br/bastidores-da-politica/eleicoes-2026-com-100-das-secoes-totalizadas-flavio-tem-4703-e/633498/<\/a> (acesso em 14/10/2026)<\/li><\/ol><\/section><section class=\"hist\"><h3>Histórico<\/h3><ul><li>14/10/2026: verbete criado.<\/li><\/ul><\/section>", "texto": "O que é Tribunal de cúpula da Justiça Eleitoral, com sete ministros: três do STF, dois do STJ e dois juristas. Em 2026 é presidido por Kassio Nunes Marques. Regras de 2026 É a primeira eleição geral sob as regras do TSE para inteligência artificial: deepfake proibido, conteúdo sintético rotulado, e nada de conteúdo sintético com imagem ou voz de candidato entre 72 horas antes e 24 horas depois da votação. Disparo em massa continua proibido, e só candidatos, partidos e coligações podem pagar impulsionamento. Ver também resolucao-23755. Casos em curso no 2º turno - exercito-do-lula - meta-interferencia - meta-ai-lula13 Fontes 1. Jornal de Brasília, \"TSE define regras para campanha eleitoral nas redes em 2026\". (acesso em 14/10/2026) 2. Terra, \"Meta AI no WhatsApp gera imagem de 'Flávio 22', mas recusa 'Lula 13' e 'Flávio Bolsonaro 22'\", 14/10/2026. (acesso em 14/10/2026) 3. Portal de Prefeitura, \"Eleições 2026: com 100% das seções totalizadas, Flávio tem 47,03%\", 05/10/2026. (acesso em 14/10/2026) Histórico - 14/10/2026: verbete criado."}, {"id": "eduardo-bolsonaro", "titulo": "Eduardo Bolsonaro", "tipo": "pessoa", "temas": ["eua"], "apelidos": ["Eduardo", "Dudu Bolsonaro"], "data": null, "status": "comprovado", "resumo": "Ex-deputado federal, vive nos EUA. Condenado pelo STF a 4 anos e 2 meses por coação no curso do processo, por articular sanções americanas para tentar impedir a condenação do pai.", "revisado": "2026-10-14", "html": "<section><h3>Quem é<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Filho de <a class=\"ref\" href=\"#jair-bolsonaro\" data-id=\"jair-bolsonaro\">Jair Bolsonaro<\/a>, vive nos Estados Unidos desde 2025. Perdeu o mandato de deputado federal por faltas.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><\/section><section><h3>Condenação<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Condenado pela Primeira Turma do STF em junho de 2026 a 4 anos e 2 meses por coação no curso do processo. Segundo o tribunal, articulou o <a class=\"ref\" href=\"#tarifaco-2025\" data-id=\"tarifaco-2025\">tarifaço<\/a>, a revogação de vistos de ministros e as sanções da Lei Magnitsky contra <a class=\"ref\" href=\"#moraes\" data-id=\"moraes\">Alexandre de Moraes<\/a> para tentar impedir a condenação do pai.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Em 08/10/2026, Moraes decretou a prisão e o cancelamento dos passaportes. A decisão transitou em julgado.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Disse que vai atuar nos EUA pela retomada da Magnitsky contra Moraes.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><\/section><section class=\"fontes\"><h3>Fontes<\/h3><ol><li id=\"f-eduardo-bolsonaro-1\" value=\"1\">Jornal do Brasil, \"Moraes decreta prisão de Eduardo Bolsonaro após condenação no STF\", 10/2026. <a href=\"https://www.jb.com.br/brasil/justica/2026/10/1061164-moraes-decreta-prisao-de-eduardo-bolsonaro-apos-condenacao-no-stf.html\" target=\"_blank\" rel=\"noopener\">https://www.jb.com.br/brasil/justica/2026/10/1061164-moraes-decreta-prisao-de-eduardo-bolsonaro-apos-condenacao-no-stf.html<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-eduardo-bolsonaro-2\" value=\"2\">Poder360, \"Eduardo diz que atuará nos EUA para retomada de Magnitsky a Moraes\". <a href=\"https://www.poder360.com.br/poder-justica/eduardo-diz-que-atuara-nos-eua-para-retomada-de-magnitsky-a-moraes/\" target=\"_blank\" rel=\"noopener\">https://www.poder360.com.br/poder-justica/eduardo-diz-que-atuara-nos-eua-para-retomada-de-magnitsky-a-moraes/<\/a> (acesso em 14/10/2026)<\/li><\/ol><\/section><section class=\"hist\"><h3>Histórico<\/h3><ul><li>14/10/2026: verbete criado.<\/li><\/ul><\/section>", "texto": "Quem é Filho de Jair Bolsonaro, vive nos Estados Unidos desde 2025. Perdeu o mandato de deputado federal por faltas. Condenação Condenado pela Primeira Turma do STF em junho de 2026 a 4 anos e 2 meses por coação no curso do processo. Segundo o tribunal, articulou o tarifaço, a revogação de vistos de ministros e as sanções da Lei Magnitsky contra Alexandre de Moraes para tentar impedir a condenação do pai. Em 08/10/2026, Moraes decretou a prisão e o cancelamento dos passaportes. A decisão transitou em julgado. Disse que vai atuar nos EUA pela retomada da Magnitsky contra Moraes. Fontes 1. Jornal do Brasil, \"Moraes decreta prisão de Eduardo Bolsonaro após condenação no STF\", 10/2026. (acesso em 14/10/2026) 2. Poder360, \"Eduardo diz que atuará nos EUA para retomada de Magnitsky a Moraes\". (acesso em 14/10/2026) Histórico - 14/10/2026: verbete criado."}, {"id": "flavio-bolsonaro", "titulo": "Flávio Bolsonaro", "tipo": "pessoa", "temas": ["campanhas"], "apelidos": ["Flávio", "Flávio 22", "PL", "senador Flávio"], "data": null, "status": "comprovado", "resumo": "Senador (PL-RJ) e candidato à Presidência. Liderou o 1º turno com 47,03% dos votos válidos. Filho de Jair Bolsonaro. Investigado no STF pelo financiamento do filme Dark Horse.", "revisado": "2026-10-17", "html": "<section><h3>Quem é<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Senador pelo PL do Rio de Janeiro, filho do ex-presidente <a class=\"ref\" href=\"#jair-bolsonaro\" data-id=\"jair-bolsonaro\">Jair Bolsonaro<\/a> e irmão de <a class=\"ref\" href=\"#eduardo-bolsonaro\" data-id=\"eduardo-bolsonaro\">Eduardo Bolsonaro<\/a>. Liderou o <a class=\"ref\" href=\"#primeiro-turno-2026\" data-id=\"primeiro-turno-2026\">1º turno<\/a> com 47,03% dos votos válidos.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><\/section><section><h3>Na eleição de 2026<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Recebeu apoio de Ronaldo Caiado (PSD) em 06/10, embora o PSD tenha ficado neutro, e de Augusto Cury em 08/10.<sup class=\"fn\"><a href=\"#\" data-fonte=\"4\">4<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Votou a favor do fim da escala 6x1, a distância, em 14/10, defendendo ao mesmo tempo a negociação direta da jornada entre patrão e empregado. Ver <a class=\"ref\" href=\"#pec-6x1\" data-id=\"pec-6x1\">Fim da escala 6x1 aprovado no Senado<\/a>.<sup class=\"fn\"><a href=\"#\" data-fonte=\"5\">5<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> Teve almoço reservado com a cúpula da Globo no dia de sua sabatina no Jornal Nacional, encontro que não foi oferecido a Lula, segundo aliados deste. Ver <a class=\"ref\" href=\"#almoco-flavio-globo\" data-id=\"almoco-flavio-globo\">Almoço de Flávio com a cúpula da Globo<\/a>.<\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Teve um anúncio pago contra Lula suspenso pelo TSE em 14/10 e foi multado por associar Lula ao PCC. Ver <a class=\"ref\" href=\"#disputas-tse-2turno\" data-id=\"disputas-tse-2turno\">Disputas no TSE no 2º turno<\/a>.<\/p><p><span class=\"st st-documentado\">Documentado<\/span> A campanha pagou R$ 600 mil à Elytron, empresa que, segundo um ex-consultor, ofereceu nos EUA um sistema de IA com contas falsas e desinformação. Não há prova de uso do sistema em 2026; a campanha diz ter contratado segurança da informação. Ver <a class=\"ref\" href=\"#elytron\" data-id=\"elytron\">Pagamentos de Flávio e do PL à Elytron<\/a>.<sup class=\"fn\"><a href=\"#\" data-fonte=\"6\">6<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> Na sabatina da TV Globo, em 16/10, disse que as contas do filme Dark Horse já tinham sido prestadas, o que o UOL Confere classificou como falso, e repetiu que Vorcaro teria financiado \"por fora\" um filme sobre Lula, relato cuja existência a PF e a PGR negaram. Ver <a class=\"ref\" href=\"#dark-horse\" data-id=\"dark-horse\">Financiamento do filme Dark Horse<\/a>.<sup class=\"fn\"><a href=\"#\" data-fonte=\"8\">8<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> A campanha pediu e obteve do presidente do <a class=\"ref\" href=\"#tse\" data-id=\"tse\">TSE<\/a>, <a class=\"ref\" href=\"#nunes-marques\" data-id=\"nunes-marques\">Nunes Marques<\/a>, a suspensão do canal <a class=\"ref\" href=\"#exercito-do-lula\" data-id=\"exercito-do-lula\">Exército do Lula<\/a>, decisão revertida horas depois pelo corregedor.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><\/section><section><h3>Ligação com o caso Master<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Captou recursos de <a class=\"ref\" href=\"#vorcaro\" data-id=\"vorcaro\">Daniel Vorcaro<\/a> para o filme <a class=\"ref\" href=\"#dark-horse\" data-id=\"dark-horse\">Dark Horse<\/a>, sobre Jair Bolsonaro. Flávio afirma que o último pagamento foi em maio de 2025, num total de US$ 10,6 milhões.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> A revista piauí aponta cerca de US$ 14 milhões pagos, de US$ 24 milhões pedidos.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> Mensagens extraídas pela PF mostram contato frequente com Vorcaro em 2025, incluindo um encontro na casa do banqueiro no dia em que a compra do Master pelo BRB foi sancionada e a mensagem \"contigo sempre\" na véspera da prisão dele. Em janeiro de 2025, voou num avião em que Vorcaro tinha cotas. O Aos Fatos contou 43 declarações enganosas dele sobre o caso. Ver <a class=\"ref\" href=\"#relacao-flavio-vorcaro\" data-id=\"relacao-flavio-vorcaro\">Relação de Flávio com Vorcaro<\/a>.<sup class=\"fn\"><a href=\"#\" data-fonte=\"9\">9<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> É investigado no STF desde julho de 2026, por decisão do ministro André Mendonça, por suspeita de lavagem de dinheiro, evasão de divisas e corrupção no financiamento do filme. A investigação corre em sigilo dentro do inquérito do caso Master (INQ 5026) e veio a público em 10/09. Flávio nega irregularidades.<sup class=\"fn\"><a href=\"#\" data-fonte=\"7\">7<\/a><\/sup><\/p><\/section><section class=\"fontes\"><h3>Fontes<\/h3><ol><li id=\"f-flavio-bolsonaro-1\" value=\"1\">Portal de Prefeitura, \"Eleições 2026: com 100% das seções totalizadas, Flávio tem 47,03%\", 05/10/2026. <a href=\"https://portaldeprefeitura.com.br/bastidores-da-politica/eleicoes-2026-com-100-das-secoes-totalizadas-flavio-tem-4703-e/633498/\" target=\"_blank\" rel=\"noopener\">https://portaldeprefeitura.com.br/bastidores-da-politica/eleicoes-2026-com-100-das-secoes-totalizadas-flavio-tem-4703-e/633498/<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-flavio-bolsonaro-2\" value=\"2\">SBT News, \"'Exército do Lula': entenda vaivém de decisões do TSE\", 10/2026. <a href=\"https://sbtnews.sbt.com.br/noticia/politica/exercito-do-lula-entenda-vaivem-de-decisoes-do-tse\" target=\"_blank\" rel=\"noopener\">https://sbtnews.sbt.com.br/noticia/politica/exercito-do-lula-entenda-vaivem-de-decisoes-do-tse<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-flavio-bolsonaro-3\" value=\"3\">Aos Fatos, \"Oito homens e um banqueiro: explicamos as novas revelações do caso Master\", 09/2026. <a href=\"https://www.aosfatos.org/noticias/explicamos-novas-revelacoes-caso-master/\" target=\"_blank\" rel=\"noopener\">https://www.aosfatos.org/noticias/explicamos-novas-revelacoes-caso-master/<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-flavio-bolsonaro-4\" value=\"4\">Diário do Nordeste, \"Ronaldo Caiado anuncia apoio a Flávio Bolsonaro no 2º turno\", 06/10/2026. <a href=\"https://diariodonordeste.verdesmares.com.br/pontopoder/ronaldo-caiado-anuncia-apoio-a-flavio-bolsonaro-no-2-turno-das-eleicoes-2026-1.3796893\" target=\"_blank\" rel=\"noopener\">https://diariodonordeste.verdesmares.com.br/pontopoder/ronaldo-caiado-anuncia-apoio-a-flavio-bolsonaro-no-2-turno-das-eleicoes-2026-1.3796893<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-flavio-bolsonaro-5\" value=\"5\">DOL, \"Fim da escala 6x1: veja como votaram os senadores\", 10/2026. <a href=\"https://amp.dol.com.br/noticias/brasil/965565/fim-da-escala-6x1-veja-como-votaram-os-senadores\" target=\"_blank\" rel=\"noopener\">https://amp.dol.com.br/noticias/brasil/965565/fim-da-escala-6x1-veja-como-votaram-os-senadores<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-flavio-bolsonaro-6\" value=\"6\">Intercept Brasil, \"Flávio Bolsonaro pagou R$ 600 mil a empresa que vende nos EUA sistema de IA para manipular eleições\", 16/10/2026. <a href=\"https://www.intercept.com.br/2026/10/16/flavio-pagou-empresa-eua-sistema-manipular-eleicoes/\" target=\"_blank\" rel=\"noopener\">https://www.intercept.com.br/2026/10/16/flavio-pagou-empresa-eua-sistema-manipular-eleicoes/<\/a> (acesso em 16/10/2026)<\/li><li id=\"f-flavio-bolsonaro-7\" value=\"7\">Poder360, \"Flávio é investigado no STF por financiamento do Dark Horse\", 11/09/2026. <a href=\"https://www.poder360.com.br/poder-justica/flavio-e-investigado-no-stf-por-financiamento-do-dark-horse/\" target=\"_blank\" rel=\"noopener\">https://www.poder360.com.br/poder-justica/flavio-e-investigado-no-stf-por-financiamento-do-dark-horse/<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-flavio-bolsonaro-8\" value=\"8\">A Crítica, \"Em sabatina, Flávio não explica propostas e cita acusações falsas\", 17/10/2026. <a href=\"https://acritica.net/noticias/em-sabatina-flavio-nao-explica-propostas-e-cita-acusacoes-falsas/\" target=\"_blank\" rel=\"noopener\">https://acritica.net/noticias/em-sabatina-flavio-nao-explica-propostas-e-cita-acusacoes-falsas/<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-flavio-bolsonaro-9\" value=\"9\">Aos Fatos, \"Flávio mentiu ao menos 43 vezes sobre elo com Vorcaro\", 24/09/2026. <a href=\"https://www.aosfatos.org/noticias/flavio-mentiu-ao-menos-43-vezes-sobre-envolvimento-com-vorcaro/\" target=\"_blank\" rel=\"noopener\">https://www.aosfatos.org/noticias/flavio-mentiu-ao-menos-43-vezes-sobre-envolvimento-com-vorcaro/<\/a> (acesso em 17/10/2026)<\/li><\/ol><\/section><section class=\"hist\"><h3>Histórico<\/h3><ul><li>14/10/2026: verbete criado.<\/li><li>15/10/2026: atualizado com notícias de 13 a 15/10.<\/li><li>16/10/2026: incluído o almoço com a Globo.<\/li><li>16/10/2026: incluído o caso Elytron.<\/li><li>17/10/2026: atualizado com notícias de 16 e 17/10.<\/li><li>17/10/2026: incluída a relação com Vorcaro.<\/li><\/ul><\/section>", "texto": "Quem é Senador pelo PL do Rio de Janeiro, filho do ex-presidente Jair Bolsonaro e irmão de Eduardo Bolsonaro. Liderou o 1º turno com 47,03% dos votos válidos. Na eleição de 2026 Recebeu apoio de Ronaldo Caiado (PSD) em 06/10, embora o PSD tenha ficado neutro, e de Augusto Cury em 08/10. Votou a favor do fim da escala 6x1, a distância, em 14/10, defendendo ao mesmo tempo a negociação direta da jornada entre patrão e empregado. Ver pec-6x1. Teve almoço reservado com a cúpula da Globo no dia de sua sabatina no Jornal Nacional, encontro que não foi oferecido a Lula, segundo aliados deste. Ver almoco-flavio-globo. Teve um anúncio pago contra Lula suspenso pelo TSE em 14/10 e foi multado por associar Lula ao PCC. Ver disputas-tse-2turno. A campanha pagou R$ 600 mil à Elytron, empresa que, segundo um ex-consultor, ofereceu nos EUA um sistema de IA com contas falsas e desinformação. Não há prova de uso do sistema em 2026; a campanha diz ter contratado segurança da informação. Ver elytron. Na sabatina da TV Globo, em 16/10, disse que as contas do filme Dark Horse já tinham sido prestadas, o que o UOL Confere classificou como falso, e repetiu que Vorcaro teria financiado \"por fora\" um filme sobre Lula, relato cuja existência a PF e a PGR negaram. Ver dark-horse. A campanha pediu e obteve do presidente do TSE, Nunes Marques, a suspensão do canal Exército do Lula, decisão revertida horas depois pelo corregedor. Ligação com o caso Master Captou recursos de Daniel Vorcaro para o filme Dark Horse, sobre Jair Bolsonaro. Flávio afirma que o último pagamento foi em maio de 2025, num total de US$ 10,6 milhões. A revista piauí aponta cerca de US$ 14 milhões pagos, de US$ 24 milhões pedidos. Mensagens extraídas pela PF mostram contato frequente com Vorcaro em 2025, incluindo um encontro na casa do banqueiro no dia em que a compra do Master pelo BRB foi sancionada e a mensagem \"contigo sempre\" na véspera da prisão dele. Em janeiro de 2025, voou num avião em que Vorcaro tinha cotas. O Aos Fatos contou 43 declarações enganosas dele sobre o caso. Ver relacao-flavio-vorcaro. É investigado no STF desde julho de 2026, por decisão do ministro André Mendonça, por suspeita de lavagem de dinheiro, evasão de divisas e corrupção no financiamento do filme. A investigação corre em sigilo dentro do inquérito do caso Master (INQ 5026) e veio a público em 10/09. Flávio nega irregularidades. Fontes 1. Portal de Prefeitura, \"Eleições 2026: com 100% das seções totalizadas, Flávio tem 47,03%\", 05/10/2026. (acesso em 14/10/2026) 2. SBT News, \"'Exército do Lula': entenda vaivém de decisões do TSE\", 10/2026. (acesso em 14/10/2026) 3. Aos Fatos, \"Oito homens e um banqueiro: explicamos as novas revelações do caso Master\", 09/2026. (acesso em 14/10/2026) 4. Diário do Nordeste, \"Ronaldo Caiado anuncia apoio a Flávio Bolsonaro no 2º turno\", 06/10/2026. (acesso em 14/10/2026) 5. DOL, \"Fim da escala 6x1: veja como votaram os senadores\", 10/2026. (acesso em 15/10/2026) 6. Intercept Brasil, \"Flávio Bolsonaro pagou R$ 600 mil a empresa que vende nos EUA sistema de IA para manipular eleições\", 16/10/2026. (acesso em 16/10/2026) 7. Poder360, \"Flávio é investigado no STF por financiamento do Dark Horse\", 11/09/2026. (acesso em 17/10/2026) 8. A Crítica, \"Em sabatina, Flávio não explica propostas e cita acusações falsas\", 17/10/2026. (acesso em 17/10/2026) 9. Aos Fatos, \"Flávio mentiu ao menos 43 vezes sobre elo com Vorcaro\", 24/09/2026. (acesso em 17/10/2026) Histórico - 14/10/2026: verbete criado. - 15/10/2026: atualizado com notícias de 13 a 15/10. - 16/10/2026: incluído o almoço com a Globo. - 16/10/2026: incluído o caso Elytron. - 17/10/2026: atualizado com notícias de 16 e 17/10. - 17/10/2026: incluída a relação com Vorcaro."}, {"id": "jair-bolsonaro", "titulo": "Jair Bolsonaro", "tipo": "pessoa", "temas": ["campanhas", "stf"], "apelidos": ["Bolsonaro", "ex-presidente Bolsonaro", "Jair"], "data": null, "status": "comprovado", "resumo": "Ex-presidente. Condenado pelo STF em setembro de 2025 a 27 anos e 3 meses na ação da trama golpista; preso preventivamente desde novembro de 2025.", "revisado": "2026-10-14", "html": "<section><h3>Quem é<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Presidente do Brasil entre 2019 e 2022. Pai de <a class=\"ref\" href=\"#flavio-bolsonaro\" data-id=\"flavio-bolsonaro\">Flávio<\/a> e <a class=\"ref\" href=\"#eduardo-bolsonaro\" data-id=\"eduardo-bolsonaro\">Eduardo Bolsonaro<\/a>.<\/p><\/section><section><h3>Condenação<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Em 11/09/2025, a Primeira Turma do STF o condenou a 27 anos e 3 meses de prisão na ação penal da trama golpista. Está preso preventivamente desde 22/11/2025, após tentativa de romper a tornozeleira eletrônica, segundo a Polícia Federal.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Em 2026, o Congresso derrubou o veto de Lula a um projeto que reduz penas de condenados pela trama golpista.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><\/p><\/section><section><h3>Ligações<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Indicou <a class=\"ref\" href=\"#nunes-marques\" data-id=\"nunes-marques\">Kassio Nunes Marques<\/a> ao STF em 2020.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> O julgamento foi citado por <a class=\"ref\" href=\"#trump\" data-id=\"trump\">Donald Trump<\/a> na carta que anunciou o <a class=\"ref\" href=\"#tarifaco-2025\" data-id=\"tarifaco-2025\">tarifaço de 2025<\/a>.<sup class=\"fn\"><a href=\"#\" data-fonte=\"4\">4<\/a><\/sup><\/p><\/section><section class=\"fontes\"><h3>Fontes<\/h3><ol><li id=\"f-jair-bolsonaro-1\" value=\"1\">Wikipedia, \"Arrest of Jair Bolsonaro\". <a href=\"https://en.wikipedia.org/wiki/Arrest_of_Jair_Bolsonaro\" target=\"_blank\" rel=\"noopener\">https://en.wikipedia.org/wiki/Arrest_of_Jair_Bolsonaro<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-jair-bolsonaro-2\" value=\"2\">Wikipedia, \"Nunes Marques\". <a href=\"https://en.wikipedia.org/wiki/Nunes_Marques\" target=\"_blank\" rel=\"noopener\">https://en.wikipedia.org/wiki/Nunes_Marques<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-jair-bolsonaro-3\" value=\"3\">Wikipedia, \"2026 in Brazil\". <a href=\"https://en.wikipedia.org/wiki/2026_in_Brazil\" target=\"_blank\" rel=\"noopener\">https://en.wikipedia.org/wiki/2026_in_Brazil<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-jair-bolsonaro-4\" value=\"4\">Poder360, \"Trump anuncia tarifa de 50% para produtos do Brasil\", 09/07/2025. <a href=\"https://www.poder360.com.br/poder-internacional/trump-anuncia-tarifa-de-50-para-produtos-do-brasil/\" target=\"_blank\" rel=\"noopener\">https://www.poder360.com.br/poder-internacional/trump-anuncia-tarifa-de-50-para-produtos-do-brasil/<\/a> (acesso em 14/10/2026)<\/li><\/ol><\/section><section class=\"hist\"><h3>Histórico<\/h3><ul><li>14/10/2026: verbete criado.<\/li><\/ul><\/section>", "texto": "Quem é Presidente do Brasil entre 2019 e 2022. Pai de Flávio e Eduardo Bolsonaro. Condenação Em 11/09/2025, a Primeira Turma do STF o condenou a 27 anos e 3 meses de prisão na ação penal da trama golpista. Está preso preventivamente desde 22/11/2025, após tentativa de romper a tornozeleira eletrônica, segundo a Polícia Federal. Em 2026, o Congresso derrubou o veto de Lula a um projeto que reduz penas de condenados pela trama golpista. Ligações Indicou Kassio Nunes Marques ao STF em 2020. O julgamento foi citado por Donald Trump na carta que anunciou o tarifaço de 2025. Fontes 1. Wikipedia, \"Arrest of Jair Bolsonaro\". (acesso em 14/10/2026) 2. Wikipedia, \"Nunes Marques\". (acesso em 14/10/2026) 3. Wikipedia, \"2026 in Brazil\". (acesso em 14/10/2026) 4. Poder360, \"Trump anuncia tarifa de 50% para produtos do Brasil\", 09/07/2025. (acesso em 14/10/2026) Histórico - 14/10/2026: verbete criado."}, {"id": "lula", "titulo": "Luiz Inácio Lula da Silva", "tipo": "pessoa", "temas": ["campanhas"], "apelidos": ["Lula", "Luiz Inácio", "PT", "presidente Lula", "Lula 13"], "data": null, "status": "comprovado", "resumo": "Presidente da República (PT), candidato à reeleição. Ficou em segundo no 1º turno, com 45,16% dos votos válidos, e disputa o 2º turno em 25/10/2026.", "revisado": "2026-10-15", "html": "<section><h3>Quem é<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Presidente da República pelo PT, em seu terceiro mandato, candidato à reeleição em 2026. No <a class=\"ref\" href=\"#primeiro-turno-2026\" data-id=\"primeiro-turno-2026\">1º turno<\/a>, teve 45,16% dos votos válidos, atrás de <a class=\"ref\" href=\"#flavio-bolsonaro\" data-id=\"flavio-bolsonaro\">Flávio Bolsonaro<\/a>.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><\/section><section><h3>Na eleição de 2026<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> A campanha acusa a <a class=\"ref\" href=\"#meta\" data-id=\"meta\">Meta<\/a> de favorecer o adversário nas plataformas e levou o caso ao <a class=\"ref\" href=\"#tse\" data-id=\"tse\">TSE<\/a>, à ANPD e à OEA. Ver <a class=\"ref\" href=\"#meta-interferencia\" data-id=\"meta-interferencia\">Acusação de interferência da Meta<\/a>.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> O canal de WhatsApp <a class=\"ref\" href=\"#exercito-do-lula\" data-id=\"exercito-do-lula\">Exército do Lula<\/a>, criado por um aliado, foi suspenso duas vezes pelo presidente do TSE.<\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Tem o fim da escala 6x1, aprovado no Senado em 14/10, como bandeira de campanha. Ver <a class=\"ref\" href=\"#pec-6x1\" data-id=\"pec-6x1\">Fim da escala 6x1 aprovado no Senado<\/a>.<\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> O TSE mandou retirar um post da campanha com o bordão \"Se Flávio vence, você perde\". Ver <a class=\"ref\" href=\"#disputas-tse-2turno\" data-id=\"disputas-tse-2turno\">Disputas no TSE no 2º turno<\/a>.<\/p><\/section><section><h3>Na política externa<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Na Assembleia Geral da ONU de 2026, criticou o uso de tarifas como coerção, defendeu a regulação das big techs, disse que o Brasil não privatizará o Pix e condicionou o acesso a minerais críticos à geração de valor no país. Disse que \"o Brasil não cabe no quintal de ninguém\".<sup class=\"fn\"><a href=\"#\" data-fonte=\"4\">4<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Lidera, com Pedro Sánchez (Espanha) e Gabriel Boric (Chile), a iniciativa internacional \"Em Defesa da Democracia e Contra o Extremismo\", levada à ONU em 2025.<sup class=\"fn\"><a href=\"#\" data-fonte=\"5\">5<\/a><\/sup><\/p><\/section><section><h3>Ligação com o caso Master<\/h3><p><span class=\"st st-documentado\">Documentado<\/span> Recebeu <a class=\"ref\" href=\"#vorcaro\" data-id=\"vorcaro\">Daniel Vorcaro<\/a> no Palácio do Planalto em dezembro de 2024, fora da agenda oficial, num encontro articulado por Guido Mantega e com a presença de Gabriel Galípolo. Segundo a CNN, Lula disse que os temas eram técnicos e deviam ser tratados com o Banco Central. Revelado pelo Metrópoles e confirmado pela CNN.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><\/p><\/section><section class=\"fontes\"><h3>Fontes<\/h3><ol><li id=\"f-lula-1\" value=\"1\">Portal de Prefeitura, \"Eleições 2026: com 100% das seções totalizadas, Flávio tem 47,03%\", 05/10/2026. <a href=\"https://portaldeprefeitura.com.br/bastidores-da-politica/eleicoes-2026-com-100-das-secoes-totalizadas-flavio-tem-4703-e/633498/\" target=\"_blank\" rel=\"noopener\">https://portaldeprefeitura.com.br/bastidores-da-politica/eleicoes-2026-com-100-das-secoes-totalizadas-flavio-tem-4703-e/633498/<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-lula-2\" value=\"2\">Correio Braziliense, \"PT reforça suspeita de interferência da Meta nas eleições; TSE é acionado\", 10/10/2026. <a href=\"https://www.correiobraziliense.com.br/politica/2026/10/7518606-pt-reforca-suspeita-de-interferencia-da-meta-nas-eleicoes-tse-e-acionado.html\" target=\"_blank\" rel=\"noopener\">https://www.correiobraziliense.com.br/politica/2026/10/7518606-pt-reforca-suspeita-de-interferencia-da-meta-nas-eleicoes-tse-e-acionado.html<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-lula-3\" value=\"3\">Portal de Prefeitura, \"Lula teve encontro fora da agenda no Planalto com Vorcaro\", 26/01/2026. <a href=\"https://portaldeprefeitura.com.br/bastidores-da-politica/lula-teve-encontro-fora-da-agenda-no-planalto-com-vorcaro/613758/\" target=\"_blank\" rel=\"noopener\">https://portaldeprefeitura.com.br/bastidores-da-politica/lula-teve-encontro-fora-da-agenda-no-planalto-com-vorcaro/613758/<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-lula-4\" value=\"4\">Clipping CACD, \"Discurso de Lula na ONU em 2026: os 8 pontos-chave\". <a href=\"https://clipping.com.br/cacd/discurso-de-lula-na-onu-2026/\" target=\"_blank\" rel=\"noopener\">https://clipping.com.br/cacd/discurso-de-lula-na-onu-2026/<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-lula-5\" value=\"5\">Diario de Pernambuco, \"Lula questiona avanço da extrema direita: onde a esquerda errou?\", 09/2025. <a href=\"https://www.diariodepernambuco.com.br/politica/2025/09/11696591-lula-questiona-avanco-da-extrema-direita-onde-a-esquerda-errou.html\" target=\"_blank\" rel=\"noopener\">https://www.diariodepernambuco.com.br/politica/2025/09/11696591-lula-questiona-avanco-da-extrema-direita-onde-a-esquerda-errou.html<\/a> (acesso em 14/10/2026)<\/li><\/ol><\/section><section class=\"hist\"><h3>Histórico<\/h3><ul><li>14/10/2026: verbete criado.<\/li><li>15/10/2026: atualizado com notícias de 13 a 15/10.<\/li><\/ul><\/section>", "texto": "Quem é Presidente da República pelo PT, em seu terceiro mandato, candidato à reeleição em 2026. No 1º turno, teve 45,16% dos votos válidos, atrás de Flávio Bolsonaro. Na eleição de 2026 A campanha acusa a Meta de favorecer o adversário nas plataformas e levou o caso ao TSE, à ANPD e à OEA. Ver meta-interferencia. O canal de WhatsApp Exército do Lula, criado por um aliado, foi suspenso duas vezes pelo presidente do TSE. Tem o fim da escala 6x1, aprovado no Senado em 14/10, como bandeira de campanha. Ver pec-6x1. O TSE mandou retirar um post da campanha com o bordão \"Se Flávio vence, você perde\". Ver disputas-tse-2turno. Na política externa Na Assembleia Geral da ONU de 2026, criticou o uso de tarifas como coerção, defendeu a regulação das big techs, disse que o Brasil não privatizará o Pix e condicionou o acesso a minerais críticos à geração de valor no país. Disse que \"o Brasil não cabe no quintal de ninguém\". Lidera, com Pedro Sánchez (Espanha) e Gabriel Boric (Chile), a iniciativa internacional \"Em Defesa da Democracia e Contra o Extremismo\", levada à ONU em 2025. Ligação com o caso Master Recebeu Daniel Vorcaro no Palácio do Planalto em dezembro de 2024, fora da agenda oficial, num encontro articulado por Guido Mantega e com a presença de Gabriel Galípolo. Segundo a CNN, Lula disse que os temas eram técnicos e deviam ser tratados com o Banco Central. Revelado pelo Metrópoles e confirmado pela CNN. Fontes 1. Portal de Prefeitura, \"Eleições 2026: com 100% das seções totalizadas, Flávio tem 47,03%\", 05/10/2026. (acesso em 14/10/2026) 2. Correio Braziliense, \"PT reforça suspeita de interferência da Meta nas eleições; TSE é acionado\", 10/10/2026. (acesso em 14/10/2026) 3. Portal de Prefeitura, \"Lula teve encontro fora da agenda no Planalto com Vorcaro\", 26/01/2026. (acesso em 14/10/2026) 4. Clipping CACD, \"Discurso de Lula na ONU em 2026: os 8 pontos-chave\". (acesso em 14/10/2026) 5. Diario de Pernambuco, \"Lula questiona avanço da extrema direita: onde a esquerda errou?\", 09/2025. (acesso em 14/10/2026) Histórico - 14/10/2026: verbete criado. - 15/10/2026: atualizado com notícias de 13 a 15/10."}, {"id": "moraes", "titulo": "Alexandre de Moraes", "tipo": "pessoa", "temas": ["stf", "master"], "apelidos": ["Moraes", "Xandão", "ministro Moraes"], "data": null, "status": "comprovado", "resumo": "Ministro do STF, relator da ação da trama golpista. Foi sancionado pela Lei Magnitsky em 2025 (sanção retirada em dezembro). É citado em mensagens do caso Master, o que nega.", "revisado": "2026-10-14", "html": "<section><h3>Quem é<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Ministro do STF, relator da ação penal em que <a class=\"ref\" href=\"#jair-bolsonaro\" data-id=\"jair-bolsonaro\">Jair Bolsonaro<\/a> foi condenado e da que condenou <a class=\"ref\" href=\"#eduardo-bolsonaro\" data-id=\"eduardo-bolsonaro\">Eduardo Bolsonaro<\/a>.<\/p><\/section><section><h3>Sanções dos EUA<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Foi sancionado pelo governo <a class=\"ref\" href=\"#trump\" data-id=\"trump\">Trump<\/a> com base na Lei Magnitsky em 2025. Os EUA retiraram Moraes e a esposa da lista em dezembro de 2025, após reaproximação entre os governos.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><\/section><section><h3>Caso Master<\/h3><p><span class=\"st st-documentado\">Documentado<\/span> O relatório da PF aponta 28 mensagens de Vorcaro a um celular atribuído a Moraes entre 12 e 17/12/2025, e um contrato de cerca de R$ 130 milhões com o escritório da esposa, editado por Moraes, segundo o próprio escritório, que nega ilicitude. Moraes nega ter recebido as mensagens.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><\/section><section class=\"fontes\"><h3>Fontes<\/h3><ol><li id=\"f-moraes-1\" value=\"1\">Band, \"EUA retiram Alexandre de Moraes e a esposa da lista da Lei Magnitsky\", 12/12/2025. <a href=\"https://www.band.com.br/noticias/eua-retiram-alexandre-de-moraes-e-a-esposa-da-lista-da-lei-magnitsky-202512121448\" target=\"_blank\" rel=\"noopener\">https://www.band.com.br/noticias/eua-retiram-alexandre-de-moraes-e-a-esposa-da-lista-da-lei-magnitsky-202512121448<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-moraes-2\" value=\"2\">Aos Fatos, \"Oito homens e um banqueiro: explicamos as novas revelações do caso Master\", 09/2026. <a href=\"https://www.aosfatos.org/noticias/explicamos-novas-revelacoes-caso-master/\" target=\"_blank\" rel=\"noopener\">https://www.aosfatos.org/noticias/explicamos-novas-revelacoes-caso-master/<\/a> (acesso em 14/10/2026)<\/li><\/ol><\/section><section class=\"hist\"><h3>Histórico<\/h3><ul><li>14/10/2026: verbete criado.<\/li><\/ul><\/section>", "texto": "Quem é Ministro do STF, relator da ação penal em que Jair Bolsonaro foi condenado e da que condenou Eduardo Bolsonaro. Sanções dos EUA Foi sancionado pelo governo Trump com base na Lei Magnitsky em 2025. Os EUA retiraram Moraes e a esposa da lista em dezembro de 2025, após reaproximação entre os governos. Caso Master O relatório da PF aponta 28 mensagens de Vorcaro a um celular atribuído a Moraes entre 12 e 17/12/2025, e um contrato de cerca de R$ 130 milhões com o escritório da esposa, editado por Moraes, segundo o próprio escritório, que nega ilicitude. Moraes nega ter recebido as mensagens. Fontes 1. Band, \"EUA retiram Alexandre de Moraes e a esposa da lista da Lei Magnitsky\", 12/12/2025. (acesso em 14/10/2026) 2. Aos Fatos, \"Oito homens e um banqueiro: explicamos as novas revelações do caso Master\", 09/2026. (acesso em 14/10/2026) Histórico - 14/10/2026: verbete criado."}, {"id": "nunes-marques", "titulo": "Kassio Nunes Marques", "tipo": "pessoa", "temas": ["tse", "master"], "apelidos": ["Nunes Marques", "Kassio", "Kássio", "presidente do TSE", "ministro Kassio"], "data": null, "status": "comprovado", "resumo": "Ministro do STF indicado por Jair Bolsonaro em 2020 e presidente do TSE durante a eleição de 2026. Suspendeu duas vezes o canal Exército do Lula. É citado em mensagens do caso Master; nega qualquer relação com Vorcaro.", "revisado": "2026-10-17", "html": "<section><h3>Quem é<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Ministro do STF, indicado por <a class=\"ref\" href=\"#jair-bolsonaro\" data-id=\"jair-bolsonaro\">Jair Bolsonaro<\/a> em 2020 para a vaga de Celso de Mello. Antes, foi nomeado ao TRF-1 por Dilma Rousseff, em 2011. Preside o <a class=\"ref\" href=\"#tse\" data-id=\"tse\">TSE<\/a> durante a eleição de 2026.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><\/section><section><h3>Decisões na eleição<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Em 11/10/2026, a pedido da campanha de <a class=\"ref\" href=\"#flavio-bolsonaro\" data-id=\"flavio-bolsonaro\">Flávio Bolsonaro<\/a>, suspendeu o canal <a class=\"ref\" href=\"#exercito-do-lula\" data-id=\"exercito-do-lula\">Exército do Lula<\/a>, por ver indícios de disseminação coordenada de conteúdo falso. O corregedor Ricardo Villas Bôas Cueva reverteu a decisão horas depois. Em 13/10, suspendeu o canal de novo por falta de registro no TSE.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Ainda em 13/10, reconheceu o registro do canal e autorizou a retomada após 48 horas. O corregedor Cueva pediu que ele leve o caso ao plenário com urgência.<sup class=\"fn\"><a href=\"#\" data-fonte=\"8\">8<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> O canal Tropa do Flávio, também sem registro até 13/10, não foi suspenso.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Ficou vencido na decisão colegiada que multou Flávio Bolsonaro em R$ 5 mil por associar Lula ao PCC e ao Comando Vermelho. Ver <a class=\"ref\" href=\"#disputas-tse-2turno\" data-id=\"disputas-tse-2turno\">Disputas no TSE no 2º turno<\/a>.<sup class=\"fn\"><a href=\"#\" data-fonte=\"9\">9<\/a><\/sup> Advogados ouvidos pelo Nexo classificaram decisões do ministro como \"pouco usuais\".<sup class=\"fn\"><a href=\"#\" data-fonte=\"6\">6<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> Ministros do TSE e do STF ouvidos sem identificação por O Globo, Estadão e CNN dizem que ele passou à frente do corregedor no caso Exército do Lula e age para evitar o plenário, onde seria derrotado. Segundo a CNN, há no tribunal clima de \"incômodo e de desconfiança\". Nunes Marques disse a interlocutores que considera o caso resolvido e que não faz sentido levá-lo ao plenário.<sup class=\"fn\"><a href=\"#\" data-fonte=\"10\">10<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"11\">11<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Em 15/10, a Associação Brasileira de Juristas pela Democracia (ABJD) protocolou no TSE pedido de suspeição do ministro, citando as decisões sobre o Exército do Lula e o tratamento diferente dado à Tropa do Flávio. Até 17/10, o pedido não tinha sido pautado.<sup class=\"fn\"><a href=\"#\" data-fonte=\"12\">12<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Em 16/10, acompanhou a decisão unânime do plenário que confirmou as obrigações impostas à Meta para garantir tratamento igual às duas campanhas. Ver <a class=\"ref\" href=\"#meta-interferencia\" data-id=\"meta-interferencia\">Acusação de interferência da Meta<\/a>.<sup class=\"fn\"><a href=\"#\" data-fonte=\"13\">13<\/a><\/sup><\/p><\/section><section><h3>Caso Master<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> O escritório de Kevin Marques, filho do ministro, recebeu cerca de R$ 281 mil de uma consultoria que recebeu R$ 6,6 milhões do Banco Master. O Coaf classificou as operações da consultoria como incompatíveis com sua capacidade financeira. A defesa diz que Kevin nunca atuou para o banco.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"5\">5<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Em 15/09/2026, declarou-se impedido de julgar no STF a validade das provas do celular de Vorcaro enquanto preside o TSE. Avalia voltar ao caso após a eleição.<sup class=\"fn\"><a href=\"#\" data-fonte=\"5\">5<\/a><\/sup><\/p><p><span class=\"st st-alegacao\">Alegação<\/span> Mensagens do celular de Vorcaro citam \"Kassio\" e \"ministro\". Em 15/10, a piauí reconstituiu com 125 mensagens uma festa com garotas de programa no triplex de Vorcaro e a liga ao ministro por interpretação de nomes e siglas. Segundo a revista, a defesa do Master pediu três vezes que ele relatasse o caso do banco. Ver <a class=\"ref\" href=\"#kassio-vorcaro\" data-id=\"kassio-vorcaro\">Menções a \"Kassio\" nas mensagens de Vorcaro<\/a>.<sup class=\"fn\"><a href=\"#\" data-fonte=\"4\">4<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Deputados do PT pediram ao STF investigação contra ele por corrupção passiva, lavagem e outros crimes.<sup class=\"fn\"><a href=\"#\" data-fonte=\"4\">4<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> Segundo a Folhapress, estuda estender o impedimento no caso Master para além da eleição, para se antecipar a pedidos de suspeição. A pedido do presidente do STF, Edson Fachin, a PF vai reunir e enviar à corte todas as menções a ministros encontradas no caso.<sup class=\"fn\"><a href=\"#\" data-fonte=\"14\">14<\/a><\/sup><\/p><\/section><section><h3>Resposta<\/h3><p>Nunes Marques nega contato com Vorcaro, diz que nunca autorizou ninguém a falar em seu nome e lembra que votou pela manutenção da prisão do banqueiro.<sup class=\"fn\"><a href=\"#\" data-fonte=\"5\">5<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"7\">7<\/a><\/sup><\/p><\/section><section class=\"fontes\"><h3>Fontes<\/h3><ol><li id=\"f-nunes-marques-1\" value=\"1\">Wikipedia, \"Nunes Marques\". <a href=\"https://en.wikipedia.org/wiki/Nunes_Marques\" target=\"_blank\" rel=\"noopener\">https://en.wikipedia.org/wiki/Nunes_Marques<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-nunes-marques-2\" value=\"2\">SBT News, \"'Exército do Lula': entenda vaivém de decisões do TSE\", 10/2026. <a href=\"https://sbtnews.sbt.com.br/noticia/politica/exercito-do-lula-entenda-vaivem-de-decisoes-do-tse\" target=\"_blank\" rel=\"noopener\">https://sbtnews.sbt.com.br/noticia/politica/exercito-do-lula-entenda-vaivem-de-decisoes-do-tse<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-nunes-marques-3\" value=\"3\">Brasil de Fato, \"Enquanto TSE suspende grupo pró-Lula, canal 'Tropa do Flávio' dispara fake news no WhatsApp\", 13/10/2026. <a href=\"https://www.brasildefato.com.br/2026/10/13/enquanto-tse-suspende-grupo-pro-lula-canal-tropa-do-flavio-dispara-fake-news-no-whatsapp/\" target=\"_blank\" rel=\"noopener\">https://www.brasildefato.com.br/2026/10/13/enquanto-tse-suspende-grupo-pro-lula-canal-tropa-do-flavio-dispara-fake-news-no-whatsapp/<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-nunes-marques-4\" value=\"4\">Correio Braziliense, \"Deputados do PT pedem investigação contra Nunes Marques por caso Master\", 10/2026. <a href=\"https://www.correiobraziliense.com.br/politica/2026/10/7519311-deputados-do-pt-pedem-investigacao-contra-nunes-marques-por-caso-master.html\" target=\"_blank\" rel=\"noopener\">https://www.correiobraziliense.com.br/politica/2026/10/7519311-deputados-do-pt-pedem-investigacao-contra-nunes-marques-por-caso-master.html<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-nunes-marques-5\" value=\"5\">SP Diário, \"Nunes Marques avalia voltar a julgar processos ligados ao Banco Master após eleições\". <a href=\"https://spdiario.com.br/noticias/politica/nunes-marques-avalia-voltar-a-julgar-processos-ligados-ao-banco-master-apos-eleicoes.html\" target=\"_blank\" rel=\"noopener\">https://spdiario.com.br/noticias/politica/nunes-marques-avalia-voltar-a-julgar-processos-ligados-ao-banco-master-apos-eleicoes.html<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-nunes-marques-6\" value=\"6\">Nexo, \"Como Nunes Marques acena ao bolsonarismo no TSE e no STF\", 13/10/2026. <a href=\"https://nexojornal.com.br/expresso/2026/10/13/kassio-nunes-marques-bolsonarismo-tse-flavio-canal-lula-whatsapp\" target=\"_blank\" rel=\"noopener\">https://nexojornal.com.br/expresso/2026/10/13/kassio-nunes-marques-bolsonarismo-tse-flavio-canal-lula-whatsapp<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-nunes-marques-7\" value=\"7\">Portal 27, \"Festas de luxo e garotas de programa: entenda a menção a Kassio Nunes Marques no caso Vorcaro\". <a href=\"https://www.portal27.com.br/festas-de-luxo-e-garotas-de-programa-entenda-a-mencao-a-kassio-nunes-marques-no-caso-vorcaro/\" target=\"_blank\" rel=\"noopener\">https://www.portal27.com.br/festas-de-luxo-e-garotas-de-programa-entenda-a-mencao-a-kassio-nunes-marques-no-caso-vorcaro/<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-nunes-marques-8\" value=\"8\">CNN Brasil, \"Corregedor cobra julgamento sobre 'Exército do Lula' no plenário do TSE\", 13/10/2026. <a href=\"https://www.cnnbrasil.com.br/eleicoes/corregedor-cobra-julgamento-sobre-exercito-do-lula-no-plenario-do-tse/\" target=\"_blank\" rel=\"noopener\">https://www.cnnbrasil.com.br/eleicoes/corregedor-cobra-julgamento-sobre-exercito-do-lula-no-plenario-do-tse/<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-nunes-marques-9\" value=\"9\">Itatiaia, \"Disputa judicial entre Flávio e Lula se intensifica no segundo turno\", 10/2026. <a href=\"https://www.itatiaia.com.br/politica/disputa-judicial-entre-flavio-e-lula-se-intensifica-no-segundo-turno/\" target=\"_blank\" rel=\"noopener\">https://www.itatiaia.com.br/politica/disputa-judicial-entre-flavio-e-lula-se-intensifica-no-segundo-turno/<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-nunes-marques-10\" value=\"10\">Brasil 247 (a partir da coluna de Bela Megale, O Globo), \"Ministros do TSE e do STF acusam Nunes Marques de atropelar decisões no segundo turno\", 12/10/2026. <a href=\"https://www.brasil247.com/brasil/ministros-do-tse-e-do-stf-acusam-nunes-marques-de-atropelar-decisoes-no-segundo-turno/\" target=\"_blank\" rel=\"noopener\">https://www.brasil247.com/brasil/ministros-do-tse-e-do-stf-acusam-nunes-marques-de-atropelar-decisoes-no-segundo-turno/<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-nunes-marques-11\" value=\"11\">A Crítica (a partir do Estadão), \"Ministros do TSE cobram plenário e criticam Nunes Marques no caso Exército do Lula\", 13/10/2026. <a href=\"https://acritica.net/eleicoes-2026/ministros-do-tse-cobram-plenario-e-criticam-nunes-marques-no-caso-exercito-do-lula/\" target=\"_blank\" rel=\"noopener\">https://acritica.net/eleicoes-2026/ministros-do-tse-cobram-plenario-e-criticam-nunes-marques-no-caso-exercito-do-lula/<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-nunes-marques-12\" value=\"12\">TVT News, \"ABJD protocola pedido de suspeição do ministro Kassio Nunes\", 15/10/2026. <a href=\"https://tvtnews.com.br/?p=806531\" target=\"_blank\" rel=\"noopener\">https://tvtnews.com.br/?p=806531<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-nunes-marques-13\" value=\"13\">Gazeta do Povo, \"TSE confirma decisão que mandou Meta garantir igualdade entre Flávio e Lula nas redes\", 16/10/2026. <a href=\"https://www.gaz
