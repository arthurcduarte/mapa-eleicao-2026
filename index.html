mo Vorcaro enviou dinheiro aos EUA para financiar Dark Horse\", 09/06/2026. <a href=\"https://www.intercept.com.br/2026/06/09/planilha-comprovante-bancario-vorcaro-dinheiro-eua-ar-dark-horse/\" target=\"_blank\" rel=\"noopener\">https://www.intercept.com.br/2026/06/09/planilha-comprovante-bancario-vorcaro-dinheiro-eua-ar-dark-horse/<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-dark-horse-6\" value=\"6\">Aos Fatos, \"Flávio mentiu ao menos 43 vezes sobre elo com Vorcaro\", 24/09/2026. <a href=\"https://www.aosfatos.org/noticias/flavio-mentiu-ao-menos-43-vezes-sobre-envolvimento-com-vorcaro/\" target=\"_blank\" rel=\"noopener\">https://www.aosfatos.org/noticias/flavio-mentiu-ao-menos-43-vezes-sobre-envolvimento-com-vorcaro/<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-dark-horse-7\" value=\"7\">CNN Brasil, \"Ofensiva jurídica após áudio de Flávio a Vorcaro soma ao menos 20 pedidos\", 17/05/2026. <a href=\"https://www.cnnbrasil.com.br/politica/ofensiva-juridica-apos-audio-de-flavio-a-vorcaro-soma-ao-menos-20-pedidos/\" target=\"_blank\" rel=\"noopener\">https://www.cnnbrasil.com.br/politica/ofensiva-juridica-apos-audio-de-flavio-a-vorcaro-soma-ao-menos-20-pedidos/<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-dark-horse-8\" value=\"8\">Correio da Manhã, \"Nova delação: Vorcaro diz ter repassado R$ 60 milhões a Dark Horse\", 03/06/2026. <a href=\"https://www.correiodamanha.com.br/politica/2026/06/291054-nova-delacao-vorcaro-diz-ter-repassado-rs-60-milhoes-a-dark-horse.html\" target=\"_blank\" rel=\"noopener\">https://www.correiodamanha.com.br/politica/2026/06/291054-nova-delacao-vorcaro-diz-ter-repassado-rs-60-milhoes-a-dark-horse.html<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-dark-horse-9\" value=\"9\">Movimento Econômico (Agência Brasil), \"Dino tira sigilo da Operação Dark Horse e proíbe 29 pessoas de deixar o país\", 10/09/2026. <a href=\"https://movimentoeconomico.com.br/economia/justica/2026/09/10/dino-tira-sigilo-da-operacao-dark-horse-e-proibe-29-pessoas-de-deixar-o-pais/\" target=\"_blank\" rel=\"noopener\">https://movimentoeconomico.com.br/economia/justica/2026/09/10/dino-tira-sigilo-da-operacao-dark-horse-e-proibe-29-pessoas-de-deixar-o-pais/<\/a> (acesso em 17/10/2026)<\/li><\/ol><\/section><section class=\"hist\"><h3>Histórico<\/h3><ul><li>14/10/2026: verbete criado.<\/li><li>17/10/2026: atualizado com notícias de 16 e 17/10.<\/li><li>17/10/2026: incluídos o áudio, a rota do dinheiro, o pagamento de setembro de 2025, a proposta de delação e a Operação Make Up.<\/li><\/ul><\/section>", "texto": "O que aconteceu Flávio Bolsonaro captou recursos de Daniel Vorcaro para o filme Dark Horse, sobre Jair Bolsonaro. Segundo Flávio, o último pagamento foi em maio de 2025, num total de US$ 10,6 milhões. A revista piauí aponta cerca de US$ 14 milhões pagos, de US$ 24 milhões pedidos. Segundo o UOL Confere, foram pedidos R$ 134 milhões, e ao menos R$ 61 milhões foram repassados por Vorcaro. Segundo O Globo, um empresário firmou delação com a PGR e entregou extratos de pagamentos ao fundo de um advogado de Eduardo Bolsonaro. Um relatório do Coaf, revelado pela piauí, aponta transferência em 16/09/2025, depois da data que Flávio dá como último pagamento. O áudio Em 13/05/2026, o Intercept Brasil revelou um áudio de 08/09/2025 em que Flávio cobra de Vorcaro parcelas atrasadas: \"Imagina a gente dando calote num Jim Caviezel\" e \"não pode não honrar com os compromissos aqui, porque senão a gente perde tudo\". O compromisso negociado era de US$ 24 milhões, e ao menos US$ 10,6 milhões foram pagos em seis operações entre fevereiro e maio de 2025. Flávio chamou a informação de \"mentira\" ao repórter e, no mesmo dia, admitiu as mensagens em vídeo, dizendo que buscava investimento privado para o filme do pai. A revelação gerou ao menos 20 pedidos de investigação ao STF, à PGR, à PF e a outros órgãos. Ver relacao-flavio-vorcaro. A rota do dinheiro Segundo planilha e comprovante bancário publicados pelo Intercept em 09/06/2026, o dinheiro saiu da Entre Investimentos e Participações, passou pelo banco BS2 e chegou ao fundo Havengate Development Fund, nos EUA, controlado por Paulo Calixto, advogado de Eduardo Bolsonaro. O primeiro envio, de US$ 2 milhões, foi em 13/02/2025. A Entre e Vorcaro negam vínculo societário; a reportagem não afirma que Eduardo tenha participado das operações. Segundo o Intercept, um intermediário escreveu que \"Flávio está ciente de tudo\". Não há confirmação independente de que Flávio soubesse da origem dos recursos. Proposta de delação de Vorcaro Em junho de 2026, a nova proposta de delação de Vorcaro à PF e à PGR afirma que Flávio fez cobranças e que cerca de R$ 60 milhões foram para a produção. A primeira proposta tinha sido rejeitada por omitir dados; a nova não tinha sido aceita até a última notícia encontrada. Emendas parlamentares (Operação Make Up) Em 10/09/2026, a PF cumpriu 49 mandados de busca na Operação Make Up, relatada pelo ministro Flávio Dino, do STF. Ela apura se cerca de R$ 2 milhões em emendas do deputado Mario Frias (PL-SP) a entidades ligadas à produtora Karina Gama foram desviados para o filme. Frias e outras 28 pessoas foram proibidos de deixar o país. Flávio não é alvo dessa operação. Frias não respondeu. Investigação Em julho de 2026, o ministro André Mendonça, do STF, autorizou investigar Flávio Bolsonaro por suspeita de lavagem de dinheiro, evasão de divisas e corrupção no financiamento do filme. O procedimento corre em sigilo, vinculado ao inquérito do caso Master (INQ 5026), e veio a público quando Mendonça retirou o sigilo do inquérito principal, em 10/09. Não há denúncia nem indiciamento conhecidos. Quem diz o quê Flávio Bolsonaro : diz que quem deve esclarecer os pagamentos é a produtora do filme. Na sabatina da TV Globo, em 16/10, disse não ter havido irregularidade, que Vorcaro aceitou participar antes de haver suspeitas sobre o banco e que as contas da produção já tinham sido prestadas. O UOL Confere classificou esta última afirmação como falsa. Rogério Marinho , coordenador da campanha: disse que \"não há fato novo\" na investigação. O que está comprovado O financiamento, admitido por Flávio. Que tenha se tratado de investimento privado comum. O Aos Fatos afirma que não é possível confirmar essa versão com as provas divulgadas até setembro de 2026. Fontes 1. Aos Fatos, \"Oito homens e um banqueiro: explicamos as novas revelações do caso Master\", 09/2026. (acesso em 14/10/2026) 2. Poder360, \"Flávio é investigado no STF por financiamento do Dark Horse\", 11/09/2026. (acesso em 17/10/2026) 3. A Crítica, \"Em sabatina, Flávio não explica propostas e cita acusações falsas\" (com checagens do UOL Confere), 17/10/2026. (acesso em 17/10/2026) 4. Intercept Brasil, \"Áudio: Flávio Bolsonaro negociou com Daniel Vorcaro R$ 134 milhões para bancar filme sobre Jair\", 13/05/2026. (acesso em 17/10/2026) 5. Intercept Brasil, \"Planilha e comprovante bancário mostram como Vorcaro enviou dinheiro aos EUA para financiar Dark Horse\", 09/06/2026. (acesso em 17/10/2026) 6. Aos Fatos, \"Flávio mentiu ao menos 43 vezes sobre elo com Vorcaro\", 24/09/2026. (acesso em 17/10/2026) 7. CNN Brasil, \"Ofensiva jurídica após áudio de Flávio a Vorcaro soma ao menos 20 pedidos\", 17/05/2026. (acesso em 17/10/2026) 8. Correio da Manhã, \"Nova delação: Vorcaro diz ter repassado R$ 60 milhões a Dark Horse\", 03/06/2026. (acesso em 17/10/2026) 9. Movimento Econômico (Agência Brasil), \"Dino tira sigilo da Operação Dark Horse e proíbe 29 pessoas de deixar o país\", 10/09/2026. (acesso em 17/10/2026) Histórico - 14/10/2026: verbete criado. - 17/10/2026: atualizado com notícias de 16 e 17/10. - 17/10/2026: incluídos o áudio, a rota do dinheiro, o pagamento de setembro de 2025, a proposta de delação e a Operação Make Up."}, {"id": "disputas-tse-2turno", "titulo": "Disputas no TSE no 2º turno", "tipo": "evento", "temas": ["tse", "campanhas"], "apelidos": ["AIJE", "impulsionamento", "Lula abandonou o Brasil", "Se Flávio vence você perde", "multa", "Mendonça", "Bellizze", "PCC"], "data": "2026-10-14", "status": "comprovado", "resumo": "Levantamento das principais decisões e ações no TSE entre as duas campanhas desde o 1º turno. Houve decisões contra os dois lados.", "revisado": "2026-10-16", "html": "<section><h3>Decisões contra a campanha de Flávio<\/h3><ul><li><span class=\"st st-comprovado\">Comprovado<\/span> Em 14/10, o ministro André Mendonça proibiu o impulsionamento pago da peça \"Lula abandonou o Brasil\" no Facebook e no Instagram, com prazo de três horas para Flávio e para a Meta. Fundamento: a lei proíbe impulsionamento pago cuja finalidade predominante seja depreciar adversário. A mesma peça já tinha rendido multa de R$ 5 mil no 1º turno. O post pode seguir circulando sem patrocínio. A decisão vai a referendo do plenário.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/li><li><span class=\"st st-comprovado\">Comprovado<\/span> O TSE multou Flávio em R$ 5 mil por associar Lula ao PCC e ao Comando Vermelho, em decisão colegiada na qual o presidente <a class=\"ref\" href=\"#nunes-marques\" data-id=\"nunes-marques\">Nunes Marques<\/a> ficou vencido.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/li><li><span class=\"st st-comprovado\">Comprovado<\/span> O tribunal mandou excluir três publicações com imagens de IA que associavam Lula a organizações criminosas.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/li><\/ul><\/section><section><h3>Decisões sobre as plataformas<\/h3><ul><li><span class=\"st st-comprovado\">Comprovado<\/span> Em 15/10, o ministro Marco Aurélio Bellizze determinou que a Meta trate as duas campanhas com igualdade até o 2º turno, sob multa diária de R$ 500 mil, e afirmou não haver prova de manipulação deliberada. Ver <a class=\"ref\" href=\"#meta-interferencia\" data-id=\"meta-interferencia\">Acusação de interferência da Meta<\/a>.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><\/li><\/ul><\/section><section><h3>Decisões contra a campanha de Lula<\/h3><ul><li><span class=\"st st-comprovado\">Comprovado<\/span> Em 08/10, o TSE mandou retirar a publicação de Lula com o bordão \"Se Flávio vence, você perde\" e um vídeo da primeira-dama Janja com críticas a Flávio.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/li><li><span class=\"st st-comprovado\">Comprovado<\/span> Suspensões do canal <a class=\"ref\" href=\"#exercito-do-lula\" data-id=\"exercito-do-lula\">Exército do Lula<\/a>.<\/li><\/ul><\/section><section><h3>Ações pendentes<\/h3><ul><li><span class=\"st st-comprovado\">Comprovado<\/span> 08/10: Flávio pediu ao TSE a suspensão de 32 perfis no Instagram, a remoção de 221 publicações e a cassação da chapa Lula e Alckmin.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/li><li><span class=\"st st-comprovado\">Comprovado<\/span> 09/10: a coligação de Lula pediu a cassação e a inelegibilidade de Flávio, Alfredo Gaspar e Pablo Marçal.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/li><li><span class=\"st st-comprovado\">Comprovado<\/span> 10/10: o PT apresentou representação contra a <a class=\"ref\" href=\"#meta\" data-id=\"meta\">Meta<\/a>. O ministro Marco Aurélio Bellizze deu 48 horas para a empresa explicar o tratamento dado às candidaturas. Ver <a class=\"ref\" href=\"#meta-interferencia\" data-id=\"meta-interferencia\">Acusação de interferência da Meta<\/a>.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/li><\/ul><\/section><section class=\"fontes\"><h3>Fontes<\/h3><ol><li id=\"f-disputas-tse-2turno-1\" value=\"1\">Itatiaia, \"Disputa judicial entre Flávio e Lula se intensifica no segundo turno\", 10/2026. <a href=\"https://www.itatiaia.com.br/politica/disputa-judicial-entre-flavio-e-lula-se-intensifica-no-segundo-turno/\" target=\"_blank\" rel=\"noopener\">https://www.itatiaia.com.br/politica/disputa-judicial-entre-flavio-e-lula-se-intensifica-no-segundo-turno/<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-disputas-tse-2turno-2\" value=\"2\">Correio Braziliense, \"TSE proíbe Flávio Bolsonaro de impulsionar anúncio contra Lula\", 14/10/2026. <a href=\"https://www.correiobraziliense.com.br/politica/2026/10/7520725-tse-proibe-flavio-bolsonaro-de-impulsionar-anuncio-contra-lula.html\" target=\"_blank\" rel=\"noopener\">https://www.correiobraziliense.com.br/politica/2026/10/7520725-tse-proibe-flavio-bolsonaro-de-impulsionar-anuncio-contra-lula.html<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-disputas-tse-2turno-3\" value=\"3\">Correio da Manhã, \"TSE impõe multa de R$ 500 mil à Meta e exige tratamento igual a Lula e Flávio\", 10/2026. <a href=\"https://www.correiodamanha.com.br/politica/2026/10/327550-tse-impoe-multa-de-rs-500-mil-a-meta-e-exige-tratamento-igual-a-lula-e-flavio.html\" target=\"_blank\" rel=\"noopener\">https://www.correiodamanha.com.br/politica/2026/10/327550-tse-impoe-multa-de-rs-500-mil-a-meta-e-exige-tratamento-igual-a-lula-e-flavio.html<\/a> (acesso em 16/10/2026)<\/li><\/ol><\/section><section class=\"hist\"><h3>Histórico<\/h3><ul><li>15/10/2026: verbete criado.<\/li><li>16/10/2026: incluída a decisão do TSE de 15/10 sobre a Meta.<\/li><\/ul><\/section>", "texto": "Decisões contra a campanha de Flávio - Em 14/10, o ministro André Mendonça proibiu o impulsionamento pago da peça \"Lula abandonou o Brasil\" no Facebook e no Instagram, com prazo de três horas para Flávio e para a Meta. Fundamento: a lei proíbe impulsionamento pago cuja finalidade predominante seja depreciar adversário. A mesma peça já tinha rendido multa de R$ 5 mil no 1º turno. O post pode seguir circulando sem patrocínio. A decisão vai a referendo do plenário. - O TSE multou Flávio em R$ 5 mil por associar Lula ao PCC e ao Comando Vermelho, em decisão colegiada na qual o presidente Nunes Marques ficou vencido. - O tribunal mandou excluir três publicações com imagens de IA que associavam Lula a organizações criminosas. Decisões sobre as plataformas - Em 15/10, o ministro Marco Aurélio Bellizze determinou que a Meta trate as duas campanhas com igualdade até o 2º turno, sob multa diária de R$ 500 mil, e afirmou não haver prova de manipulação deliberada. Ver meta-interferencia. Decisões contra a campanha de Lula - Em 08/10, o TSE mandou retirar a publicação de Lula com o bordão \"Se Flávio vence, você perde\" e um vídeo da primeira-dama Janja com críticas a Flávio. - Suspensões do canal Exército do Lula. Ações pendentes - 08/10: Flávio pediu ao TSE a suspensão de 32 perfis no Instagram, a remoção de 221 publicações e a cassação da chapa Lula e Alckmin. - 09/10: a coligação de Lula pediu a cassação e a inelegibilidade de Flávio, Alfredo Gaspar e Pablo Marçal. - 10/10: o PT apresentou representação contra a Meta. O ministro Marco Aurélio Bellizze deu 48 horas para a empresa explicar o tratamento dado às candidaturas. Ver meta-interferencia. Fontes 1. Itatiaia, \"Disputa judicial entre Flávio e Lula se intensifica no segundo turno\", 10/2026. (acesso em 15/10/2026) 2. Correio Braziliense, \"TSE proíbe Flávio Bolsonaro de impulsionar anúncio contra Lula\", 14/10/2026. (acesso em 15/10/2026) 3. Correio da Manhã, \"TSE impõe multa de R$ 500 mil à Meta e exige tratamento igual a Lula e Flávio\", 10/2026. (acesso em 16/10/2026) Histórico - 15/10/2026: verbete criado. - 16/10/2026: incluída a decisão do TSE de 15/10 sobre a Meta."}, {"id": "elytron", "titulo": "Pagamentos de Flávio e do PL à Elytron", "tipo": "evento", "temas": ["campanhas", "eua"], "apelidos": ["Elytron", "Vincent Reed", "João Brasio", "Intercept", "IA para manipular eleições", "contas falsas"], "data": "2026-10-16", "status": "documentado", "resumo": "A campanha de Flávio pagou R$ 600 mil e o PL R$ 131,9 mil à Elytron, empresa de cibersegurança que, segundo documentos de um ex-consultor, ofereceu nos EUA um sistema de IA com contas falsas e desinformação. Não há prova de uso desse sistema em 2026.", "revisado": "2026-10-16", "html": "<section><h3>O que foi pago<\/h3><p><span class=\"st st-documentado\">Documentado<\/span> Segundo o DivulgaCand, a campanha de <a class=\"ref\" href=\"#flavio-bolsonaro\" data-id=\"flavio-bolsonaro\">Flávio Bolsonaro<\/a> pagou R$ 600 mil à Elytron em três notas fiscais: duas de R$ 500 mil em 16/09/2026, uma delas cancelada, e uma de R$ 100 mil em 02/10/2026. Em prestação parcial, a campanha chegou a declarar R$ 1 milhão de despesa com a empresa.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> O PL pagou R$ 131,9 mil à mesma empresa em 20/07/2026, registrados como \"serviços técnico-profissionais\". As notas descrevem consultoria em TI, apoio forense, teste de segurança e monitoramento de infraestrutura.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><\/section><section><h3>O que a empresa teria oferecido<\/h3><p><span class=\"st st-alegacao\">Alegação<\/span> Documentos entregues ao Intercept Brasil por Vincent Reed, ex-consultor da Elytron (2024 e 2025), mostram uma apresentação em inglês de um sistema de IA para mapear e segmentar eleitores e operar \"comportamentos inautênticos\", como contas falsas e desinformação. Reed diz que o termo \"manipulação\" foi usado e que o sistema poderia usar deepfakes.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><span class=\"st st-alegacao\">Alegação<\/span> Segundo Reed, a demonstração foi feita a pessoas ligadas à campanha de <a class=\"ref\" href=\"#trump\" data-id=\"trump\">Donald Trump<\/a> em 2024. Não há confirmação de contratação, e a empresa nega ter prestado serviços a Trump. Reed levou o caso ao FBI e a um comitê da Câmara dos EUA, sem desdobramento conhecido.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><\/section><section><h3>O que não está provado<\/h3><p><span class=\"st st-documentado\">Documentado<\/span> A própria reportagem diz não haver evidência de que o sistema tenha sido usado por Flávio ou pelo PL em 2026. O que está documentado é o pagamento a uma empresa que, segundo um ex-consultor, ofereceu esse tipo de serviço em outro país. Monitoramento de redes e segurança da informação são serviços legais e comuns em campanhas.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> As práticas descritas na apresentação (contas falsas, desinformação, deepfakes) são vedadas no Brasil pela <a class=\"ref\" href=\"#resolucao-23755\" data-id=\"resolucao-23755\">Resolução 23.755 do TSE<\/a>.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><\/section><section><h3>Quem está em volta<\/h3><p><span class=\"st st-documentado\">Documentado<\/span> A Elytron foi fundada em 2018 por João Brasio e Felipe Garofalo, tem sede em São Paulo e registro em Portugal desde 2021. Brasio ficou conhecido em 2018 por apontar falha no DivulgaCand, diz ter trabalhado para o Pentágono e é sócio da Katana, agência de comunicação política. A reportagem cita ligações de executivos parceiros com a Aleria, dos Emirados Árabes, e com o entorno de Pablo Marçal, que entrou na equipe de Flávio no fim de setembro.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><\/section><section><h3>Respostas<\/h3><p><span class=\"st st-documentado\">Documentado<\/span> A campanha de Flávio diz que \"não contrata nenhum serviço que viole a legislação eleitoral\", que a contratação seguiu procedimentos regulares para segurança da informação e que a reportagem tem \"claro viés político eleitoreiro\". A Elytron diz que seus serviços são \"exclusivamente defensivos\", nega deepfakes e operações clandestinas e diz que os executivos citados são parceiros independentes pagos por comissão. Os dois parceiros negam reuniões com a equipe de Trump; Renzo Gracie, citado como sócio, nega relação; Eric Leandri não respondeu.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><\/section><section><h3>Repercussão<\/h3><p><span class=\"st st-documentado\">Documentado<\/span> A reportagem foi replicada no mesmo dia por veículos regionais e de esquerda (Bahia Notícias, Metro 1, Diário do Centro do Mundo, O Cafezinho, TVT). Até a tarde de 16/10 não foi encontrada repercussão nos grandes jornais nem ação no TSE sobre o caso.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><\/section><section class=\"fontes\"><h3>Fontes<\/h3><ol><li id=\"f-elytron-1\" value=\"1\">Intercept Brasil, \"Flávio Bolsonaro pagou R$ 600 mil a empresa que vende nos EUA sistema de IA para manipular eleições\", 16/10/2026. <a href=\"https://www.intercept.com.br/2026/10/16/flavio-pagou-empresa-eua-sistema-manipular-eleicoes/\" target=\"_blank\" rel=\"noopener\">https://www.intercept.com.br/2026/10/16/flavio-pagou-empresa-eua-sistema-manipular-eleicoes/<\/a><\/li><li id=\"f-elytron-2\" value=\"2\">Bahia Notícias, \"Flávio Bolsonaro e PL pagaram R$ 731 mil a empresa suspeita de manipulação política\", 16/10/2026. <a href=\"https://www.bahianoticias.com.br/noticia/322544-flavio-bolsonaro-e-pl-pagaram-rdollar-731-mil-a-empresa-suspeita-de-manipulacao-diz-intercept\" target=\"_blank\" rel=\"noopener\">https://www.bahianoticias.com.br/noticia/322544-flavio-bolsonaro-e-pl-pagaram-rdollar-731-mil-a-empresa-suspeita-de-manipulacao-diz-intercept<\/a><\/li><\/ol><\/section><section class=\"hist\"><h3>Histórico<\/h3><ul><li>2026-10-16: verbete criado a partir da reportagem do Intercept Brasil.<\/li><\/ul><\/section>", "texto": "O que foi pago Segundo o DivulgaCand, a campanha de Flávio Bolsonaro pagou R$ 600 mil à Elytron em três notas fiscais: duas de R$ 500 mil em 16/09/2026, uma delas cancelada, e uma de R$ 100 mil em 02/10/2026. Em prestação parcial, a campanha chegou a declarar R$ 1 milhão de despesa com a empresa. O PL pagou R$ 131,9 mil à mesma empresa em 20/07/2026, registrados como \"serviços técnico-profissionais\". As notas descrevem consultoria em TI, apoio forense, teste de segurança e monitoramento de infraestrutura. O que a empresa teria oferecido Documentos entregues ao Intercept Brasil por Vincent Reed, ex-consultor da Elytron (2024 e 2025), mostram uma apresentação em inglês de um sistema de IA para mapear e segmentar eleitores e operar \"comportamentos inautênticos\", como contas falsas e desinformação. Reed diz que o termo \"manipulação\" foi usado e que o sistema poderia usar deepfakes. Segundo Reed, a demonstração foi feita a pessoas ligadas à campanha de Donald Trump em 2024. Não há confirmação de contratação, e a empresa nega ter prestado serviços a Trump. Reed levou o caso ao FBI e a um comitê da Câmara dos EUA, sem desdobramento conhecido. O que não está provado A própria reportagem diz não haver evidência de que o sistema tenha sido usado por Flávio ou pelo PL em 2026. O que está documentado é o pagamento a uma empresa que, segundo um ex-consultor, ofereceu esse tipo de serviço em outro país. Monitoramento de redes e segurança da informação são serviços legais e comuns em campanhas. As práticas descritas na apresentação (contas falsas, desinformação, deepfakes) são vedadas no Brasil pela Resolução 23.755 do TSE. Quem está em volta A Elytron foi fundada em 2018 por João Brasio e Felipe Garofalo, tem sede em São Paulo e registro em Portugal desde 2021. Brasio ficou conhecido em 2018 por apontar falha no DivulgaCand, diz ter trabalhado para o Pentágono e é sócio da Katana, agência de comunicação política. A reportagem cita ligações de executivos parceiros com a Aleria, dos Emirados Árabes, e com o entorno de Pablo Marçal, que entrou na equipe de Flávio no fim de setembro. Respostas A campanha de Flávio diz que \"não contrata nenhum serviço que viole a legislação eleitoral\", que a contratação seguiu procedimentos regulares para segurança da informação e que a reportagem tem \"claro viés político eleitoreiro\". A Elytron diz que seus serviços são \"exclusivamente defensivos\", nega deepfakes e operações clandestinas e diz que os executivos citados são parceiros independentes pagos por comissão. Os dois parceiros negam reuniões com a equipe de Trump; Renzo Gracie, citado como sócio, nega relação; Eric Leandri não respondeu. Repercussão A reportagem foi replicada no mesmo dia por veículos regionais e de esquerda (Bahia Notícias, Metro 1, Diário do Centro do Mundo, O Cafezinho, TVT). Até a tarde de 16/10 não foi encontrada repercussão nos grandes jornais nem ação no TSE sobre o caso. Fontes 1. Intercept Brasil, \"Flávio Bolsonaro pagou R$ 600 mil a empresa que vende nos EUA sistema de IA para manipular eleições\", 16/10/2026. 2. Bahia Notícias, \"Flávio Bolsonaro e PL pagaram R$ 731 mil a empresa suspeita de manipulação política\", 16/10/2026. Histórico - 2026-10-16: verbete criado a partir da reportagem do Intercept Brasil."}, {"id": "exercito-do-lula", "titulo": "Suspensões do canal Exército do Lula", "tipo": "evento", "temas": ["tse", "campanhas"], "apelidos": ["Exército do Lula", "Janones", "canal do WhatsApp", "Tropa do Flávio", "Nikolas Ferreira"], "data": "2026-10-11", "status": "comprovado", "resumo": "O canal pró-Lula de André Janones foi suspenso pelo presidente do TSE a pedido da campanha de Flávio, reativado horas depois pelo corregedor e suspenso de novo por falta de registro. O canal pró-Flávio, também sem registro, não foi suspenso.", "revisado": "2026-10-15", "html": "<section><h3>O que aconteceu<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Depois do 1º turno, o deputado André Janones (Rede-MG) criou o canal de WhatsApp \"Exército do Lula\", com mais de 4 milhões de seguidores. Em 06/10, apoiadores de Flávio organizaram denúncias em massa contra o canal.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Em 11/10, <a class=\"ref\" href=\"#nunes-marques\" data-id=\"nunes-marques\">Nunes Marques<\/a>, presidente do <a class=\"ref\" href=\"#tse\" data-id=\"tse\">TSE<\/a>, suspendeu o canal a pedido da campanha de <a class=\"ref\" href=\"#flavio-bolsonaro\" data-id=\"flavio-bolsonaro\">Flávio<\/a>, por ver indícios de que funcionava como \"central de comando\" para disseminar conteúdo falso. Horas depois, o corregedor Ricardo Villas Bôas Cueva reativou o canal, por falta de base para derrubar a estrutura inteira, e mandou o caso ao plenário.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> Um relatório técnico do TSE não encontrou fake news específica nas mensagens de 2 a 11/10, mas apontou preocupação com disseminação coordenada e conteúdo apagado.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Em 13/10, Nunes Marques suspendeu o canal de novo, por falta de registro no TSE. A campanha registrou o canal no mesmo dia. Ainda em 13/10, Nunes Marques reconheceu o registro como meio de propaganda da campanha e autorizou a retomada do canal depois de 48 horas.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"4\">4<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Também em 13/10, o corregedor Cueva pediu que o plenário do TSE julgue o caso com urgência, citando as decisões sobrepostas e os limites de competência entre a Presidência e a Corregedoria. Até 15/10, o caso não tinha sido levado ao plenário.<sup class=\"fn\"><a href=\"#\" data-fonte=\"4\">4<\/a><\/sup><\/p><\/section><section><h3>O canal do outro lado<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> O canal \"Tropa do Flávio\", criado por Nikolas Ferreira (PL-MG), com cerca de 1,5 milhão de seguidores, também não estava registrado até 13/10, quando a campanha complementou os dados. Não foi suspenso.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> O Brasil de Fato listou conteúdos falsos ou enganosos publicados no Tropa do Flávio, entre eles uma imagem falsa em vídeo de Tarcísio de Freitas, apagada após condenação da Justiça Eleitoral.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><\/section><section><h3>Quem diz o quê<\/h3><p><strong>Campanha de Flávio<\/strong>: diz que o Exército do Lula ensinava a burlar controles das plataformas e da Justiça Eleitoral, e chamou a reativação de \"estarrecedora\".<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><strong>Lula e Janones<\/strong>: chamaram a suspensão de censura; Lula disse que as decisões podem ser parciais.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><\/section><section class=\"fontes\"><h3>Fontes<\/h3><ol><li id=\"f-exercito-do-lula-1\" value=\"1\">SBT News, \"'Exército do Lula': entenda vaivém de decisões do TSE\", 10/2026. <a href=\"https://sbtnews.sbt.com.br/noticia/politica/exercito-do-lula-entenda-vaivem-de-decisoes-do-tse\" target=\"_blank\" rel=\"noopener\">https://sbtnews.sbt.com.br/noticia/politica/exercito-do-lula-entenda-vaivem-de-decisoes-do-tse<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-exercito-do-lula-2\" value=\"2\">Brasil de Fato, \"Enquanto TSE suspende grupo pró-Lula, canal 'Tropa do Flávio' dispara fake news no WhatsApp\", 13/10/2026. <a href=\"https://www.brasildefato.com.br/2026/10/13/enquanto-tse-suspende-grupo-pro-lula-canal-tropa-do-flavio-dispara-fake-news-no-whatsapp/\" target=\"_blank\" rel=\"noopener\">https://www.brasildefato.com.br/2026/10/13/enquanto-tse-suspende-grupo-pro-lula-canal-tropa-do-flavio-dispara-fake-news-no-whatsapp/<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-exercito-do-lula-3\" value=\"3\">NC News, \"PT denuncia Meta por interferência nas eleições 2026\", 14/10/2026. <a href=\"https://ncnews.com.br/2026/10/14/pt-denuncia-meta-interferencia-eleicoes/\" target=\"_blank\" rel=\"noopener\">https://ncnews.com.br/2026/10/14/pt-denuncia-meta-interferencia-eleicoes/<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-exercito-do-lula-4\" value=\"4\">CNN Brasil, \"Corregedor cobra julgamento sobre 'Exército do Lula' no plenário do TSE\", 13/10/2026. <a href=\"https://www.cnnbrasil.com.br/eleicoes/corregedor-cobra-julgamento-sobre-exercito-do-lula-no-plenario-do-tse/\" target=\"_blank\" rel=\"noopener\">https://www.cnnbrasil.com.br/eleicoes/corregedor-cobra-julgamento-sobre-exercito-do-lula-no-plenario-do-tse/<\/a> (acesso em 15/10/2026)<\/li><\/ol><\/section><section class=\"hist\"><h3>Histórico<\/h3><ul><li>14/10/2026: verbete criado.<\/li><li>15/10/2026: atualizado com notícias de 13 a 15/10.<\/li><\/ul><\/section>", "texto": "O que aconteceu Depois do 1º turno, o deputado André Janones (Rede-MG) criou o canal de WhatsApp \"Exército do Lula\", com mais de 4 milhões de seguidores. Em 06/10, apoiadores de Flávio organizaram denúncias em massa contra o canal. Em 11/10, Nunes Marques, presidente do TSE, suspendeu o canal a pedido da campanha de Flávio, por ver indícios de que funcionava como \"central de comando\" para disseminar conteúdo falso. Horas depois, o corregedor Ricardo Villas Bôas Cueva reativou o canal, por falta de base para derrubar a estrutura inteira, e mandou o caso ao plenário. Um relatório técnico do TSE não encontrou fake news específica nas mensagens de 2 a 11/10, mas apontou preocupação com disseminação coordenada e conteúdo apagado. Em 13/10, Nunes Marques suspendeu o canal de novo, por falta de registro no TSE. A campanha registrou o canal no mesmo dia. Ainda em 13/10, Nunes Marques reconheceu o registro como meio de propaganda da campanha e autorizou a retomada do canal depois de 48 horas. Também em 13/10, o corregedor Cueva pediu que o plenário do TSE julgue o caso com urgência, citando as decisões sobrepostas e os limites de competência entre a Presidência e a Corregedoria. Até 15/10, o caso não tinha sido levado ao plenário. O canal do outro lado O canal \"Tropa do Flávio\", criado por Nikolas Ferreira (PL-MG), com cerca de 1,5 milhão de seguidores, também não estava registrado até 13/10, quando a campanha complementou os dados. Não foi suspenso. O Brasil de Fato listou conteúdos falsos ou enganosos publicados no Tropa do Flávio, entre eles uma imagem falsa em vídeo de Tarcísio de Freitas, apagada após condenação da Justiça Eleitoral. Quem diz o quê Campanha de Flávio : diz que o Exército do Lula ensinava a burlar controles das plataformas e da Justiça Eleitoral, e chamou a reativação de \"estarrecedora\". Lula e Janones : chamaram a suspensão de censura; Lula disse que as decisões podem ser parciais. Fontes 1. SBT News, \"'Exército do Lula': entenda vaivém de decisões do TSE\", 10/2026. (acesso em 14/10/2026) 2. Brasil de Fato, \"Enquanto TSE suspende grupo pró-Lula, canal 'Tropa do Flávio' dispara fake news no WhatsApp\", 13/10/2026. (acesso em 14/10/2026) 3. NC News, \"PT denuncia Meta por interferência nas eleições 2026\", 14/10/2026. (acesso em 14/10/2026) 4. CNN Brasil, \"Corregedor cobra julgamento sobre 'Exército do Lula' no plenário do TSE\", 13/10/2026. (acesso em 15/10/2026) Histórico - 14/10/2026: verbete criado. - 15/10/2026: atualizado com notícias de 13 a 15/10."}, {"id": "fechamento-embaixada", "titulo": "Fechamento da embaixada dos EUA", "tipo": "evento", "temas": ["eua"], "apelidos": ["embaixada", "consulados", "embaixada americana"], "data": "2026-10-02", "status": "comprovado", "resumo": "Dois dias antes do 1º turno, os EUA fecharam a embaixada em Brasília e os consulados no país, citando segurança, sem detalhar o motivo nem a data de reabertura.", "revisado": "2026-10-15", "html": "<section><h3>O que aconteceu<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Em 02/10/2026, o Departamento de Estado fechou a embaixada em Brasília e os consulados em São Paulo, Rio de Janeiro, Porto Alegre, Recife e Belo Horizonte, sem previsão de reabertura.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><\/section><section><h3>Quem diz o quê<\/h3><p><strong>Governo dos EUA<\/strong>: disse apenas que dá \"máxima prioridade à segurança e à proteção dos cidadãos americanos\" e que trabalha com autoridades brasileiras em questões de segurança.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><strong>Governo brasileiro<\/strong>: não há manifestação registrada nas fontes consultadas.<\/p><p><strong>Campanha de Lula<\/strong>: em 02/10, pediu ao TSE que o fechamento seja considerado fato novo na ação que apura suposta interferência estrangeira na eleição, movida contra Flávio Bolsonaro, Eduardo Bolsonaro e Alfredo Gaspar.<sup class=\"fn\"><a href=\"#\" data-fonte=\"5\">5<\/a><\/sup><\/p><p><span class=\"st st-alegacao\">Alegação<\/span> Segundo a TV Band, citada na petição, a decisão de fechar as representações teria partido do secretário de Estado Marco Rubio.<sup class=\"fn\"><a href=\"#\" data-fonte=\"5\">5<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Até 15/10, as fontes consultadas não registram reabertura.<\/p><\/section><section><h3>Contexto<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Na véspera, 01/10, <a class=\"ref\" href=\"#trump\" data-id=\"trump\">Trump<\/a> disse acompanhar a eleição \"muito de perto\".<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> Um relatório reservado da Abin, revelado em setembro, classificou como crítico o risco de interferência dos EUA na eleição.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup> A Jovem Pan publicou que o relatório não cita os EUA nominalmente.<sup class=\"fn\"><a href=\"#\" data-fonte=\"4\">4<\/a><\/sup><\/p><\/section><section class=\"fontes\"><h3>Fontes<\/h3><ol><li id=\"f-fechamento-embaixada-1\" value=\"1\">Correio Braziliense, \"O que o governo dos EUA diz sobre fechamento de embaixada e consulados no Brasil às vésperas da eleição\", 10/2026. <a href=\"https://www.correiobraziliense.com.br/mundo/2026/10/7513016-o-que-o-governo-dos-eua-diz-sobre-fechamento-de-embaixada-e-consulados-no-brasil-as-vesperas-da-eleicao.html\" target=\"_blank\" rel=\"noopener\">https://www.correiobraziliense.com.br/mundo/2026/10/7513016-o-que-o-governo-dos-eua-diz-sobre-fechamento-de-embaixada-e-consulados-no-brasil-as-vesperas-da-eleicao.html<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-fechamento-embaixada-2\" value=\"2\">Agência Brasil, \"Trump diz acompanhar de perto eleição brasileira e não declara apoio\", 01/10/2026. <a href=\"https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/trump-diz-acompanhar-de-perto-eleicao-brasileira-e-nao-declarar-apoio\" target=\"_blank\" rel=\"noopener\">https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/trump-diz-acompanhar-de-perto-eleicao-brasileira-e-nao-declarar-apoio<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-fechamento-embaixada-3\" value=\"3\">Diario de Pernambuco, \"Relatório da Abin alerta para risco de interferência dos EUA nas eleições\", 09/2026. <a href=\"https://www.diariodepernambuco.com.br/politica/2026/09/11724395-relatorio-da-abin-alerta-para-risco-de-interferencia-dos-eua-nas-eleicoes.html\" target=\"_blank\" rel=\"noopener\">https://www.diariodepernambuco.com.br/politica/2026/09/11724395-relatorio-da-abin-alerta-para-risco-de-interferencia-dos-eua-nas-eleicoes.html<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-fechamento-embaixada-4\" value=\"4\">Jovem Pan, \"Relatório da Abin aponta risco de interferência internacional nas eleições, mas não cita EUA\". <a href=\"https://jovempan.com.br/politica/relatorio-da-abin-aponta-risco-de-interferencia-internacional-nas-eleicoes-mas-nao-cita-eua/\" target=\"_blank\" rel=\"noopener\">https://jovempan.com.br/politica/relatorio-da-abin-aponta-risco-de-interferencia-internacional-nas-eleicoes-mas-nao-cita-eua/<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-fechamento-embaixada-5\" value=\"5\">CartaCapital, \"Campanha de Lula pede ao TSE investigação sobre fechamento de Embaixada dos EUA\", 03/10/2026. <a href=\"https://www.cartacapital.com.br/politica/campanha-de-lula-pede-ao-tse-investigacao-sobre-fechamento-de-embaixada-dos-eua/\" target=\"_blank\" rel=\"noopener\">https://www.cartacapital.com.br/politica/campanha-de-lula-pede-ao-tse-investigacao-sobre-fechamento-de-embaixada-dos-eua/<\/a> (acesso em 15/10/2026)<\/li><\/ol><\/section><section class=\"hist\"><h3>Histórico<\/h3><ul><li>14/10/2026: verbete criado.<\/li><li>15/10/2026: atualizado com notícias de 13 a 15/10.<\/li><\/ul><\/section>", "texto": "O que aconteceu Em 02/10/2026, o Departamento de Estado fechou a embaixada em Brasília e os consulados em São Paulo, Rio de Janeiro, Porto Alegre, Recife e Belo Horizonte, sem previsão de reabertura. Quem diz o quê Governo dos EUA : disse apenas que dá \"máxima prioridade à segurança e à proteção dos cidadãos americanos\" e que trabalha com autoridades brasileiras em questões de segurança. Governo brasileiro : não há manifestação registrada nas fontes consultadas. Campanha de Lula : em 02/10, pediu ao TSE que o fechamento seja considerado fato novo na ação que apura suposta interferência estrangeira na eleição, movida contra Flávio Bolsonaro, Eduardo Bolsonaro e Alfredo Gaspar. Segundo a TV Band, citada na petição, a decisão de fechar as representações teria partido do secretário de Estado Marco Rubio. Até 15/10, as fontes consultadas não registram reabertura. Contexto Na véspera, 01/10, Trump disse acompanhar a eleição \"muito de perto\". Um relatório reservado da Abin, revelado em setembro, classificou como crítico o risco de interferência dos EUA na eleição. A Jovem Pan publicou que o relatório não cita os EUA nominalmente. Fontes 1. Correio Braziliense, \"O que o governo dos EUA diz sobre fechamento de embaixada e consulados no Brasil às vésperas da eleição\", 10/2026. (acesso em 14/10/2026) 2. Agência Brasil, \"Trump diz acompanhar de perto eleição brasileira e não declara apoio\", 01/10/2026. (acesso em 14/10/2026) 3. Diario de Pernambuco, \"Relatório da Abin alerta para risco de interferência dos EUA nas eleições\", 09/2026. (acesso em 14/10/2026) 4. Jovem Pan, \"Relatório da Abin aponta risco de interferência internacional nas eleições, mas não cita EUA\". (acesso em 14/10/2026) 5. CartaCapital, \"Campanha de Lula pede ao TSE investigação sobre fechamento de Embaixada dos EUA\", 03/10/2026. (acesso em 15/10/2026) Histórico - 14/10/2026: verbete criado. - 15/10/2026: atualizado com notícias de 13 a 15/10."}, {"id": "locais-votacao", "titulo": "Mudança de locais de votação", "tipo": "evento", "temas": ["tse", "campanhas"], "apelidos": ["locais de votação", "seções eleitorais", "seções transferidas", "Maré", "Rocinha", "TRE-RJ", "abstenção"], "data": "2026-10-16", "status": "documentado", "resumo": "4.352 seções (0,87%) mudaram de endereço para o 2º turno, por decisão das zonas eleitorais. Não há registro de decisão do presidente do TSE. No Rio, transferências por segurança desde agosto tiraram eleitores de favelas como a Maré do próprio território, e a coligação de Lula cobrou o TRE-RJ.", "revisado": "2026-10-17", "html": "<section><h3>O que aconteceu<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Até 16/10/2026, 4.352 das 499.248 seções eleitorais (0,87%) tiveram o local de votação alterado entre o 1º e o 2º turno. O número de seções não diminuiu. Os estados com mais mudanças são São Paulo (982), Minas Gerais (514), Rio de Janeiro (431) e Bahia (312).<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Segundo o <a class=\"ref\" href=\"#tse\" data-id=\"tse\">TSE<\/a>, as mudanças são decididas por cada zona eleitoral, e não de forma centralizada, e se devem a chuvas, reformas não concluídas, falta de energia e perda de acessibilidade nos prédios. A regra está na Portaria TSE 527/2026.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><\/section><section><h3>O caso do Rio de Janeiro<\/h3><p><span class=\"st st-documentado\">Documentado<\/span> Desde agosto, o TRE-RJ transferiu cerca de 270 locais de votação por razões de segurança, com cerca de 600 mil eleitores afetados. Na Maré, 52% dos eleitores tiveram de votar fora da comunidade, e a abstenção no 1º turno foi de 28,46%, contra 21,08% na média nacional. Na Rocinha, foi de 26,86%.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"4\">4<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> Em 09/10, a coligação de <a class=\"ref\" href=\"#lula\" data-id=\"lula\">Lula<\/a> pediu ao TRE-RJ aviso individual aos eleitores afetados (por SMS, WhatsApp ou e-Título), cartazes nos locais antigos e transporte gratuito em parceria com as prefeituras. Antes da petição, o TRE-RJ disse que as transferências servem para afastar seções de áreas de risco.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><\/p><\/section><section><h3>O que circula e não se confirma<\/h3><p><span class=\"st st-desmentido\">Desmentido<\/span> No 1º turno, publicações afirmaram que o ministro André Mendonça, vice-presidente do TSE, teria mudado locais de votação num reduto lulista do Rio às vésperas da eleição. O Aos Fatos classificou a informação como falsa: as mudanças foram do TRE-RJ, anunciadas em agosto.<sup class=\"fn\"><a href=\"#\" data-fonte=\"4\">4<\/a><\/sup><\/p><p><span class=\"st st-desmentido\">Desmentido<\/span> No 2º turno, vídeos afirmaram que o TSE juntou seções e mudou endereços sem justificativa, por \"economia\". A checagem da Justiça Eleitoral diz que não houve redução de seções nem ordem centralizada.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Não há registro de decisão do presidente do TSE, <a class=\"ref\" href=\"#nunes-marques\" data-id=\"nunes-marques\">Nunes Marques<\/a>, sobre locais de votação: as mudanças cabem às zonas eleitorais. Até 17/10/2026, nenhuma reportagem apontou participação dele.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><\/section><section><h3>O que está comprovado<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> As mudanças existem, são pequenas no total nacional e foram decididas localmente.<\/p><p><span class=\"st st-documentado\">Documentado<\/span> Transferências feitas por segurança no Rio coincidem com abstenção maior em favelas, onde Lula costuma ter mais votos. Não há evidência de que tenham sido feitas com esse objetivo.<\/p><\/section><section class=\"fontes\"><h3>Fontes<\/h3><ol><li id=\"f-locais-votacao-1\" value=\"1\">TSE, \"Entenda por que a Justiça Eleitoral trocou o endereço de algumas seções para o 2º turno\", 16/10/2026. <a href=\"https://www.tse.jus.br/comunicacao/noticias/2026/Outubro/entenda-por-que-a-justica-eleitoral-trocou-o-endereco-de-algumas-secoes-para-o-2o-turno\" target=\"_blank\" rel=\"noopener\">https://www.tse.jus.br/comunicacao/noticias/2026/Outubro/entenda-por-que-a-justica-eleitoral-trocou-o-endereco-de-algumas-secoes-para-o-2o-turno<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-locais-votacao-2\" value=\"2\">Justiça Eleitoral, Fato ou Boato, \"Mudanças de locais de votação no 2º turno seguem regras e atendem a necessidades de segurança\", 16/10/2026. <a href=\"https://www.justicaeleitoral.jus.br/fato-ou-boato/checagens/2026/mudancas-de-locais-de-votacao-no-2o-turno-seguem-regras-e-atendem-a-necessidades-de-seguranca\" target=\"_blank\" rel=\"noopener\">https://www.justicaeleitoral.jus.br/fato-ou-boato/checagens/2026/mudancas-de-locais-de-votacao-no-2o-turno-seguem-regras-e-atendem-a-necessidades-de-seguranca<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-locais-votacao-3\" value=\"3\">SintraMog (a partir da TVT News), \"Coligação de Lula cobra TRE-RJ por mudanças em locais de votação que afetaram 610 mil eleitores\", 13/10/2026. <a href=\"https://www.sintramog.org.br/2026/10/13/coligacao-de-lula-cobra-tre-rj-por-mudancas-em-locais-de-votacao-que-afetaram-610-mil-eleitores/\" target=\"_blank\" rel=\"noopener\">https://www.sintramog.org.br/2026/10/13/coligacao-de-lula-cobra-tre-rj-por-mudancas-em-locais-de-votacao-que-afetaram-610-mil-eleitores/<\/a> (acesso em 17/10/2026)<\/li><li id=\"f-locais-votacao-4\" value=\"4\">Aos Fatos, \"Mendonça não alterou locais de votação em reduto lulista no Rio\", 10/2026. <a href=\"https://www.aosfatos.org/noticias/mendonca-locais-votacao-rio/\" target=\"_blank\" rel=\"noopener\">https://www.aosfatos.org/noticias/mendonca-locais-votacao-rio/<\/a> (acesso em 17/10/2026)<\/li><\/ol><\/section><section class=\"hist\"><h3>Histórico<\/h3><ul><li>17/10/2026: verbete criado.<\/li><\/ul><\/section>", "texto": "O que aconteceu Até 16/10/2026, 4.352 das 499.248 seções eleitorais (0,87%) tiveram o local de votação alterado entre o 1º e o 2º turno. O número de seções não diminuiu. Os estados com mais mudanças são São Paulo (982), Minas Gerais (514), Rio de Janeiro (431) e Bahia (312). Segundo o TSE, as mudanças são decididas por cada zona eleitoral, e não de forma centralizada, e se devem a chuvas, reformas não concluídas, falta de energia e perda de acessibilidade nos prédios. A regra está na Portaria TSE 527/2026. O caso do Rio de Janeiro Desde agosto, o TRE-RJ transferiu cerca de 270 locais de votação por razões de segurança, com cerca de 600 mil eleitores afetados. Na Maré, 52% dos eleitores tiveram de votar fora da comunidade, e a abstenção no 1º turno foi de 28,46%, contra 21,08% na média nacional. Na Rocinha, foi de 26,86%. Em 09/10, a coligação de Lula pediu ao TRE-RJ aviso individual aos eleitores afetados (por SMS, WhatsApp ou e-Título), cartazes nos locais antigos e transporte gratuito em parceria com as prefeituras. Antes da petição, o TRE-RJ disse que as transferências servem para afastar seções de áreas de risco. O que circula e não se confirma No 1º turno, publicações afirmaram que o ministro André Mendonça, vice-presidente do TSE, teria mudado locais de votação num reduto lulista do Rio às vésperas da eleição. O Aos Fatos classificou a informação como falsa: as mudanças foram do TRE-RJ, anunciadas em agosto. No 2º turno, vídeos afirmaram que o TSE juntou seções e mudou endereços sem justificativa, por \"economia\". A checagem da Justiça Eleitoral diz que não houve redução de seções nem ordem centralizada. Não há registro de decisão do presidente do TSE, Nunes Marques, sobre locais de votação: as mudanças cabem às zonas eleitorais. Até 17/10/2026, nenhuma reportagem apontou participação dele. O que está comprovado As mudanças existem, são pequenas no total nacional e foram decididas localmente. Transferências feitas por segurança no Rio coincidem com abstenção maior em favelas, onde Lula costuma ter mais votos. Não há evidência de que tenham sido feitas com esse objetivo. Fontes 1. TSE, \"Entenda por que a Justiça Eleitoral trocou o endereço de algumas seções para o 2º turno\", 16/10/2026. (acesso em 17/10/2026) 2. Justiça Eleitoral, Fato ou Boato, \"Mudanças de locais de votação no 2º turno seguem regras e atendem a necessidades de segurança\", 16/10/2026. (acesso em 17/10/2026) 3. SintraMog (a partir da TVT News), \"Coligação de Lula cobra TRE-RJ por mudanças em locais de votação que afetaram 610 mil eleitores\", 13/10/2026. (acesso em 17/10/2026) 4. Aos Fatos, \"Mendonça não alterou locais de votação em reduto lulista no Rio\", 10/2026. (acesso em 17/10/2026) Histórico - 17/10/2026: verbete criado."}, {"id": "meta-ai-lula13", "titulo": "Meta AI recusa \"Lula 13\" e gera \"Flávio 22\"", "tipo": "evento", "temas": ["meta", "campanhas"], "apelidos": ["IA do WhatsApp", "Meta AI", "Lula 13", "Flávio 22", "imagens de campanha"], "data": "2026-10-14", "status": "comprovado", "resumo": "Testes de vários veículos mostraram que a IA da Meta no WhatsApp recusava imagens com \"Lula 13\" e gerava cartazes com \"Flávio 22\". A Meta diz que bloqueia todos os candidatos e que a falha foi corrigida.", "revisado": "2026-10-16", "html": "<section><h3>O que aconteceu<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Em testes publicados em 14/10/2026, o Poder360, o Terra, o Olhar Digital e a Agência Brasil pediram à Meta AI, assistente de IA do WhatsApp, imagens de campanha dos dois candidatos do 2º turno. Pedidos com \"Lula 13\" foram recusados. Pedidos com \"Flávio 22\" geraram cartazes em verde e amarelo, em um caso com slogans e supostos programas de governo.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"4\">4<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> O bloqueio não era só sobre Lula. O Terra registrou recusa também para \"Luiz Inácio\" e para \"Flávio Bolsonaro 22\". O Olhar Digital registrou recusa para \"Bolsonaro\". O que passava era o primeiro nome \"Flávio\" com o número.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><\/p><p><span class=\"st st-documentado\">Documentado<\/span> Num teste posterior do Olhar Digital, \"Flávio\", \"PL\" e \"22\" chegaram a gerar imagem e depois passaram a ser bloqueados.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><\/p><\/section><section><h3>Quem diz o quê<\/h3><p><strong><a class=\"ref\" href=\"#meta\" data-id=\"meta\">Meta<\/a><\/strong>: afirmou que \"proibiu temporariamente a recomendação de candidatos ou a geração de imagens deles\" para cumprir a legislação eleitoral, e que adotou medidas para que comandos com apenas o primeiro nome e o número na urna também não gerem imagens.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup> Ao recusar os pedidos, a própria IA respondeu que teve \"um problema técnico\" e que não tinha detalhes do motivo.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><strong>Coligação Brasil Pronto Pra Mais (<a class=\"ref\" href=\"#lula\" data-id=\"lula\">Lula<\/a>)<\/strong>: classificou o caso como \"manipulação do debate público\" e pediu ao <a class=\"ref\" href=\"#tse\" data-id=\"tse\">TSE<\/a> o fim das restrições a conteúdos da campanha, a derrubada de perfis inautênticos e a recomposição em dobro do alcance perdido, custeada pela Meta.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><p><strong>Campanha de <a class=\"ref\" href=\"#flavio-bolsonaro\" data-id=\"flavio-bolsonaro\">Flávio Bolsonaro<\/a><\/strong>: não há manifestação registrada nas fontes consultadas até 14/10/2026.<\/p><\/section><section><h3>O que está comprovado<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> O tratamento diferente entre os dois pedidos foi reproduzido por quatro veículos independentes e admitido indiretamente pela Meta, ao dizer que corrigiu a passagem do primeiro nome.<\/p><p><span class=\"st st-alegacao\">Alegação<\/span> Que a diferença tenha sido intencional. Nenhuma fonte consultada apresentou evidência de intenção, e a Meta não explicou por que o primeiro nome \"Flávio\" passava pelo bloqueio.<\/p><p><span class=\"st st-documentado\">Documentado<\/span> Segundo resumo do Latin America Daily Briefing, testes da colunista Mônica Bergamo, da Folha de S.Paulo, indicam que o assistente continuou gerando peças \"Vote Flávio\" mesmo depois da explicação da Meta. A coluna original não foi consultada.<sup class=\"fn\"><a href=\"#\" data-fonte=\"5\">5<\/a><\/sup><\/p><\/section><section><h3>Decisão do TSE<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Em 15/10/2026, o ministro Marco Aurélio Bellizze determinou que a Meta use os mesmos critérios para aceitar ou recusar pedidos de imagens políticas à sua IA, explique os parâmetros adotados e corrija falhas que comprometam a igualdade entre candidatos. Afirmou também que as falhas da ferramenta não permitem concluir que houve interferência intencional.<sup class=\"fn\"><a href=\"#\" data-fonte=\"7\">7<\/a><\/sup><\/p><\/section><section><h3>Na imprensa internacional<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> O caso foi noticiado pela AP, que o apresenta como parte da ação da campanha de Lula no TSE, e pelo New York Times, que registrou a \"indignação pública\" com o chatbot. Ver <a class=\"ref\" href=\"#repercussao-internacional\" data-id=\"repercussao-internacional\">Repercussão internacional<\/a>.<sup class=\"fn\"><a href=\"#\" data-fonte=\"5\">5<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"6\">6<\/a><\/sup><\/p><\/section><section><h3>Contexto<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> A <a class=\"ref\" href=\"#resolucao-23755\" data-id=\"resolucao-23755\">Resolução TSE 23.755/2026<\/a> proíbe que sistemas automatizados favoreçam ou desfavoreçam candidaturas, inclusive por respostas automatizadas.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><p><span class=\"st st-alegacao\">Alegação<\/span> O caso é um dos episódios citados pela campanha de Lula na acusação mais ampla de <a class=\"ref\" href=\"#meta-interferencia\" data-id=\"meta-interferencia\">interferência da Meta na eleição<\/a>.<sup class=\"fn\"><a href=\"#\" data-fonte=\"4\">4<\/a><\/sup><\/p><\/section><section class=\"fontes\"><h3>Fontes<\/h3><ol><li id=\"f-meta-ai-lula13-1\" value=\"1\">Poder360, \"Meta bloqueia 'Lula 13', mas libera 'Flávio 22' na IA do WhatsApp\", 14/10/2026. <a href=\"https://www.poder360.com.br/poder-eleicoes-2026/meta-bloqueia-lula-13-mas-libera-flavio-22-na-ia-do-whatsapp/\" target=\"_blank\" rel=\"noopener\">https://www.poder360.com.br/poder-eleicoes-2026/meta-bloqueia-lula-13-mas-libera-flavio-22-na-ia-do-whatsapp/<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-meta-ai-lula13-2\" value=\"2\">Terra, \"Meta AI no WhatsApp gera imagem de 'Flávio 22', mas recusa 'Lula 13' e 'Flávio Bolsonaro 22'\", 14/10/2026. <a href=\"https://www.terra.com.br/noticias/eleicoes/meta-ai-no-whatsapp-gera-imagem-de-flavio-22-mas-recusa-lula-13-e-flavio-bolsonaro-22,b9e8fe6be5612c0fd231ad682406c4ecgjplwayc.html\" target=\"_blank\" rel=\"noopener\">https://www.terra.com.br/noticias/eleicoes/meta-ai-no-whatsapp-gera-imagem-de-flavio-22-mas-recusa-lula-13-e-flavio-bolsonaro-22,b9e8fe6be5612c0fd231ad682406c4ecgjplwayc.html<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-meta-ai-lula13-3\" value=\"3\">Olhar Digital, \"Meta AI apresenta resultados diferentes em pedidos com Lula e Flávio\", 14/10/2026. <a href=\"https://olhardigital.com.br/2026/10/14/pro/meta-ai-apresenta-resultados-diferentes-em-pedidos-com-lula-e-flavio\" target=\"_blank\" rel=\"noopener\">https://olhardigital.com.br/2026/10/14/pro/meta-ai-apresenta-resultados-diferentes-em-pedidos-com-lula-e-flavio<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-meta-ai-lula13-4\" value=\"4\">Acessa.com, \"OEA será acionada por Lula sobre interferência da Meta nas eleições\", 10/2026. <a href=\"https://www.acessa.com/politica/2026/10/342273-oea-sera-acionada-por-lula-sobre-interferencia-da-meta-nas-eleicoes.html\" target=\"_blank\" rel=\"noopener\">https://www.acessa.com/politica/2026/10/342273-oea-sera-acionada-por-lula-sobre-interferencia-da-meta-nas-eleicoes.html<\/a> (acesso em 14/10/2026)<\/li><li id=\"f-meta-ai-lula13-5\" value=\"5\">Latin America Daily Briefing, \"Lula accuses Meta of election interference\", 10/2026. <a href=\"https://latinamericadailybriefing.substack.com/p/lula-accuses-meta-of-election-interference\" target=\"_blank\" rel=\"noopener\">https://latinamericadailybriefing.substack.com/p/lula-accuses-meta-of-election-interference<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-meta-ai-lula13-6\" value=\"6\">AP, via ClickOrlando, \"Brazil's Lula challenges Meta at electoral court for alleged algorithmic bias and AI restrictions\", 15/10/2026. <a href=\"https://www.clickorlando.com/business/2026/10/15/brazils-lula-challenges-meta-at-electoral-court-for-alleged-algorithmic-bias-and-ai-restrictions/\" target=\"_blank\" rel=\"noopener\">https://www.clickorlando.com/business/2026/10/15/brazils-lula-challenges-meta-at-electoral-court-for-alleged-algorithmic-bias-and-ai-restrictions/<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-meta-ai-lula13-7\" value=\"7\">Correio da Manhã, \"TSE impõe multa de R$ 500 mil à Meta e exige tratamento igual a Lula e Flávio\", 10/2026. <a href=\"https://www.correiodamanha.com.br/politica/2026/10/327550-tse-impoe-multa-de-rs-500-mil-a-meta-e-exige-tratamento-igual-a-lula-e-flavio.html\" target=\"_blank\" rel=\"noopener\">https://www.correiodamanha.com.br/politica/2026/10/327550-tse-impoe-multa-de-rs-500-mil-a-meta-e-exige-tratamento-igual-a-lula-e-flavio.html<\/a> (acesso em 16/10/2026)<\/li><\/ol><\/section><section class=\"hist\"><h3>Histórico<\/h3><ul><li>14/10/2026: verbete criado.<\/li><li>15/10/2026: incluída a repercussão internacional e novos fatos (MPF, teste da Folha).<\/li><li>16/10/2026: incluída a decisão do TSE de 15/10 sobre a Meta.<\/li><\/ul><\/section>", "texto": "O que aconteceu Em testes publicados em 14/10/2026, o Poder360, o Terra, o Olhar Digital e a Agência Brasil pediram à Meta AI, assistente de IA do WhatsApp, imagens de campanha dos dois candidatos do 2º turno. Pedidos com \"Lula 13\" foram recusados. Pedidos com \"Flávio 22\" geraram cartazes em verde e amarelo, em um caso com slogans e supostos programas de governo. O bloqueio não era só sobre Lula. O Terra registrou recusa também para \"Luiz Inácio\" e para \"Flávio Bolsonaro 22\". O Olhar Digital registrou recusa para \"Bolsonaro\". O que passava era o primeiro nome \"Flávio\" com o número. Num teste posterior do Olhar Digital, \"Flávio\", \"PL\" e \"22\" chegaram a gerar imagem e depois passaram a ser bloqueados. Quem diz o quê Meta : afirmou que \"proibiu temporariamente a recomendação de candidatos ou a geração de imagens deles\" para cumprir a legislação eleitoral, e que adotou medidas para que comandos com apenas o primeiro nome e o número na urna também não gerem imagens. Ao recusar os pedidos, a própria IA respondeu que teve \"um problema técnico\" e que não tinha detalhes do motivo. Coligação Brasil Pronto Pra Mais (Lula) : classificou o caso como \"manipulação do debate público\" e pediu ao TSE o fim das restrições a conteúdos da campanha, a derrubada de perfis inautênticos e a recomposição em dobro do alcance perdido, custeada pela Meta. Campanha de Flávio Bolsonaro : não há manifestação registrada nas fontes consultadas até 14/10/2026. O que está comprovado O tratamento diferente entre os dois pedidos foi reproduzido por quatro veículos independentes e admitido indiretamente pela Meta, ao dizer que corrigiu a passagem do primeiro nome. Que a diferença tenha sido intencional. Nenhuma fonte consultada apresentou evidência de intenção, e a Meta não explicou por que o primeiro nome \"Flávio\" passava pelo bloqueio. Segundo resumo do Latin America Daily Briefing, testes da colunista Mônica Bergamo, da Folha de S.Paulo, indicam que o assistente continuou gerando peças \"Vote Flávio\" mesmo depois da explicação da Meta. A coluna original não foi consultada. Decisão do TSE Em 15/10/2026, o ministro Marco Aurélio Bellizze determinou que a Meta use os mesmos critérios para aceitar ou recusar pedidos de imagens políticas à sua IA, explique os parâmetros adotados e corrija falhas que comprometam a igualdade entre candidatos. Afirmou também que as falhas da ferramenta não permitem concluir que houve interferência intencional. Na imprensa internacional O caso foi noticiado pela AP, que o apresenta como parte da ação da campanha de Lula no TSE, e pelo New York Times, que registrou a \"indignação pública\" com o chatbot. Ver repercussao-internacional. Contexto A Resolução TSE 23.755/2026 proíbe que sistemas automatizados favoreçam ou desfavoreçam candidaturas, inclusive por respostas automatizadas. O caso é um dos episódios citados pela campanha de Lula na acusação mais ampla de interferência da Meta na eleição. Fontes 1. Poder360, \"Meta bloqueia 'Lula 13', mas libera 'Flávio 22' na IA do WhatsApp\", 14/10/2026. (acesso em 14/10/2026) 2. Terra, \"Meta AI no WhatsApp gera imagem de 'Flávio 22', mas recusa 'Lula 13' e 'Flávio Bolsonaro 22'\", 14/10/2026. (acesso em 14/10/2026) 3. Olhar Digital, \"Meta AI apresenta resultados diferentes em pedidos com Lula e Flávio\", 14/10/2026. (acesso em 14/10/2026) 4. Acessa.com, \"OEA será acionada por Lula sobre interferência da Meta nas eleições\", 10/2026. (acesso em 14/10/2026) 5. Latin America Daily Briefing, \"Lula accuses Meta of election interference\", 10/2026. (acesso em 15/10/2026) 6. AP, via ClickOrlando, \"Brazil's Lula challenges Meta at electoral court for alleged algorithmic bias and AI restrictions\", 15/10/2026. (acesso em 15/10/2026) 7. Correio da Manhã, \"TSE impõe multa de R$ 500 mil à Meta e exige tratamento igual a Lula e Flávio\", 10/2026. (acesso em 16/10/2026) Histórico - 14/10/2026: verbete criado. - 15/10/2026: incluída a repercussão internacional e novos fatos (MPF, teste da Folha). - 16/10/2026: incluída a decisão do TSE de 15/10 sobre a Meta."}, {"id": "pec-6x1", "titulo": "Fim da escala 6x1 aprovado no Senado", "tipo": "evento", "temas": ["campanhas"], "apelidos": ["6x1", "escala 6x1", "PEC 6x1", "jornada de trabalho", "40 horas", "PEC 12", "negociação direta", "Mourão"], "data": "2026-10-14", "status": "comprovado", "resumo": "Em 14/10, o Senado aprovou por 75 a 1, em dois turnos, a PEC que acaba com a escala 6x1 e reduz a jornada máxima para 40 horas semanais. Flávio Bolsonaro votou a favor, a distância. A Folha relatou que ele prometeu a aliados rever pontos da PEC se eleito.", "revisado": "2026-10-15", "html": "<section><h3>O que aconteceu<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Em 14/10/2026, o Senado aprovou em dois turnos, por 75 votos a 1 em cada um, a PEC que acaba com a escala 6x1. O texto prevê cinco dias de trabalho e dois de descanso remunerado, de preferência um no domingo, e reduz a jornada máxima de 44 para 40 horas semanais, sem redução de salário, com um período de transição.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> O único voto contrário foi de Hamilton Mourão (Republicanos-RS). Como o Senado aprovou o texto sem mudanças em relação ao da Câmara, a PEC não volta aos deputados. O próximo passo é a promulgação pelo Congresso.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><\/section><section><h3>A posição de Flávio Bolsonaro<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> <a class=\"ref\" href=\"#flavio-bolsonaro\" data-id=\"flavio-bolsonaro\">Flávio Bolsonaro<\/a> votou a favor nos dois turnos, de forma remota, porque estava em campanha no Rio Grande do Sul. O senador Renan Filho criticou a ausência dele no debate.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Em 13/10, depois de visitar o pai, Flávio anunciou o voto: \"Vou votar a favor do fim da 6×1, mas a gente defende algo ainda melhor, sempre\". No mesmo dia, disse preferir \"a liberdade para o trabalhador montar sua escala de trabalho\" e manteve a defesa de que a jornada seja negociada diretamente entre patrão e empregado.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"4\">4<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Flávio é signatário de uma proposta alternativa, a PEC 12, com jornada flexível e remuneração atrelada às horas trabalhadas.<sup class=\"fn\"><a href=\"#\" data-fonte=\"5\">5<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"6\">6<\/a><\/sup><\/p><p><span class=\"st st-alegacao\">Alegação<\/span> Segundo a coluna Painel, da Folha de S.Paulo, aliados e empresários contrários à PEC disseram ter recebido \"a garantia\" de que Flávio, se eleito, reveria pontos do texto no Congresso, entre eles a troca da negociação coletiva pela negociação direta com o patrão. A informação vem de fontes ouvidas pela coluna, não de declaração pública dele.<sup class=\"fn\"><a href=\"#\" data-fonte=\"5\">5<\/a><\/sup><\/p><\/section><section><h3>Quem diz o quê<\/h3><p><strong>Campanha de Flávio<\/strong>: não há manifestação sobre o relato da Folha nas fontes consultadas até 15/10/2026.<\/p><p><strong>Fiesp<\/strong>: posicionou-se formalmente contra o fim da 6x1, citando prejuízo às empresas.<sup class=\"fn\"><a href=\"#\" data-fonte=\"4\">4<\/a><\/sup><\/p><p><strong><a class=\"ref\" href=\"#lula\" data-id=\"lula\">Lula<\/a><\/strong>: tem o fim da 6x1 como uma das bandeiras da campanha.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><\/p><\/section><section class=\"fontes\"><h3>Fontes<\/h3><ol><li id=\"f-pec-6x1-1\" value=\"1\">Congresso em Foco, \"Por 75 votos a um, Senado aprova PEC do fim da escala 6x1\", 14/10/2026. <a href=\"https://www.congressoemfoco.com.br/noticia/123241/por-75-votos-a-um-senado-aprova-pec-do-fim-da-escala-6x1\" target=\"_blank\" rel=\"noopener\">https://www.congressoemfoco.com.br/noticia/123241/por-75-votos-a-um-senado-aprova-pec-do-fim-da-escala-6x1<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-pec-6x1-2\" value=\"2\">DOL, \"Fim da escala 6x1: veja como votaram os senadores\", 10/2026. <a href=\"https://amp.dol.com.br/noticias/brasil/965565/fim-da-escala-6x1-veja-como-votaram-os-senadores\" target=\"_blank\" rel=\"noopener\">https://amp.dol.com.br/noticias/brasil/965565/fim-da-escala-6x1-veja-como-votaram-os-senadores<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-pec-6x1-3\" value=\"3\">NSC Total, \"Após ver Bolsonaro, Flávio apoia fim da escala 6x1, mas volta a defender negociação entre patrão e empregado\", 13/10/2026. <a href=\"https://www.nsctotal.com.br/politica/apos-ver-bolsonaro-flavio-apoia-fim-da-escala-6x1-mas-volta-a-defender-negociacao-entre-patrao-e-empregado\" target=\"_blank\" rel=\"noopener\">https://www.nsctotal.com.br/politica/apos-ver-bolsonaro-flavio-apoia-fim-da-escala-6x1-mas-volta-a-defender-negociacao-entre-patrao-e-empregado<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-pec-6x1-4\" value=\"4\">Brasil de Fato, \"Flávio Bolsonaro indica a aliados que pode revisar fim da 6×1\", 14/10/2026. <a href=\"https://www.brasildefato.com.br/2026/10/14/flavio-bolsonaro-indica-a-aliados-que-pode-revisar-fim-da-6x1-apos-dizer-que-votaria-a-favor-da-medida/\" target=\"_blank\" rel=\"noopener\">https://www.brasildefato.com.br/2026/10/14/flavio-bolsonaro-indica-a-aliados-que-pode-revisar-fim-da-6x1-apos-dizer-que-votaria-a-favor-da-medida/<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-pec-6x1-5\" value=\"5\">CUT, \"Flávio diz apoiar fim da 6x1, mas promete rever lei se for eleito, aponta Folha\", 14/10/2026 (resumo de reportagem da Folha de 13/10). <a href=\"https://www.cut.org.br/noticias/flavio-diz-apoiar-fim-da-6x1-mas-promete-rever-lei-se-for-eleito-aponta-folha-c69f\" target=\"_blank\" rel=\"noopener\">https://www.cut.org.br/noticias/flavio-diz-apoiar-fim-da-6x1-mas-promete-rever-lei-se-for-eleito-aponta-folha-c69f<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-pec-6x1-6\" value=\"6\">Nexo, \"O Congresso aprovou o fim da 6 por 1. Isso pode ser revertido?\", 15/10/2026. <a href=\"https://www.nexojornal.com.br/expresso/2026/10/15/votacao-do-fim-da-escala-6x1-flavio-bolsonaro-pode-proibir\" target=\"_blank\" rel=\"noopener\">https://www.nexojornal.com.br/expresso/2026/10/15/votacao-do-fim-da-escala-6x1-flavio-bolsonaro-pode-proibir<\/a> (acesso em 15/10/2026)<\/li><\/ol><\/section><section class=\"hist\"><h3>Histórico<\/h3><ul><li>15/10/2026: verbete criado.<\/li><\/ul><\/section>", "texto": "O que aconteceu Em 14/10/2026, o Senado aprovou em dois turnos, por 75 votos a 1 em cada um, a PEC que acaba com a escala 6x1. O texto prevê cinco dias de trabalho e dois de descanso remunerado, de preferência um no domingo, e reduz a jornada máxima de 44 para 40 horas semanais, sem redução de salário, com um período de transição. O único voto contrário foi de Hamilton Mourão (Republicanos-RS). Como o Senado aprovou o texto sem mudanças em relação ao da Câmara, a PEC não volta aos deputados. O próximo passo é a promulgação pelo Congresso. A posição de Flávio Bolsonaro Flávio Bolsonaro votou a favor nos dois turnos, de forma remota, porque estava em campanha no Rio Grande do Sul. O senador Renan Filho criticou a ausência dele no debate. Em 13/10, depois de visitar o pai, Flávio anunciou o voto: \"Vou votar a favor do fim da 6×1, mas a gente defende algo ainda melhor, sempre\". No mesmo dia, disse preferir \"a liberdade para o trabalhador montar sua escala de trabalho\" e manteve a defesa de que a jornada seja negociada diretamente entre patrão e empregado. Flávio é signatário de uma proposta alternativa, a PEC 12, com jornada flexível e remuneração atrelada às horas trabalhadas. Segundo a coluna Painel, da Folha de S.Paulo, aliados e empresários contrários à PEC disseram ter recebido \"a garantia\" de que Flávio, se eleito, reveria pontos do texto no Congresso, entre eles a troca da negociação coletiva pela negociação direta com o patrão. A informação vem de fontes ouvidas pela coluna, não de declaração pública dele. Quem diz o quê Campanha de Flávio : não há manifestação sobre o relato da Folha nas fontes consultadas até 15/10/2026. Fiesp : posicionou-se formalmente contra o fim da 6x1, citando prejuízo às empresas. Lula : tem o fim da 6x1 como uma das bandeiras da campanha. Fontes 1. Congresso em Foco, \"Por 75 votos a um, Senado aprova PEC do fim da escala 6x1\", 14/10/2026. (acesso em 15/10/2026) 2. DOL, \"Fim da escala 6x1: veja como votaram os senadores\", 10/2026. (acesso em 15/10/2026) 3. NSC Total, \"Após ver Bolsonaro, Flávio apoia fim da escala 6x1, mas volta a defender negociação entre patrão e empregado\", 13/10/2026. (acesso em 15/10/2026) 4. Brasil de Fato, \"Flávio Bolsonaro indica a aliados que pode revisar fim da 6×1\", 14/10/2026. (acesso em 15/10/2026) 5. CUT, \"Flávio diz apoiar fim da 6x1, mas promete rever lei se for eleito, aponta Folha\", 14/10/2026 (resumo de reportagem da Folha de 13/10). (acesso em 15/10/2026) 6. Nexo, \"O Congresso aprovou o fim da 6 por 1. Isso pode ser revertido?\", 15/10/2026. (acesso em 15/10/2026) Histórico - 15/10/2026: verbete criado."}, {"id": "primeiro-turno-2026", "titulo": "1º turno de 2026", "tipo": "evento", "temas": ["campanhas"], "apelidos": ["primeiro turno", "resultado", "pesquisas", "Datafolha", "Quaest", "abstenção", "segundo turno"], "data": "2026-10-04", "status": "comprovado", "resumo": "Flávio Bolsonaro 47,03%, Lula 45,16%, diferença de 2,2 milhões de votos. Abstenção de 21,08%, a maior desde 1998. 2º turno em 25/10, com as pesquisas em empate técnico.", "revisado": "2026-10-17", "html": "<section><h3>Resultado<\/h3><p><span class=\"st st-comprovado\">Comprovado<\/span> Com 100% das seções apuradas:<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><div class=\"tbl\"><table><thead><tr><th>Candidato<\/th><th>Votos válidos<\/th><\/tr><\/thead><tbody><tr><td>[[flavio-bolsonaro<\/td><td>Flávio Bolsonaro]] (PL)<\/td><td>47,03% (56.104.503)<\/td><\/tr><tr><td>[[lula<\/td><td>Lula]] (PT)<\/td><td>45,16% (53.879.538)<\/td><\/tr><tr><td>Augusto Cury (Avante)<\/td><td>2,89%<\/td><\/tr><tr><td>Renan Santos (Missão)<\/td><td>2,24%<\/td><\/tr><tr><td>Ronaldo Caiado (PSD)<\/td><td>2,18%<\/td><\/tr><\/tbody><\/table><\/div><p><span class=\"st st-comprovado\">Comprovado<\/span> A abstenção foi de 21,08%, a maior desde 1998. O 2º turno é em 25/10/2026.<sup class=\"fn\"><a href=\"#\" data-fonte=\"1\">1<\/a><\/sup><\/p><\/section><section><h3>Onde os votos mudaram<\/h3><p><span class=\"st st-documentado\">Documentado<\/span> Segundo análise de Marco Antonio Faganello (FGV/CEPESP), Lula perdeu mais votos em relação a 2022 em municípios pequenos e com peso do agro (até 9% em cidades de até 5 mil habitantes com mais de metade do PIB no agro), no Sul e no Centro-Oeste. Quase não perdeu nas capitais. A abstenção e a proporção de evangélicos não explicaram a queda. Flávio teve cerca de 5 milhões de votos a mais que Jair Bolsonaro em 2022.<sup class=\"fn\"><a href=\"#\" data-fonte=\"2\">2<\/a><\/sup><\/p><\/section><section><h3>Pesquisas do 2º turno<\/h3><div class=\"tbl\"><table><thead><tr><th>Instituto<\/th><th>Campo<\/th><th>Flávio<\/th><th>Lula<\/th><th>Margem<\/th><\/tr><\/thead><tbody><tr><td>Quaest<\/td><td>10 a 13/09<\/td><td>42%<\/td><td>40%<\/td><td>2 p.p.<\/td><\/tr><tr><td>Datafolha<\/td><td>divulgada em 08/10<\/td><td>49% (votos totais)<\/td><td>45% (votos totais)<\/td><td>não informada na fonte<\/td><\/tr><tr><td>Quaest<\/td><td>10 a 13/10<\/td><td>46%<\/td><td>44%<\/td><td>2 p.p.<\/td><\/tr><tr><td>Datafolha<\/td><td>13 e 14/10<\/td><td>51% (votos válidos)<\/td><td>49% (votos válidos)<\/td><td>2 p.p.<\/td><\/tr><tr><td>PoderData<\/td><td>13 a 15/10<\/td><td>50% (votos válidos)<\/td><td>50% (votos válidos)<\/td><td>1,8 p.p.<\/td><\/tr><tr><td>CNT/MDA<\/td><td>13 a 15/10<\/td><td>50,5% (votos válidos)<\/td><td>49,5% (votos válidos)<\/td><td>2,2 p.p.<\/td><\/tr><\/tbody><\/table><\/div><p><span class=\"st st-comprovado\">Comprovado<\/span> Todas as pesquisas divulgadas até 17/10 mostram empate técnico. A vantagem de Flávio no Datafolha caiu de 52% a 48% para 51% a 49% nos votos válidos.<sup class=\"fn\"><a href=\"#\" data-fonte=\"9\">9<\/a><\/sup><\/p><p><span class=\"st st-comprovado\">Comprovado<\/span> Na Quaest de setembro, os dois tinham 55% de rejeição. Na de 10 a 13/10, com 2.154 entrevistas, a rejeição foi de 54% para Flávio e 53% para Lula; brancos e nulos somaram 9%.<sup class=\"fn\"><a href=\"#\" data-fonte=\"3\">3<\/a><\/sup><sup class=\"fn\"><a href=\"#\" data-fonte=\"4\">4<\/a><\/sup><sup class=\"fn\"><a href= a/eleicoes/pesquisa-quaest-presidente-flavio-lula-2026/\" target=\"_blank\" rel=\"noopener\">https://www.spagora.com.br/politica/eleicoes/pesquisa-quaest-presidente-flavio-lula-2026/<\/a> (acesso em 15/10/2026)<\/li><li id=\"f-primeiro-turno-2026-9\" value=\"9\">Poder360, \"Saiba como estão Lula e Flávio nas pesquisas a 8 dias do 2º turno\", 17/10/2026. <a href=\"https://www.poder360.com.br/poder-eleicoes-2026/leia-como-estao-lula-e-flavio-nas-pesquisas-a-8-dias-do-2o-turno/\" target=\"_blank\" rel=\"noopener\">https://www.poder360.com.br/poder-eleicoes-2026/leia-como-estao-lula-e-flavio-nas-pesquisas-a-8-dias-do-2o-turno/<\/a> (acesso em 17/10/2026)<\/li><\/ol><\/section><section class=\"hist\"><h3>Histórico<\/h3><ul><li>14/10/2026: verbete criado.<\/li><li>15/10/2026: atualizado com notícias de 13 a 15/10.<\/li><li>17/10/2026: atualizado com notícias de 16 e 17/10.<\/li><\/ul><\/section>", "texto": "Resultado Com 100% das seções apuradas: Candidato Votos válidos --- --- Flávio Bolsonaro (PL) 47,03% (56.104.503) Lula (PT) 45,16% (53.879.538) Augusto Cury (Avante) 2,89% Renan Santos (Missão) 2,24% Ronaldo Caiado (PSD) 2,18% A abstenção foi de 21,08%, a maior desde 1998. O 2º turno é em 25/10/2026. Onde os votos mudaram Segundo análise de Marco Antonio Faganello (FGV/CEPESP), Lula perdeu mais votos em relação a 2022 em municípios pequenos e com peso do agro (até 9% em cidades de até 5 mil habitantes com mais de metade do PIB no agro), no Sul e no Centro-Oeste. Quase não perdeu nas capitais. A abstenção e a proporção de evangélicos não explicaram a queda. Flávio teve cerca de 5 milhões de votos a mais que Jair Bolsonaro em 2022. Pesquisas do 2º turno Instituto Campo Flávio Lula Margem --- --- --- --- --- Quaest 10 a 13/09 42% 40% 2 p.p. Datafolha divulgada em 08/10 49% (votos totais) 45% (votos totais) não informada na fonte Quaest 10 a 13/10 46% 44% 2 p.p. Datafolha 13 e 14/10 51% (votos válidos) 49% (votos válidos) 2 p.p. PoderData 13 a 15/10 50% (votos válidos) 50% (votos válidos) 1,8 p.p. CNT/MDA 13 a 15/10 50,5% (votos válidos) 49,5% (votos válidos) 2,2 p.p. Todas as pesquisas divulgadas até 17/10 mostram empate técnico. A vantagem de Flávio no Datafolha caiu de 52% a 48% para 51% a 49% nos votos válidos. Na Quaest de setembro, os dois tinham 55% de rejeição. Na de 10 a 13/10, com 2.154 entrevistas, a rejeição foi de 54% para Flávio e 53% para Lula; brancos e nulos somaram 9%. Apoios Caiado declarou apoio a Flávio em 06/10; o PSD ficou neutro. Augusto Cury declarou apoio a Flávio em 08/10, condicionado a um termo com oito prioridades assinado pelo candidato. Renan Santos não declarou voto e criticou o apoio de Cury. Fontes 1. Portal de Prefeitura, \"Eleições 2026: com 100% das seções totalizadas, Flávio tem 47,03%\", 05/10/2026. (acesso em 14/10/2026) 2. Agência Pública, \"Como o agro e o interior podem explicar diminuição de votos para Lula\", 10/2026. (acesso em 14/10/2026) 3. A Crítica, \"Quaest: Flávio Bolsonaro e Lula no 2º turno\", 14/09/2026. (acesso em 14/10/2026) 4. O Liberal, \"Datafolha: Flávio Bolsonaro tem 49% e Lula 45% no 2º turno\", 08/10/2026. (acesso em 14/10/2026) 5. Diário do Nordeste, \"Ronaldo Caiado anuncia apoio a Flávio Bolsonaro no 2º turno\", 06/10/2026. (acesso em 14/10/2026) 6. A Gazeta, \"Caiado, Renan Santos e Cury não declaram voto no 2º turno e criticam polarização\", 05/10/2026. (acesso em 14/10/2026) 7. Times Brasil, \"Renan Santos critica declaração de apoio de Augusto Cury a Flávio Bolsonaro\", 10/2026. (acesso em 14/10/2026) 8. SP Agora, \"Pesquisa Quaest: Flávio Bolsonaro tem 46% e Lula, 44% no segundo turno\", 14/10/2026. (acesso em 15/10/2026) 9. Poder360, \"Saiba como estão Lula e Flávio nas pesquisas a 8 dias do 2º turno\", 17/10/2026. (acesso em 17/10/2026) Histórico - 14/10/2026: verbete criado. - 15/10/2026: atualizado com notícias de 13 a 15/10. - 17/10/2026: atualizado com notícias de 16 e 17/10."}, {"id": "tarifaco-2025", "titulo": "Tarifaço de 2025", "tipo": "evento", "temas
